et me know. Could someone please phone me back today?",level:"B2",questions:[{id:"ls007q1",skill:"listening",type:"inference",prompt:"Why is the caller most frustrated?",options:["The sofa is the wrong colour","No one told them about the delay","The price was too high","The line was busy"],answer:1,explanation:"They say they’d have appreciated a call to warn them of the delay.",level:"B2",topic:"Speaker attitude"},{id:"ls007q2",skill:"listening",type:"inference",prompt:"What does the caller want?",options:["A refund","A call back today","A new order","A discount"],answer:1,explanation:"They ask someone to phone them back today.",level:"B2",topic:"Intention"}]}],kl=[{id:"sp001",part:1,prompt:"Tell me about the town or city where you live.",seconds:30,level:"B1",topic:"Hometown",sampleAnswer:"I live in a medium-sized coastal city. It's lively but not too crowded, and I especially like the old town, where there are lots of small cafés. The weather is mild most of the year, which makes it easy to spend time outdoors."},{id:"sp002",part:1,prompt:"What do you usually do at the weekend?",seconds:30,level:"B1",topic:"Free time",sampleAnswer:"At weekends I like to relax and catch up with friends. On Saturdays I often go for a long walk or meet people for coffee, and on Sundays I usually cook something at home and read. I try to stay off my phone a bit more than during the week."},{id:"sp003",part:1,prompt:"Tell me about a subject you enjoyed studying.",seconds:30,level:"B1",topic:"Studies",sampleAnswer:"I really enjoyed studying geography at school. I liked learning how cities grow and why people move from one place to another. The teacher used lots of maps and real examples, which made it feel relevant rather than just facts to memorise."},{id:"sp004",part:1,prompt:"What kind of music do you like?",seconds:30,level:"B1",topic:"Preferences",sampleAnswer:"I listen to quite a wide range, but I mostly enjoy relaxed music with acoustic guitar. I put it on while I'm working or cooking. I'm not very keen on very loud electronic music, although I don't mind it at a party."},{id:"sp005",part:1,prompt:"Describe a typical meal in your country.",seconds:30,level:"B1",topic:"Food",sampleAnswer:"A typical meal where I'm from usually starts with a small salad or soup, followed by a main dish with meat or fish and vegetables. We often eat together as a family and take our time, so lunch can last quite a while at weekends."},{id:"sp006",part:1,prompt:"What did you do on your last holiday?",seconds:30,level:"B1",topic:"Travel",sampleAnswer:"On my last holiday I visited the mountains for a few days. I went hiking every morning and relaxed in the afternoons. The air was fresh and it was a real change from the city. I came back feeling much more rested."},{id:"sp007",part:1,prompt:"Tell me about your best friend.",seconds:30,level:"B1",topic:"People",sampleAnswer:"My best friend and I have known each other since school. She's very calm and always gives sensible advice, which balances me out because I can be impatient. We don't see each other every week, but when we do, it feels like no time has passed."},{id:"sp008",part:1,prompt:"How do you usually travel around your city?",seconds:30,level:"B1",topic:"Transport",sampleAnswer:"I mostly get around by public transport and on foot. The bus network is quite good, so I rarely need a car in the centre. For longer trips I use the train, which is usually faster than driving because of the traffic."},{id:"sp009",part:2,prompt:"Describe a photo of people working together in an office.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In the picture I can see a small group of colleagues gathered around a table, looking at a laptop. They seem to be discussing a project, because one person is pointing at the screen while the others listen. The atmosphere looks relaxed but focused, and there are notebooks and coffee cups on the table, which suggests they've been there for a while."},{id:"sp010",part:2,prompt:"Describe a photo of a busy street market.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"This photo shows a lively outdoor market on what looks like a sunny morning. There are several stalls selling fruit and vegetables, and quite a few shoppers walking between them with bags. In the foreground a vendor is weighing something for a customer. The whole scene feels cheerful and full of energy."},{id:"sp011",part:2,prompt:"Describe a photo of a family having dinner at home.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In this image a family of four is sitting around a dining table, sharing a meal. They all look happy and relaxed, and one of the children is laughing at something. There are dishes of food in the middle of the table, so it seems like an informal, home-cooked dinner rather than a special occasion."},{id:"sp012",part:2,prompt:"Describe a photo of someone exercising outdoors.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"The picture shows a person jogging along a path in a park early in the morning. She's wearing sports clothes and headphones, and there are trees on both sides. The light is soft, so I'd guess it's just after sunrise. She looks determined and seems to be enjoying the quiet."},{id:"sp013",part:2,prompt:"Describe a photo of a classroom.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In the photo there's a bright classroom with rows of desks and a teacher standing at the front near a whiteboard. Several students have their hands raised, which suggests the teacher has just asked a question. The room is decorated with posters, so it looks like a welcoming place to learn."},{id:"sp014",part:2,prompt:"Describe a photo of a beach on a summer day.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"This photo captures a wide, sandy beach on a hot summer afternoon. There are families under colourful umbrellas and a few people swimming in the sea. In the distance I can see some boats on the horizon. The sky is completely clear, and the whole scene looks very relaxing."},{id:"sp015",part:2,prompt:"Describe a photo of a train station.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"The image shows the inside of a busy train station. People are hurrying across the concourse with suitcases, and there's a large departure board on the wall. A train is waiting at one of the platforms. Everyone seems to be in a rush, which is typical of a station at a busy time of day."},{id:"sp016",part:2,prompt:"Describe a photo of a garden in spring.",seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In this picture there's a colourful garden full of flowers in bloom. There are neat flower beds and a small wooden bench under a tree. The colours are very bright, mostly reds and yellows, which tells me it's probably spring. It looks like a peaceful place to sit and relax."},{id:"sp017",part:3,prompt:"Compare studying alone with studying in a group. Which do you prefer and why?",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Both approaches have clear advantages. Studying alone lets you work at your own pace and concentrate deeply, which suits complex topics. Studying in a group, on the other hand, means you can share ideas and stay motivated. Personally, I prefer a mix: I study new material alone first, then meet others to test my understanding."},{id:"sp018",part:3,prompt:"Compare travelling by plane with travelling by train. What are the pros and cons?",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Planes are usually much faster for long distances, which is their main advantage. However, trains take you straight into the city centre and let you see the landscape, and I find them more comfortable and less stressful. For a shorter journey I'd almost always choose the train, even if it takes a bit longer."},{id:"sp019",part:3,prompt:"Compare living in a city with living in the countryside.",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"City life offers convenience, jobs and things to do, but it can be noisy and expensive. The countryside is quieter and closer to nature, though it may feel isolated and offer fewer opportunities. It really depends on your stage of life; I'd choose the city now but might prefer the countryside later."},{id:"sp020",part:3,prompt:"Some people shop online; others prefer physical shops. Compare the two.",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Online shopping is convenient and often cheaper, and you can compare prices easily. In a physical shop, though, you can see and try things before buying, and you get them immediately. I tend to buy everyday items online but still prefer going to a shop for clothes or anything I need to try on."},{id:"sp021",part:3,prompt:"Compare reading a book with watching a film of the same story.",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"A book usually gives you more detail and lets you imagine the characters yourself, which I find rewarding. A film is quicker and brings the story to life visually, but it has to leave things out. Ideally I read the book first and then watch the film to see how the director interpreted it."},{id:"sp022",part:3,prompt:"Compare working from home with working in an office.",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Working from home saves commuting time and gives you flexibility, but it can feel isolating and the line between work and rest gets blurred. The office makes it easier to collaborate and switch off at the end of the day. A hybrid arrangement seems to combine the best of both."},{id:"sp023",part:3,prompt:"Compare learning a language in a classroom with learning it by living abroad.",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"A classroom gives you structure, clear explanations and correction, which is great for building foundations. Living abroad forces you to use the language constantly, so you improve your fluency and confidence fast. The ideal is to build the basics in class and then spend time abroad to bring it to life."},{id:"sp024",part:3,prompt:"Compare spending money on experiences with spending it on possessions.",seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Buying possessions gives you something lasting that you can use every day. Experiences, though, tend to create stronger memories and often mean more over time. I lean towards experiences, like travel or concerts, because the objects I've bought rarely stay exciting for long."},{id:"sp025",part:4,prompt:"Talk about a time you had to solve a difficult problem. What was the situation, and what have you learned about solving problems in general?",seconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"Once, our team's project was almost derailed when a key member left suddenly. I had to reorganise the tasks and learn part of their work quickly. It was stressful, but breaking the problem into small steps helped a lot. More generally, I've learned that staying calm and asking for help early usually matters more than trying to solve everything alone. Problems feel smaller once you start acting on them."},{id:"sp026",part:4,prompt:"Describe a place that is special to you. Why do places become important in people's lives?",seconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"A small library near my old home is special to me because I spent countless afternoons there as a teenager. It's where I first fell in love with reading. I think places become important because of the memories and emotions we attach to them, not the buildings themselves. A very ordinary spot can matter enormously simply because of what happened to us there."},{id:"sp027",part:4,prompt:"Talk about a skill you would like to learn. Why do people keep learning new things throughout their lives?",seconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"I'd love to learn to play the piano, mainly because music relaxes me and I admire people who can play. I think people keep learning throughout life for several reasons: curiosity, the satisfaction of getting better at something, and simply to keep the mind active. Learning also gives us a sense of progress, which is important at any age."},{id:"sp028",part:4,prompt:"Describe a decision you found difficult. How can people make better decisions?",seconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"Choosing which course to study was hard, because I was pulled between what interested me and what seemed practical. I eventually followed my interest and haven't regretted it. To make better decisions, I think it helps to gather information, imagine living with each option, and talk to people you trust, while accepting that no choice is ever perfect."},{id:"sp029",part:4,prompt:"Talk about a change you have made in your daily routine. Why is it hard for people to change habits?",seconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"Recently I started going to bed earlier, which has made a real difference to my energy. It was surprisingly hard at first. I think changing habits is difficult because our routines feel automatic and comfortable, and change requires constant effort until the new behaviour becomes natural. Starting small and being patient with yourself makes it far more likely to stick."},{id:"sp030",part:4,prompt:"Describe something you own that is important to you. Do you think people rely too much on possessions?",seconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"An old watch my grandfather gave me is important to me, not for its value but for what it represents. I do think some people rely too much on possessions, expecting objects to make them happy in a lasting way. In my experience, relationships and experiences bring far deeper satisfaction, though a few meaningful objects can carry real emotional weight."}],xl=[{id:"wr001",part:1,title:"Word-level answers (club form)",prompt:`You are joining a photography club. Answer these questions with 1-5 words each:
1) What is your first name?
2) How old are you?
3) What is your favourite type of photo?
4) How often do you take photos?
5) Why do you want to join?`,minWords:15,seconds:180,level:"B1",sampleAnswer:`1) Marc.
2) Twenty-six.
3) Landscapes and nature.
4) Almost every day.
5) To improve and meet people.`},{id:"wr002",part:1,title:"Word-level answers (library card)",prompt:`You are applying for a library card. Answer with 1-5 words each:
1) What is your name?
2) Which city do you live in?
3) What kind of books do you like?
4) How many books do you read a month?
5) When can you usually visit?`,minWords:15,seconds:180,level:"B1",sampleAnswer:`1) Laura Pons.
2) Valencia.
3) Crime novels and history.
4) About three.
5) Weekday evenings.`},{id:"wr003",part:2,title:"Short informal text (new gym)",prompt:"You have joined a new gym. Write a short message (about 30-40 words) to the gym telling them why you joined and what you hope to achieve.",minWords:30,seconds:420,level:"B2",sampleAnswer:"Hi, I've just signed up because I want to get fitter and build a regular routine. My main goals are to improve my stamina and feel more energetic during the week. I'm hoping to attend classes three times a week. Thanks!"},{id:"wr004",part:2,title:"Short informal text (cooking class)",prompt:"You have signed up for an online cooking class. Write about 30-40 words explaining why you joined and what you'd like to learn.",minWords:30,seconds:420,level:"B2",sampleAnswer:"Hello! I joined because I usually cook the same few meals and want more variety. I'd love to learn some quick vegetarian dishes and improve my basic knife skills. I'm a complete beginner, so any patient guidance is very welcome. Thanks!"},{id:"wr005",part:3,title:"Three social responses (travel forum)",prompt:`You are on a travel forum. Reply to these three comments (about 30-40 words each):
1) 'I'm nervous about travelling alone for the first time.'
2) 'What's the best way to save money while travelling?'
3) 'Do you prefer cities or nature when you travel?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) Don't worry too much — I felt the same at first, but travelling alone becomes liberating quickly. Start with a friendly, well-connected city, tell someone your plans, and you'll gain confidence within a day or two.

2) The biggest savings come from being flexible with dates and travelling slightly off-season. I also cook some meals myself and use public transport rather than taxis, which adds up over a trip.

3) Honestly, a mix of both. I love a couple of days exploring a lively city, then escaping to somewhere quiet in nature to recover. The contrast makes each part feel more special.`},{id:"wr006",part:3,title:"Three social responses (book club)",prompt:`You are in an online book club. Reply to these three comments (about 30-40 words each):
1) 'I never have time to read anymore.'
2) 'Should we read classics or modern novels next?'
3) 'Do audiobooks count as reading?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) I understand completely — life gets busy. What helped me was reading just ten minutes before bed. It sounds small, but it adds up, and it's a lovely way to switch off from screens.

2) Why not alternate? A classic one month and something modern the next keeps things fresh and gives everyone a turn. Variety usually keeps a club more engaged than sticking to one style.

3) In my opinion, yes. You're still following the story, characters and ideas — you're just using your ears. Audiobooks are perfect for commuting or chores, and they've kept me 'reading' during busy weeks.`},{id:"wr007",part:4,title:"Formal email (complaint about a course)",prompt:"You recently attended a weekend training course that did not meet your expectations. Write a formal email (120-150 words) to the organiser. Explain what the problems were and say what you would like them to do.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Sir or Madam,

I am writing regarding the weekend training course on digital marketing that I attended on 5-6 April. Unfortunately, several aspects fell short of what was advertised.

Firstly, the sessions started late on both days, which reduced the time available for the practical exercises I had particularly looked forward to. Secondly, the promised course materials were never provided, making it difficult to review the content afterwards.

While the trainer was knowledgeable, these issues significantly affected the value of the course. I would therefore appreciate it if you could send me the missing materials and consider a partial refund to reflect the lost session time.

I look forward to your response and hope we can resolve this matter promptly.

Yours faithfully,
Marc Vidal`},{id:"wr008",part:4,title:"Formal email (request to reschedule)",prompt:"You have booked a place at a conference but can no longer attend on the given dates. Write a formal email (120-150 words) to the organisers explaining the situation and asking about your options.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Conference Team,

I am writing about my registration for the Annual Design Conference scheduled for 12-13 June, reference number 4471.

Regrettably, an unavoidable work commitment now prevents me from attending on those dates, and I am keen to understand what options are available to me. Specifically, I would like to know whether my place can be transferred to next year's event, or whether a colleague could attend in my place using the same booking.

If neither option is possible, I would be grateful for information about your cancellation and refund policy. I apologise for any inconvenience this may cause and would appreciate your guidance on the best way forward.

Thank you for your understanding. I look forward to hearing from you.

Yours faithfully,
Laura Pons`},{id:"wr009",part:4,title:"Formal email (application follow-up)",prompt:"Two weeks ago you applied for a part-time job and have not heard back. Write a formal email (120-150 words) to the employer politely asking about the status of your application.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Ms Turner,

I am writing to follow up on my application for the part-time Customer Support Assistant position, which I submitted on 20 May.

I remain very interested in the role and in the opportunity to contribute to your team, so I wanted to check whether a decision has been made or whether any further information is required from my side. If it would be helpful, I would be glad to provide additional references or to attend an interview at your convenience.

I appreciate that you are likely dealing with many applications, and I do not wish to rush your process. However, a brief update on the current status would be greatly appreciated.

Thank you for your time and consideration.

Yours sincerely,
Marc Vidal`},{id:"wr010",part:2,title:"Short informal text (language exchange)",prompt:"You joined a language exchange app. Write about 30-40 words saying which languages you speak, which you want to practise, and what you hope to get from it.",minWords:30,seconds:420,level:"B2",sampleAnswer:"Hi everyone! I'm a native Spanish speaker and I'm fairly comfortable in English, but I'd love to practise speaking more naturally. In return, I'm happy to help anyone learning Spanish. I'm hoping to make the exchange relaxed and regular. Nice to meet you!"},{id:"wr011",part:3,title:"Three social responses (fitness group)",prompt:`You are in an online fitness group. Reply to these three comments (about 30-40 words each):
1) 'I keep losing motivation after a few weeks.'
2) 'Is it better to exercise in the morning or evening?'
3) 'Any tips for staying active with a busy job?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) That's so common — motivation naturally dips. What works for me is setting tiny, unmissable goals and tracking them, so I see progress even on low-energy days. Habits beat willpower.

2) Honestly, whichever you'll actually stick to. Mornings suit me because nothing interrupts them, but plenty of people have more energy later. The 'best' time is the one you can keep.

3) Build movement into the day: take the stairs, walk during calls, and do short home workouts. Ten focused minutes daily beats a two-hour session you never find time for.`},{id:"wr012",part:1,title:"Word-level answers (volunteer sign-up)",prompt:`You are signing up to volunteer at a local festival. Answer with 1-5 words each:
1) What is your name?
2) Which day can you help?
3) What kind of task do you prefer?
4) Do you have any experience?
5) How can we contact you?`,minWords:15,seconds:180,level:"B1",sampleAnswer:`1) Aisha Karim.
2) Saturday afternoon.
3) Helping at the info desk.
4) Yes, two festivals.
5) By email, please.`},{id:"wr013",part:2,title:"Short informal text (running app)",prompt:"You started using a running app. Write about 30-40 words on why you started and your goal.",minWords:30,seconds:420,level:"B2",sampleAnswer:"Hi! I started using the app to stay consistent, because I always give up after a week or two. My goal is to run five kilometres without stopping by the end of the summer. Fingers crossed the reminders keep me honest!"},{id:"wr014",part:2,title:"Short informal text (art class)",prompt:"You joined a weekend painting class. Write about 30-40 words on why and what you'd like to improve.",minWords:30,seconds:420,level:"B2",sampleAnswer:"Hello! I joined because painting relaxes me and I want a screen-free hobby. I'd really like to improve my use of colour and get more confident with watercolours. I'm a beginner, so I'm mainly here to enjoy it and learn slowly."},{id:"wr015",part:3,title:"Three social responses (film club)",prompt:`Reply to three comments (about 30-40 words each):
1) 'I find subtitled films tiring.'
2) 'Which is better, cinema or streaming at home?'
3) 'Do sequels ruin good films?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) I felt that way too until I got used to them. After a few films your eyes stop noticing, and hearing the original voices really adds something. Start with a film you already know well.

2) Both have their place. The cinema is an event — the big screen and sound are hard to beat. But streaming is comfortable and flexible, so I probably watch more at home overall.

3) Not always. A good sequel can deepen the story, but too many are made just for money and feel hollow. When there's a genuine story left to tell, they can absolutely work.`},{id:"wr016",part:4,title:"Formal email (booking error)",prompt:"A hotel charged you for a night you did not stay. Write a formal email (120-150 words) explaining the problem and requesting a refund.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Reservations Team,

I am writing regarding my recent stay at your hotel from 3 to 5 July, booking reference 8823.

On reviewing my final invoice, I noticed that I have been charged for three nights, whereas I stayed for only two and checked out on the morning of 5 July as agreed. I believe an extra night has been added in error.

Could you please review the booking and refund the amount for the additional night? I have kept my check-out confirmation and am happy to forward it if that would help.

I have otherwise been very satisfied with my stay and trust this can be corrected quickly.

Thank you for your assistance.

Yours faithfully,
Marc Vidal`},{id:"wr017",part:4,title:"Formal email (feedback request)",prompt:"You attended a job interview last week and were not selected. Write a polite formal email (120-150 words) thanking them and asking for feedback.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Mr Alonso,

Thank you for informing me of your decision regarding the Marketing Assistant position. While I am naturally disappointed, I appreciate the time you and your team gave me during the process.

I remain very interested in your company and am keen to improve for future opportunities. If you have a moment, I would be grateful for any feedback on my interview or application, particularly on areas where a stronger candidate stood out. Even brief comments would be genuinely helpful.

Thank you again for the opportunity, and I hope our paths may cross again. I wish you and the successful candidate every success.

Yours sincerely,
