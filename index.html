y behind closed eyelids, when most dreams happen. One full cycle lasts about ninety minutes, and most adults go through four or five cycles every night.","Deep sleep seems especially important for learning. During this stage, the brain appears to replay experiences from the day, strengthening the connections that form memories. Information is gradually transferred from a short-term store to areas of the brain where it can be kept for much longer.","In one well-known type of experiment, volunteers learn a list of words in the evening. Half of them then sleep normally, while the other half stay awake all night. When everyone is tested the next day, the group that slept usually remembers far more, even after the tired group has had time to recover.","Teenagers face a particular difficulty. During adolescence, the body clock shifts, so young people naturally feel sleepy later at night and want to wake up later in the morning. Early school start times therefore leave many of them seriously short of sleep, which may affect their results at school.","Modern lifestyles do not help. Phones and tablets give off light that tells the brain it is still daytime, delaying the moment we feel tired. Coffee and energy drinks taken in the afternoon can stay in the body for many hours, and late meals can also make it harder to fall asleep.","Fortunately, there are easy ways to improve sleep. Going to bed and getting up at the same time every day helps the body clock stay regular. A dark, cool bedroom makes a real difference, and putting screens away an hour before bed is one of the most effective changes people can make."],["An old belief proved wrong","A repeating pattern through the night","Storing the day’s lessons","Evidence from the laboratory","A problem for younger people","Modern habits that get in the way","Simple steps to rest better"],"The dangers of sleeping too much"),ft("r4a02","Community gardens","B2",["In many cities, community gardens began on land that nobody wanted. When factories closed, they often left behind empty plots full of rubbish. Local residents started clearing these spaces by hand, bringing in soil and planting vegetables, and slowly the abandoned land turned green.","For some neighbourhoods, these gardens are an important source of food. In areas without a large supermarket, fresh fruit and vegetables can be expensive or hard to find. A shared garden allows families to grow tomatoes, beans and salad for very little money.","The gardens also create strong social ties. Retired people who have gardened all their lives work side by side with young families who have never grown anything. Neighbours who once only nodded at each other in the street now share tools, seeds and recipes.","The benefits go beyond people. Plants help to cool streets during hot summers and absorb rainwater that would otherwise flood drains. Flowers attract bees and butterflies, and some gardens have become small shelters for birds in the middle of the city.","However, many gardens have an uncertain future. Most are built on land that the gardeners do not own. When property prices rise, owners are often tempted to sell the land for flats or offices, and years of work can disappear in a few weeks.","In response, some city councils have started to protect gardens officially. They offer long-term agreements that allow groups to use the land for ten or twenty years, and some even provide free water and compost to help new projects get started.","If you would like to take part, the first step is usually to find an existing group through your local council or community centre. If there is none nearby, experienced gardeners suggest starting small, with a few raised beds, before trying anything more ambitious."],["From empty land to green spaces","Filling a gap in food supply","Bringing people together","Benefits for the local environment","A threat from property owners","Official support grows","How to get involved"],"Why gardening is so expensive"),ft("r4a03","Electric scooters in cities","B2",["Only a few years ago, electric scooters were rarely seen on city streets. Then, almost overnight, rental companies placed thousands of them in cities around the world. Users simply download an app, find the nearest scooter on a map and unlock it with their phone.","It is easy to see why they became popular. For short journeys they are faster than walking and often quicker than waiting for a bus. There is no need to look for a parking space, and many young people enjoy the feeling of freedom they offer.","Hospitals, however, soon began to report a rise in injuries. Many riders do not wear helmets, and some travel on pavements at high speed. Pedestrians, especially older people, have been hit, and in some cases the injuries have been serious.","Another common complaint concerns parking. Because rental scooters can be left almost anywhere, they are often abandoned in the middle of pavements. For wheelchair users and people with pushchairs, this can make walking along a street difficult or even impossible.","Scooters are often promoted as a green form of transport, but studies suggest the picture is more complicated. Rental scooters used to wear out within months, and many trips replace walking or cycling rather than car journeys, which reduces the environmental benefit.","City authorities have responded in different ways. Some have introduced speed limits and special parking areas, while others require riders to be over a certain age. A few cities have decided the problems are too great and have banned rental scooters completely.","The companies involved say that newer scooters are stronger and last much longer. In the future, scooters may be parked at fixed stations near metro stops, so that they become part of the public transport network instead of competing with it."],["A sudden arrival","Why users like them","Concerns about safety","Clutter on the streets","Not as green as it seems","Cities respond with rules","What comes next"],"The inventor of the scooter"),ft("r4a04","Mountain rescue volunteers","C1",["Every weekend, while most people are relaxing, groups of volunteers in mountain areas keep their phones close. They are teachers, electricians, nurses and farmers, and none of them is paid for this work. When a call comes in, they leave whatever they are doing and head for the hills.","Joining a team is not easy. New members usually spend two or three years training before they take part in real rescues. They learn advanced first aid, how to use ropes on steep ground and how to navigate in fog or darkness without relying on a phone signal.","Team leaders say that a large proportion of their calls could have been prevented. Walkers set out in trainers instead of boots, without a map or warm clothes, or start a long route in the late afternoon and are caught out when it gets dark.","Technology has transformed the way searches are carried out. A lost walker can now send their exact location from a phone, and some teams use drones with heat cameras that can find a person on a hillside in minutes rather than hours.","The work can be dangerous for the rescuers themselves. Conditions that cause accidents, such as ice, high winds and falling rocks, are the same conditions teams must work in. Several volunteers have been seriously injured while trying to reach people in difficulty.","Most teams receive little or no money from the government. They depend on donations and fundraising events to pay for vehicles, radios and medical equipment, and members often spend their own money on clothing and training courses.","Rescuers ask walkers to do a few simple things: check the weather forecast before leaving, carry the right equipment, and tell someone the route they plan to take and when they expect to return. These small steps can save a life — including a rescuer’s."],["Ordinary people, extraordinary work","A long preparation","Many emergencies could be avoided","New tools make searches faster","Risking their own safety","Paying for the service","How walkers can help"],"A career with a good salary"),ft("r4a05","Tiny houses","B2",["A tiny house is usually defined as a home of less than forty square metres. Many are built on wheels, so they can be moved from one place to another. Some owners design and build their homes themselves, while others buy them ready-made from specialist companies.","The main reason most people give for choosing one is money. A tiny house can cost less than a tenth of the price of a normal flat, and bills for heating and electricity are very low. For young people who cannot get a mortgage, it can be the only way to own a home.","Living in such a small space forces people to think about what they really need. Owners often say that getting rid of most of their possessions made them feel lighter and less stressed. They spend less time cleaning and shopping, and more time outdoors.","However, the lifestyle is not for everyone. Couples can find it difficult to have so little personal space, and working from home becomes almost impossible. Families with children usually discover that a tiny house works for a holiday but not for everyday life.","Finding somewhere to put the house is another challenge. In many countries, planning laws do not allow people to live permanently on land without a proper building. Some owners have been forced to move their homes several times after complaints from neighbours.","A few towns have decided to welcome tiny-house communities. They provide land with water and electricity connections, and residents share facilities such as a laundry and a garden. Supporters say these villages help to fill empty land and bring young residents to areas that are losing population.","Whether tiny houses become a mainstream solution to the housing crisis remains to be seen. Critics argue that they do not use land efficiently compared with blocks of flats. For now, they remain an attractive option for a small number of people who value freedom over space."],["What counts as a tiny house","A cheaper way to own a home","Owning less, living better","Drawbacks for some households","Problems with the law","Communities that say yes","An uncertain future"],"Building your own house in a weekend"),ft("r4a06","How habits work","B2",["Psychologists estimate that a large part of what we do each day is not the result of conscious decisions but of habits. We brush our teeth, check our phones and take the same route to work without really thinking about it. This saves mental energy for more important choices.","Researchers describe a habit as a loop with three parts. First there is a trigger, such as a time of day or a feeling. Then comes the routine itself, and finally a reward that makes the brain want to repeat the behaviour next time.","Understanding this loop explains why bad habits are so hard to break. If you eat biscuits every afternoon because you feel tired, simply deciding to stop rarely works. The trigger and the need for a reward are still there, so the old routine soon returns.","A more effective strategy is to keep the trigger and the reward but change the routine. When the afternoon tiredness arrives, a short walk or a cup of tea may provide a similar feeling of relief. Over time, the new routine can replace the old one.","A popular belief says that it takes twenty-one days to form a new habit. Studies suggest the reality is less precise. In one experiment, the time needed varied from a few weeks to almost a year, depending on the person and on how difficult the behaviour was.","Our surroundings also play a powerful role. People who keep fruit on the kitchen table eat more of it, and those who leave their running shoes by the door are more likely to exercise. Making a good habit easy to start is often more useful than relying on willpower.","Finally, experts recommend starting small. Someone who wants to read more might begin with just two pages a night. The goal at first is not the result but the repetition, because once a behaviour becomes automatic, it is much easier to increase it."],["Acting without thinking","The three stages of a habit","Why stopping is difficult","Replacing rather than removing","A popular myth examined","The influence of the environment","Begin with tiny steps"],"Habits that animals share with us"),ft("r4a07","Turning seawater into drinking water","C1",["As droughts become longer and more frequent, many coastal regions are turning to the sea for their water supply. Desalination plants remove the salt from seawater to produce water that is safe to drink. Today, they supply millions of people in the Middle East, Australia and southern Europe.","Most modern plants use a process called reverse osmosis. Seawater is pushed at very high pressure through membranes with tiny holes. Water molecules pass through, while salt and other impurities are left behind. The technique has largely replaced older methods that boiled the water.","The biggest disadvantage is energy. Producing the high pressure required uses large amounts of electricity, which makes desalinated water considerably more expensive than water from rivers or underground sources. If that electricity comes from fossil fuels, the plants also add to carbon emissions.","Engineers have made significant progress in reducing these costs. New membranes allow water through more easily, and devices that recover energy from the high-pressure waste stream can cut electricity use by more than half. Some plants are now powered directly by solar or wind farms.","Another concern is what happens to the salt that is removed. Plants return a concentrated salty liquid, known as brine, to the sea. If it is not spread properly, it can sink to the seabed and harm marine plants and animals that cannot survive in such salty conditions.","Because of these issues, many experts argue that desalination should be a last resort. Repairing leaking pipes, reusing treated waste water for agriculture and encouraging households to save water are usually cheaper and less damaging ways of increasing supply.","Nevertheless, for some regions there is little alternative. As populations grow and rainfall becomes less reliable, desalination is likely to play an increasingly important role, especially if it can be combined with clean energy and careful management of its waste."],["A growing source of supply","How the technology works","An expensive process","Making it more efficient","A risk to marine life","Cheaper options come first","A necessary part of the future"],"Why the sea is salty"),ft("r4a08","Digital nomads","B2",["Digital nomads are people who work online while travelling from place to place. With a laptop and an internet connection, they can do their jobs from a beach in Thailand one month and a café in Lisbon the next. Their numbers grew rapidly after many companies accepted remote working.","For many, the attraction is freedom. Nomads can choose where to live according to the weather, the cost of living or simply curiosity. Some say that experiencing different cultures has made them more creative and more open-minded than they were in an office.","The reality, however, can be less glamorous. Time differences mean that meetings may take place in the middle of the night. Unreliable internet connections cause stress, and constantly organising accommodation and transport takes a surprising amount of time.","Loneliness is one of the most common complaints. Moving every few weeks makes it hard to build deep friendships, and family and old friends are far away. To solve this, many nomads use shared workspaces where they can meet people in a similar situation.","Several countries have created special visas to attract these workers. The visas allow them to stay for a year or more as long as they earn a minimum income from abroad. Governments hope the visitors will spend money in local shops and restaurants.","Not everyone welcomes them. In some popular cities, residents complain that nomads, who earn foreign salaries, have pushed up rents in central neighbourhoods. Local people on local wages can no longer afford to live in the areas where they grew up.","Many nomads eventually choose to settle down. Some find a city they love and stay; others return home with new skills and contacts. For most, it seems, the nomadic life is a stage rather than a permanent way of living."],["Working from anywhere","The appeal of a mobile life","Practical difficulties","Feeling isolated","Countries compete for remote workers","Tension with residents","A temporary phase for most"],"How to become a successful travel blogger"),ft("r4a09","Bringing rivers back to life","C1",["During the last century, thousands of rivers across Europe were straightened, narrowed and enclosed between concrete walls. The aim was to drain farmland, protect towns from floods and make room for roads and buildings. At the time, this was seen as a symbol of progress.","Over the decades, the consequences became clear. Fish and birds lost the habitats they depended on, and straight channels made water flow faster, which often increased flooding further downstream. In cities, many rivers were hidden underground and almost forgotten.","Today a growing number of projects are attempting to reverse this damage. Engineers remove concrete banks, recreate natural curves and reconnect rivers with the land around them. The approach is known as river restoration, and it is now included in European environmental policy.","One of the main benefits is better flood protection. When a river is allowed to spread onto meadows and wetlands during heavy rain, the water slows down and is stored temporarily. This reduces the peak of the flood that reaches towns and cities.","Nature responds remarkably quickly. Within a few years of restoration, scientists often record the return of fish species, insects and water birds that had disappeared. Plants along the banks also help to clean the water by filtering out pollution from farmland.","Projects are not always popular at first. Farmers may lose land that floods more often, and residents can worry about mosquitoes or about losing parking spaces in urban areas. Successful schemes usually involve local communities from the planning stage and offer compensation where necessary.","In cities, uncovering hidden rivers has transformed neighbourhoods. Former roads have become green corridors with paths for walking and cycling, and summer temperatures along the water can be several degrees lower than in nearby streets."],["Taming rivers in the past century","Unexpected consequences","Undoing the damage","Giving floods room to spread","Wildlife comes back","Winning local support","New life in urban areas"],"The cost of building new dams")],Tg="Four people talk about the same topic. Match each speaker to the correct sentence. There are two sentences you do not need. You can listen twice.",Ge="Listen to a man and a woman discussing a topic. Who expresses each opinion: the man, the woman, or both? You can listen twice.",kp=["Speaker 1","Speaker 2","Speaker 3","Speaker 4"];function Qe(e,t,n,o,r,a,i){return{id:e,skill:"listening",kind:"listening-speakers",title:t,instructions:Tg,level:n,topic:o,options:[...a,...i].sort(),audio:r.map((l,c)=>[{speaker:kp[c],text:l}]),items:a.map((l,c)=>({prompt:kp[c],answer:l})),explanation:"Escucha sinónimos: el audio rara vez usa las mismas palabras que la opción correcta."}}const ll=[Qe("l2a01","Why I chose my job","B1","Information matching",["I’d always been good with numbers, but what really decided it was my uncle. He ran a small accounting firm and let me work there every summer while I was at school. By the time I finished, I knew exactly what I wanted to do.","Honestly, I didn’t plan any of it. I needed money to pay my rent, and a hotel near my flat was looking for a night receptionist. I only meant to stay a few months. Fifteen years later, I manage the whole hotel.","After I spent a week in hospital as a teenager, I saw how much the nurses did for the patients. It made me realise I wanted a job where I could really improve people’s lives, even if the pay isn’t great.","I always wanted a job that would take me to different places. I work as a flight attendant now, and in the last year alone I’ve been to more than twenty countries. The hours are long, but I never get bored."],["gained experience in a relative’s business","started the job by chance","wanted to make a difference to others","wanted to see the world"],["chose the job because of the salary","followed a teacher’s advice"]),Qe("l2a02","My ideal holiday","B1","Information matching",["I don’t see the point of spending a fortune on hotels. We take a tent, drive to the coast and cook our own food. A week away costs us less than a weekend in a city.","My job is so stressful that on holiday I just want to switch off. Give me a sunbed, a good book and the sea, and I won’t move for a week. I don’t even check my emails.","I love wandering around old cities, visiting museums and finding out how people lived hundreds of years ago. Last year I went to Rome and spent a whole day in the ancient Forum.","Lying on a beach bores me after half an hour. I need to be doing something, so I usually go walking in the mountains in summer and skiing in winter. I come back exhausted but happy."],["prefers holidays that cost little","wants to rest completely","enjoys learning about the past","likes physically active holidays"],["always travels with a large group","prefers to stay at home"]),Qe("l2a03","Public transport","B2","Information matching",["A monthly pass in my city now costs almost as much as running a small car. I still use the metro, but I think it’s unfair that prices keep going up while the service stays the same.","I actually enjoy my train journey. It takes forty minutes, and that’s when I answer emails and plan my day. By the time I get to the office, half my admin is done.","I used to take the bus every day, but it was late so often that I missed meetings. In the end I bought a bike, and now I always know exactly when I’ll arrive.","I sold my car two years ago. I was worried about the air quality in the city, and I felt I should do something myself rather than just complain about it."],["thinks tickets are too expensive","uses the journey time productively","stopped using it because it was unreliable","uses it to help reduce pollution"],["is afraid of crowded trains","prefers to drive to work"]),Qe("l2a04","Learning to cook","B1","Information matching",["Everything I know about cooking comes from my grandmother. Every Sunday I’d stand next to her in the kitchen, and she never used a recipe — she just knew. I still make her soup every winter.","I’d love to cook more, but from Monday to Friday I leave home at seven and get back after eight. So cooking is really a weekend thing for me. Saturday is when I try something new.","I taught myself, really. Whenever I want to make something, I search for it on the internet and follow a video step by step. There are thousands of them, and they’re free.","I started cooking properly when my doctor told me I was eating too much salt. Ready meals are full of it. Now I prepare my own food and I know exactly what goes into it."],["learned from an older relative","has little time during the week","learns recipes online","cooks to eat more healthily"],["works as a professional chef","dislikes cooking"]),Qe("l2a05","Social media","B2","Information matching",["As a wedding photographer, I couldn’t survive without it. Almost all my new clients find me through the pictures I post. I spend at least an hour a day answering messages from couples.","Two years ago I deleted every account I had. For the first week I kept reaching for my phone, but now I don’t miss it at all. I sleep better and I read far more.","My brother lives in Canada and my parents are in Chile, so for us it’s the easiest way to share photos and stay part of each other’s lives. I don’t really use it for anything else.","I noticed I was spending three hours a day scrolling, so I set a timer on my phone. After thirty minutes, the apps lock. It was annoying at first, but it has really helped."],["uses it to promote their business","gave it up completely","stays in contact with family far away","controls how long they spend on it"],["mainly uses it to follow the news","only uses it to watch videos"]),Qe("l2a06","Where I live","B1","Information matching",["I live on the tenth floor, right in the centre. It’s noisy at night, but I can walk to work in five minutes and there are cafés everywhere. I wouldn’t swap it for anything.","We moved to a village last year so the kids could have a garden. The houses are much bigger for the same money, but I spend nearly two hours a day driving to the office and back.","My flat is tiny and the building is old, but my neighbours are wonderful. We look after each other’s plants, share meals at the weekend, and someone always helps if there’s a problem.","I rent a room in a shared house near the university. It isn’t ideal, because I have to share the kitchen with five people, but it’s the only thing I can afford while I’m studying."],["enjoys being close to everything","has a long journey to work","gets on very well with the people nearby","lives there for financial reasons"],["is planning to move abroad","designed the house themselves"]),Qe("l2a07","A memorable trip","B2","Information matching",["We’d planned everything for months, and then the airline cancelled our flight the day before. We ended up taking two trains and a ferry. It took forever, but honestly, that journey became the best part of the holiday.","I went to Japan on my own, which I’d never done before. I was nervous at first, but I discovered I really enjoy deciding everything myself. Now I prefer travelling alone.","What I remember most is the food. Every day we tried something completely new, from street markets to tiny family restaurants. I came home and started cooking dishes I’d never even heard of before.","It rained every single day of our week in Scotland. We hardly saw the mountains we’d gone there for. Still, we spent a lot of time in pubs chatting to locals, and they were incredibly friendly."],["enjoyed an unexpected change of plan","found out something about themselves","was inspired to try something at home","had bad luck with the weather"],["lost their luggage","travelled for work"]),Qe("l2a08","My first job","B1","Information matching",["My first job was in a supermarket when I was sixteen. The pay was terrible, but I saved every penny, and by the end of the summer I could buy my first bike.","I started as a waiter in my aunt’s restaurant. The work was hard, but I learned how to deal with difficult customers. That skill has helped me in every job since.","I got my first job straight after university in a big bank. I hated it. The hours were long and I never saw daylight. After six months, I left to retrain as a teacher.","I helped a neighbour with his garden every weekend. He paid me a little, but more importantly he taught me the names of all the plants. Now I’m a professional gardener."],["used the money for a specific purchase","developed a useful ability","quickly decided to change career","discovered what they wanted to do in life"],["was promoted very quickly","worked abroad"]),Qe("l2a09","Reading habits","B2","Information matching",["I read on my phone, mostly on the train. People say it’s bad for your eyes, but it means I always have a book with me, and I read far more than I used to.","I belong to a book club that meets once a month. I’d never have chosen most of the books myself, but that’s the point. I’ve discovered authors I now love.","I hardly read novels any more. I prefer history and science books, because I like to learn something real. Fiction just doesn’t hold my attention these days.","I listen to audiobooks while I’m running or cooking. Some people say that isn’t real reading, but I don’t care. It’s the only way I can fit books into my busy life."],["reads more since changing format","reads books chosen by other people","prefers factual books","combines books with other activities"],["buys a lot of second-hand books","writes book reviews online"]),Qe("l2a10","Sport and exercise","B1","Information matching",["I joined a basketball team at forty. I’m not very good, but it doesn’t matter. After the game we all go for dinner together, and those evenings are the highlight of my week.","I go to the gym at six every morning before work. It’s the only time nobody can disturb me. By eight o’clock I’ve exercised, showered and I feel ready for anything.","I used to run marathons, but I hurt my knee badly two years ago. Now I swim instead. It’s gentler on my body, and actually I enjoy it more than I expected.","I don’t do any sport, really. I walk to work and take the stairs instead of the lift. That’s enough exercise for me, and it doesn’t cost anything."],["values the social side of sport","exercises at a fixed time each day","changed activity because of an injury","stays active through daily routines"],["competes at a professional level","trains with a personal coach"]),Qe("l2a11","Saving money","B2","Information matching",["I write down everything I spend in an app. At the end of each month I can see exactly where my money went. It was a shock at first — I was spending a fortune on takeaway coffee.","Every time I get paid, a fixed amount goes straight into a separate account. I never touch it. That way I save without having to think about it.","I’ve stopped buying new things whenever possible. Furniture, clothes, even my bike — they’re all second-hand. I save money, and it’s better for the environment too.","Honestly, I’m terrible at saving. Whenever I have a bit extra, I spend it on travelling. My parents worry about me, but I’d rather have the memories."],["keeps a record of their expenses","saves automatically","buys used items","prefers spending on experiences"],["has just bought a house","works in a bank"])],Ye=["Man","Woman","Both"],Ke=e=>e.map(([t,n])=>({speaker:t,text:n})),cl=[{id:"l3a01",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Choosing a flat",instructions:Ge,options:Ye,audio:[Ke([["Woman","I really think we should take the flat near the station. The commute would be so much easier."],["Man","Maybe, but did you see how small the kitchen was? I cook every day. I need space."],["Woman","True, the kitchen is tiny. But we’d save an hour a day travelling, and for me that matters more than anything."],["Man","The other one has a garden, though. I’d love to grow our own vegetables."],["Woman","A garden means work. I honestly don’t have time for that."],["Man","Well, let’s look at a couple more places before we decide."],["Woman","Fine, but not too many."]])],items:[{prompt:"The kitchen in the flat near the station is too small.",answer:"Both"},{prompt:"Looking after a garden would take too much time.",answer:"Woman"},{prompt:"Growing food would be enjoyable.",answer:"Man"},{prompt:"Travel time is the most important factor.",answer:"Woman"}]},{id:"l3a02",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Shopping online",instructions:Ge,options:Ye,audio:[Ke([["Man","I buy almost everything online now. It’s just more convenient."],["Woman","I do for books, but never for clothes. I need to try them on."],["Man","You can always send them back."],["Woman","That’s the problem — returning things is such a nuisance. And all that packaging is terrible for the environment."],["Man","I agree about the packaging, actually. Some parcels arrive in boxes three times too big."],["Woman","Also, I like supporting the small shops in my neighbourhood. If we don’t use them, they’ll close."],["Man","That’s fair, but they’re usually more expensive."]])],items:[{prompt:"Sending items back is annoying.",answer:"Woman"},{prompt:"Online orders create too much packaging.",answer:"Both"},{prompt:"Local businesses need customers’ support.",answer:"Woman"},{prompt:"Small shops charge higher prices.",answer:"Man"}]},{id:"l3a03",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Running a marathon",instructions:Ge,options:Ye,audio:[Ke([["Woman","I’ve signed up for the city marathon in April."],["Man","Wow. I’d never do that. Running such long distances must be terrible for your knees."],["Woman","Not if you train properly. I’m following a sixteen-week plan so I don’t get injured."],["Man","Sixteen weeks! That’s a huge commitment."],["Woman","It is, and it’s hard to fit around work. Some mornings I get up at five."],["Man","I prefer team sports. I play football on Sundays; it’s more sociable."],["Woman","I get that. Running on your own can be lonely. That’s why I joined a club."],["Man","Having other people around definitely keeps you motivated."],["Woman","Absolutely."]])],items:[{prompt:"Long-distance running can damage your body.",answer:"Man"},{prompt:"Preparing for a marathon takes a lot of time.",answer:"Both"},{prompt:"Exercising with others is motivating.",answer:"Both"},{prompt:"Careful training helps to avoid injuries.",answer:"Woman"}]},{id:"l3a04",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"A new sports centre",instructions:Ge,options:Ye,audio:[Ke([["Man","Have you heard the council wants to build a new sports centre where the park is?"],["Woman","Yes, and I’m completely against it. That park is the only green space in the area."],["Man","I see your point, but the town really needs a swimming pool. The nearest one is twenty kilometres away."],["Woman","I don’t disagree that we need a pool. I just think they should build it somewhere else."],["Man","Like where, though? There’s no other free land."],["Woman","What about the old car factory? It’s been empty for years."],["Man","That could work, but cleaning up that site would cost a fortune."],["Woman","More than losing the park forever?"]])],items:[{prompt:"The town needs a swimming pool.",answer:"Both"},{prompt:"The park should be protected.",answer:"Woman"},{prompt:"There is nowhere else to build.",answer:"Man"},{prompt:"Using the factory site would be expensive.",answer:"Man"}]},{id:"l3a05",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Cinema or home?",instructions:Ge,options:Ye,audio:[Ke([["Woman","Do you want to go to the cinema on Friday?"],["Man","Honestly, I’d rather watch something at home. Tickets are so expensive now."],["Woman","They are, but the experience is different. The big screen, the sound…"],["Man","My TV is pretty big. And at home I can pause the film whenever I want."],["Woman","That’s exactly what I don’t like. At home I always end up checking my phone."],["Man","Fair enough. I’m the same, actually. I never get through a whole film without looking at it."],["Woman","So come on Friday. We’ll leave our phones in our pockets."],["Man","Okay, but you’re buying the popcorn."]])],items:[{prompt:"Cinema tickets cost too much.",answer:"Both"},{prompt:"It is hard to concentrate when watching at home.",answer:"Both"},{prompt:"Being able to stop the film is an advantage.",answer:"Man"},{prompt:"The cinema offers a better experience.",answer:"Woman"}]},{id:"l3a06",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Getting a dog",instructions:Ge,options:Ye,audio:[Ke([["Woman","The kids keep asking for a dog. I think it’s time we said yes."],["Man","I’d love one too, but who’s going to walk it? We both work all day."],["Woman","That’s true, we’d need someone to come in at lunchtime. That costs money."],["Man","And vet bills can be huge. My brother spent hundreds last year."],["Woman","Still, I think it would teach the children responsibility."],["Man","Maybe. Or maybe they’ll get bored after a month and we’ll do everything."],["Woman","Let’s start by looking after my sister’s dog for a week and see how it goes."],["Man","Good idea. That’s a sensible test."]])],items:[{prompt:"Their work schedules make it difficult to own a dog.",answer:"Both"},{prompt:"Medical care for animals can be expensive.",answer:"Man"},{prompt:"Having a dog would be good for the children’s development.",answer:"Woman"},{prompt:"Trying it out for a short period is a good plan.",answer:"Both"}]},{id:"l3a07",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Learning to drive",instructions:Ge,options:Ye,audio:[Ke([["Man","My daughter wants to start driving lessons. Honestly, I’m not sure she needs a car in the city."],["Woman","Maybe not now, but a licence is useful for jobs later on."],["Man","I suppose so. But lessons are so expensive these days."],["Woman","They are. Could you teach her yourself for some of the practice?"],["Man","Me? I’d be far too nervous. I’d shout at every corner."],["Woman","Ha! I was the same with my son. In the end a professional instructor is better."],["Man","And safer, I imagine."],["Woman","Definitely safer."]])],items:[{prompt:"A driving licence can help with future employment.",answer:"Woman"},{prompt:"Driving lessons cost a lot.",answer:"Both"},{prompt:"Teaching your own child to drive is stressful.",answer:"Both"},{prompt:"Young people may not need a car in a city.",answer:"Man"}]},{id:"l3a08",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Working from home",instructions:Ge,options:Ye,audio:[Ke([["Woman","My company wants everyone back in the office five days a week."],["Man","Really? I’d hate that. I get so much more done at home."],["Woman","I don’t know. At home I find it hard to separate work from the rest of my life."],["Man","I can see that. I sometimes answer emails at eleven at night."],["Woman","Exactly. And I miss chatting with colleagues. Ideas come up over coffee."],["Man","For me, the commute is the deal-breaker. Ninety minutes a day, wasted."],["Woman","I suppose two or three days in the office would be the best compromise."],["Man","I could live with two."]])],items:[{prompt:"People are more productive at home.",answer:"Man"},{prompt:"Working from home can lead to working too late.",answer:"Both"},{prompt:"Informal conversations at work are valuable.",answer:"Woman"},{prompt:"A mix of home and office would be acceptable.",answer:"Both"}]},{id:"l3a09",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Planning a holiday",instructions:Ge,options:Ye,audio:[Ke([["Man","So, where shall we go this summer? I was thinking of Greece again."],["Woman","Again? We’ve been three times. I’d like to try somewhere new."],["Man","But we know it’s good. New places can be a disappointment."],["Woman","That’s part of the adventure, though. What about Norway?"],["Man","Norway is beautiful, but it’s very expensive."],["Woman","It is, I won’t deny that. But we could camp to save money."],["Man","Camping? At my age? Well… maybe for a few nights."],["Woman","That’s all I’m asking."]])],items:[{prompt:"Going to a familiar place is the safer choice.",answer:"Man"},{prompt:"Discovering new places is exciting.",answer:"Woman"},{prompt:"Norway is a costly destination.",answer:"Both"},{prompt:"Camping is acceptable for part of the holiday.",answer:"Both"}]},{id:"l3a10",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Video games",instructions:Ge,options:Ye,audio:[Ke([["Woman","My son plays video games for about three hours a day. It worries me."],["Man","Three hours is a lot. But some games are actually quite good for problem-solving."],["Woman","Maybe, but he doesn’t go outside any more."],["Man","That’s the real problem, I agree. Kids need fresh air and exercise."],["Woman","I’m thinking of limiting it to one hour on school days."],["Man","Make sure you explain why, though. If you just ban it, he’ll play at his friends’ houses."],["Woman","Good point. I’ll talk to him tonight."]])],items:[{prompt:"Some games can develop useful skills.",answer:"Man"},{prompt:"Children are spending too little time outdoors.",answer:"Both"},{prompt:"Setting a daily time limit is a good idea.",answer:"Woman"},{prompt:"Rules work better when they are explained.",answer:"Man"}]},{id:"l3a11",skill:"listening",kind:"listening-discussion",level:"B2",topic:"Inference: discussion",title:"Eating less meat",instructions:Ge,options:Ye,audio:[Ke([["Man","I’ve decided to stop eating meat during the week."],["Woman","Really? Why?"],["Man","Partly for the environment. Producing meat uses so much water and land."],["Woman","That’s true, I’ve read about that. But I’d find it hard. I love a good steak."],["Man","I do too, that’s why I still eat it at weekends. And I’ve been saving money, actually. Vegetables and beans are cheap."],["Woman","Hmm. The problem for me is that vegetarian food takes longer to cook."],["Man","Not necessarily. Lentil soup takes twenty minutes."],["Woman","Maybe you could send me the recipe."]])],items:[{prompt:"Meat production has a big environmental impact.",answer:"Both"},{prompt:"Giving up meat completely would be difficult.",answer:"Both"},{prompt:"A diet with less meat is cheaper.",answer:"Man"},{prompt:"Vegetarian cooking is time-consuming.",answer:"Woman"}]}],ul=[{id:"ws01",context:"You are a new member of a photography club.",level:"B2",part1:["Where do you live?","What do you like taking photos of?","What camera do you use?","When do you usually take photos?","Who taught you photography?"],part2:"Please tell us why you want to join the club and what you would like to learn. (20-30 words)",part3:[{name:"Laura",message:"Welcome! What is the best photo you have ever taken? Why do you like it?"},{name:"Ahmed",message:"Do you prefer taking photos of people or landscapes? Why?"},{name:"Chris",message:"Some people say phones have made cameras unnecessary. What do you think?"}],part4Info:`Dear Member,
We regret to inform you that the weekend photography trip to the national park has been cancelled because the coach company has closed. We are looking for another company, which may increase the price of the trip by 30 euros. Please tell us whether you would still like to take part.
The Club Committee`,part4Informal:"Write an email to a friend who is also in the club. Tell them how you feel about this and what you plan to do. (40-50 words)",part4Formal:"Write an email to the club committee. Explain how you feel about the news and what you would like them to do. (120-150 words)",samples:{part1:["In Barcelona.","Old buildings and streets.","A second-hand Canon.","At weekends, usually early.","My aunt did."],part2:"I want to join because I love street photography but I have never had any lessons. I would like to learn how to use light better and edit my photos.",part3:["My favourite photo is one of my grandfather laughing at a family lunch. It is not technically perfect, but it captures his personality, and it reminds me of summers at his house.","I definitely prefer landscapes. People often feel uncomfortable in front of a camera, so their expressions look forced. Mountains and cities never complain, and I can take my time to get the light right.","I partly agree. Phones are great for everyday pictures, and they are always in your pocket. However, a real camera gives you much more control over focus and exposure, so serious photographers still need one."],informal:"Hi Marc, did you see the email about the trip? I’m really disappointed, I’d been looking forward to it for weeks! Paying 30 euros more is a bit much for me, but I’ll probably still go. What about you? Shall we share a room?",formal:`Dear Committee,

Thank you for informing members about the cancellation of the photography trip. I was very sorry to hear the news, as the trip was one of the main reasons I joined the club.

I understand that the situation was not your fault. However, I am concerned about the possible increase of 30 euros, which would make the trip difficult to afford for some members, especially students like me. Would it be possible for the club to cover part of the extra cost, or to offer a discount to members who had already paid?

Alternatively, I would suggest organising car-sharing among members, which would be cheaper and more flexible than hiring a coach.

I would still like to take part, and I would be happy to help organise the new arrangements if necessary.

I look forward to hearing from you.

Yours faithfully,
Alex García`}},{id:"ws02",context:"You have joined an evening cooking course.",level:"B2",part1:["What is your favourite food?","How often do you cook?","Who do you usually eat with?","What did you have for breakfast today?","Where do you buy your food?"],part2:"Tell us about your cooking experience and which dishes you would like to learn to make. (20-30 words)",part3:[{name:"Sofia",message:"Hi! What is a typical dish from your region? How is it made?"},{name:"Tom",message:"Do you think children should learn to cook at school? Why or why not?"},{name:"Grace",message:"Do you prefer eating at restaurants or at home? Why?"}],part4Info:`Dear Student,
Due to building work, from next month the course will move from the city centre to our new kitchen on the edge of town. Classes will also start one hour later, at 8 pm. We apologise for any inconvenience.
Course Administration`,part4Informal:"Write an email to a friend on the course. Tell them how you feel about the changes and what you are going to do. (40-50 words)",part4Formal:"Write an email to the course administration. Tell them how the changes affect you and what you would like them to do. (120-150 words)",samples:{part1:["Paella, definitely.","Three or four times a week.","My flatmates.","Toast and coffee.","At the local market."],part2:"I can cook simple things like pasta and omelettes, but nothing impressive. I would really like to learn how to make fresh bread and some Asian dishes.",part3:["In Catalonia we eat “pa amb tomàquet”. You toast slices of bread, rub them with ripe tomato and garlic, then add olive oil and salt. It sounds simple, but with good ingredients it is delicious.","Yes, I think they should. Many young people leave home without knowing how to prepare a basic meal, so they rely on fast food. Cooking lessons would teach them to eat healthily and save money.","I prefer eating at home most of the time. It is cheaper and I know exactly what I am eating. However, I enjoy going to restaurants on special occasions to try food I cannot make myself."],informal:"Hi Ana! Have you seen the news about the course? I’m not happy at all. The new kitchen is so far from my flat, and finishing at ten is really late for me. I might ask if I can join the Saturday group instead. What will you do?",formal:`Dear Sir or Madam,

I am writing regarding the changes to the evening cooking course that were announced last week.

Although I understand that the building work is necessary, the new arrangements cause me serious difficulties. I do not have a car, and the new kitchen is poorly connected by public transport, particularly late in the evening. Moreover, as classes will now finish at 10 pm, I would not be able to get home safely by bus.

I would therefore be grateful if you could consider some alternatives. For example, would it be possible to keep the original start time, or to offer the same course on Saturday mornings? If neither option is possible, I would like to request a refund for the remaining classes.

I have really enjoyed the course so far and would prefer to continue. I look forward to your reply.

Yours faithfully,
Alex García`}},{id:"ws03",context:"You are a member of a hiking group.",level:"B2",part1:["Where is your favourite place to walk?","How far can you walk in a day?","What do you take on a walk?","Who do you usually go walking with?","What is the weather like today?"],part2:"Tell us why you joined the hiking group and what kind of walks you enjoy. (20-30 words)",part3:[{name:"Pablo",message:"Welcome! Can you describe the most beautiful walk you have done?"},{name:"Emma",message:"Is it better to walk alone or in a group? Why?"},{name:"Jake",message:"How can we make mountain areas less crowded at weekends?"}],part4Info:`Dear Member,
From next season, all members will need to pay an annual fee of 40 euros. The money will be used to buy first-aid equipment and to train guides. Members who do not pay will not be able to join organised walks.
Hiking Group Committee`,part4Informal:"Write an email to a friend in the group. Tell them what you think about the new fee and what you will do. (40-50 words)",part4Formal:"Write an email to the committee. Give your opinion about the fee and make suggestions. (120-150 words)",samples:{part1:["The Pyrenees.","About twenty kilometres.","Water, food and a map.","Some friends from university.","Sunny but windy."],part2:"I joined because I wanted to discover new routes and meet people who enjoy nature. I love long mountain walks, especially ones with lakes or good views.",part3:["Last summer I walked to a lake in the Pyrenees at sunrise. The water was completely still and reflected the mountains perfectly. We were the only people there, and it was absolutely silent.","I think a group is better, especially in the mountains. It is safer if someone gets injured, and more experienced members can share their knowledge. Walking alone is relaxing, but I would only do it on easy paths.","I think public transport to the most popular areas should be improved, so fewer people drive there. Also, guides could promote lesser-known routes, which are often just as beautiful but much quieter."],informal:"Hey Laia, did you read about the new fee? Forty euros seems quite a lot, but if it pays for first aid and trained guides, I think it’s worth it. I’m going to pay. Are you still coming on the walk next Sunday?",formal:`Dear Committee,

I am writing in response to your message about the new annual fee.

In general, I support the idea. Safety should be a priority for the group, and I believe that trained guides and proper first-aid equipment will benefit all members. I am therefore happy to pay the fee.

However, I am worried that 40 euros may prevent some people, such as students or unemployed members, from continuing to take part. I would like to suggest a reduced fee for these members, or the option of paying in two instalments.

In addition, it would be helpful if the committee published a short report at the end of the year explaining how the money has been spent. This would help members trust the new system.

Thank you for your hard work organising the walks.

Yours faithfully,
Alex García`}},{id:"ws04",context:"You have joined a film club at your local cultural centre.",level:"B2",part1:["What kind of films do you like?","Who is your favourite actor?","How often do you go to the cinema?","What was the last film you saw?","What do you like eating when you watch films?"],part2:"Tell us why you joined the film club and what type of films you would like to watch. (20-30 words)",part3:[{name:"Irene",message:"Welcome! What film would you recommend to the club, and why?"},{name:"Daniel",message:"Do you prefer watching films in their original language or dubbed? Why?"},{name:"Kate",message:"Will people still go to the cinema in twenty years? What do you think?"}],part4Info:`Dear Member,
Because of low attendance, we plan to reduce the number of screenings from two per week to one per month. We will also stop showing films in their original language, as some members find subtitles difficult.
Film Club Committee`,part4Informal:"Write an email to a friend in the club. Tell them how you feel about the changes. (40-50 words)",part4Formal:"Write an email to the committee. Explain your opinion of the changes and suggest how to increase attendance. (120-150 words)",samples:{part1:["Thrillers and documentaries.","Penélope Cruz.","Once a month.","A Korean thriller.","Popcorn, of course."],part2:"I joined because I want to watch films I would never choose myself and discuss them with other people. I especially enjoy European and Asian cinema.",part3:["I would recommend “Amélie”. It is a funny and imaginative French film about a young woman who secretly helps the people around her. The music and colours are beautiful, and it always puts me in a good mood.","I prefer the original language with subtitles. Actors’ voices are an important part of their performance, and dubbing often changes the tone of a film. It is also a great way to improve my English.","I think so, although probably fewer people will go. Streaming is convenient, but watching a film on a huge screen with an audience is a special experience that a sofa cannot replace."],informal:"Hi Joan! Have you seen what the committee wants to do? One film a month is nothing, and no more original versions — that was my favourite thing about the club! I’m going to write to them. Want to sign the email with me?",formal:`Dear Committee,

I am writing to express my concern about the proposed changes to the film club.

I understand that attendance has fallen, but I believe reducing screenings to one per month will make the problem worse, as members will lose the habit of coming. Furthermore, original-language screenings are one of the main reasons I joined, and I know several other members feel the same.

Instead, I would like to suggest some ways to attract more people. Firstly, the club could advertise screenings on social media and at local schools. Secondly, it could offer both versions of popular films on different days, so everyone can choose. Finally, a short discussion after each film might make the evenings more sociable.

I would be happy to help put any of these ideas into practice.

Yours faithfully,
Alex García`}},{id:"ws05",context:"You are a volunteer with an environmental association.",level:"B2",part1:["Where are you from?","What do you do in your free time?","How do you travel to work or university?","What do you recycle at home?","Which season do you like best?"],part2:"Tell us why you want to volunteer with us and what skills you can offer. (20-30 words)",part3:[{name:"Nadia",message:"Hi! What is the biggest environmental problem in your area?"},{name:"Oliver",message:"Can individuals really make a difference, or is it up to governments?"},{name:"Paula",message:"What activity should our association organise next?"}],part4Info:`Dear Volunteer,
The beach clean-up planned for next Saturday has been moved to Sunday at 7 am because of a sailing competition. Volunteers must bring their own gloves and bags, as our supplies have run out.
The Coordinators`,part4Informal:"Write an email to a friend who is also volunteering. Tell them about the changes and what you plan to do. (40-50 words)",part4Formal:"Write an email to the coordinators. Explain how the changes affect you and make suggestions. (120-150 words)",samples:{part1:["From Tarragona.","Swimming and reading.","By train.","Plastic, paper and glass.","Autumn."],part2:"I want to volunteer because I care about protecting the coast where I grew up. I study engineering, so I could help with data collection and planning.",part3:["In my area, the biggest problem is plastic on the beaches, especially after storms. It harms birds and fish, and it also damages tourism, which many local people depend on for their jobs.","I think both are needed. Governments must make the big changes, such as laws on pollution, but individual actions add up. If millions of people use less plastic, companies are forced to change as well.","I think we should organise workshops in schools. If children understand why the environment matters, they will change their habits and also influence their parents. It would be cheap and easy to organise."],informal:"Hi Pau! The beach clean-up is now on Sunday at 7 am, not Saturday. So early! Also, we need to bring our own gloves and bags. I’ll buy some for both of us. Can you pick me up on the way?",formal:`Dear Coordinators,

Thank you for letting us know about the changes to the beach clean-up.

Unfortunately, the new time is difficult for me. The first train from my town arrives at 7.15, so I would miss the beginning of the activity. I imagine other volunteers who rely on public transport may have the same problem. Would it be possible to start at 8 am instead?

I am also slightly concerned about volunteers bringing their own equipment, as some people may not have suitable gloves. Perhaps the association could ask a local supermarket or the town council to donate gloves and bags. I would be happy to contact them on your behalf.

Despite these difficulties, I am still very keen to take part, and I will try to bring a few friends along.

Yours faithfully,
