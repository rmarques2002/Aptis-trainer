 will the woman buy?",["A book","A scarf","Concert tickets"],2,"She rejects the book and the scarf and decides on concert tickets."),me(4,"Doctor’s phone number","Hi, it’s Paula. You asked for the number of my dentist. It’s 0-1-6-3, double 4, 7, 2, 9. They’re open until seven, so you can call after work.","What is the phone number?",["0163 447 29","0163 474 29","0136 447 29"],0,"“double 4” = 44 → 0163 447 29."),me(5,"Meeting time","Man: Is the meeting still at three? Woman: No, the director can’t make it until four, so we’ve moved it to half past four to give everyone time to get back from lunch… sorry, from the site visit.","What time is the meeting now?",["3:00","4:00","4:30"],2,"It has been moved to “half past four”.","B2"),me(6,"Where to meet","Hi Leo, it’s me. The café by the museum is closed today, so let’s meet in front of the cinema instead. It’s just across the square. See you at eleven.","Where will they meet?",["At the café","Outside the cinema","Inside the museum"],1,"The café is closed, so they’ll meet in front of the cinema."),me(7,"Weather forecast","And now the weather. After a sunny morning, clouds will come in from the west, and by the evening we expect heavy rain in most areas. Temperatures will stay around eighteen degrees.","What will the weather be like in the evening?",["Sunny","Cloudy but dry","Rainy"],2,"Heavy rain is expected by the evening."),me(8,"Price of tickets","Woman: How much are the tickets? Man: Adults are twelve pounds, and children under twelve are half price. Woman: So for me and my son, who’s eight? Man: That’s eighteen pounds altogether.","How much does the woman pay in total?",["£12","£18","£24"],1,"Adult £12 + child half price £6 = £18.","B2"),me(9,"Lost item","Man: I think I left something on the bus this morning. Woman: What was it? Man: A black umbrella. Oh, and my gloves were in the same bag. Woman: A bag, then? Man: No, sorry — the gloves are at home. Just the umbrella.","What did the man lose?",["An umbrella","A pair of gloves","A bag"],0,"He corrects himself: only the umbrella was lost.","B2"),me(10,"Gym opening hours","Thank you for calling City Gym. From Monday to Friday we are open from six in the morning until ten at night. At weekends we open at eight and close at eight.","What time does the gym close on Saturday?",["6 pm","8 pm","10 pm"],1,"At weekends it opens at eight and closes at eight (8 pm)."),me(11,"Choosing transport","Woman: Shall we take a taxi to the airport? Man: It’s so expensive. The bus is cheap but it takes over an hour. Woman: What about the train? Man: Good idea — it’s only twenty minutes and not much more than the bus.","How will they go to the airport?",["By taxi","By bus","By train"],2,"They choose the train: fast and cheap."),me(12,"Course start date","Hello, this is the language school. Your course was going to start on the third of March, but because of low numbers the first class will be one week later, on the tenth. Classes will still be on Tuesdays.","When does the course start?",["3rd March","10th March","17th March"],1,"It starts one week later, on the tenth."),me(13,"Job of a friend","Man: What does your sister do now? Is she still a teacher? Woman: No, she left teaching two years ago. She trained as a nurse for a while, but now she works as a police officer.","What is the sister’s job now?",["Teacher","Nurse","Police officer"],2,"She “now works as a police officer”.","B2"),me(14,"Hotel room","Receptionist: Good evening. You booked a double room for three nights, is that right? Guest: Actually, I changed it to two nights by email yesterday. Receptionist: Ah yes, I see it here. Two nights.","How many nights will the guest stay?",["One","Two","Three"],1,"The booking was changed to two nights."),me(15,"Why he is late","Hi, it’s Dan. I’m going to be about twenty minutes late. The traffic isn’t bad, but I had to go back home because I forgot my laptop. Sorry! Start without me.","Why is Dan late?",["There is heavy traffic","He forgot something","His car broke down"],1,"He went back home for his laptop; the traffic “isn’t bad”.","B2"),me(16,"Favourite sport","Woman: Do you still play tennis? Man: Not really, my knee’s been bad. I’ve started swimming instead, and I love it. Woman: I thought you were going to try golf. Man: Too slow for me!","What sport does the man do now?",["Tennis","Swimming","Golf"],1,"He stopped tennis and now swims; golf is “too slow”.")];function nt(e,t,n,o,r,a="B2"){const i=`ls${200+e}`;return{id:i,skill:"listening",type:"monologue",title:t,body:n,level:a,questions:[o,r].map((l,c)=>({id:`${i}q${c+1}`,skill:"listening",type:"monologue",prompt:l.prompt,options:l.options,answer:l.answer,explanation:l.explanation,level:a,topic:"Inference: monologue"}))}}const ka=[nt(1,"A radio talk about city parks","People often say that cities need more parks, and of course I agree. But in my view, the number of parks matters less than how they are designed. Many new parks are just large areas of grass with a few benches. They look nice in photographs, but nobody actually uses them. The parks that work best are the ones with shade, water fountains, places for children to play and cafés where older people can sit and talk. As for who should pay for them, I know many people think it should all come from local taxes. Personally, I think businesses that benefit from a nearby park, such as restaurants and offices, should contribute something. After all, a good park increases their profits too.",{prompt:"What does the speaker think about new parks?",options:["There are not enough of them","Their design is often poor","They are too expensive to maintain"],answer:1,explanation:"She says design matters more than number, and many new parks are just grass that nobody uses."},{prompt:"What is her opinion about funding?",options:["Local businesses should help pay","Taxes should cover everything","Visitors should pay to enter"],answer:0,explanation:"She thinks businesses that benefit from a park should contribute."}),nt(2,"A teacher on mobile phones in schools","Last year our school banned mobile phones completely, from the moment students arrive until they leave. I expected a lot of protests, and there were some at first. But after a few weeks, something surprising happened. The playground became noisy again — students were actually talking and playing games together. I’m not saying phones are evil; they can be useful in some lessons, and I’d like to see them used more in research projects, for example. What I am saying is that young people find it almost impossible to control their own use. The apps are designed to keep them looking at the screen, so it isn’t fair to expect a fourteen-year-old to resist on their own.",{prompt:"What effect of the ban surprised the teacher?",options:["Students’ marks improved","Students became more sociable","Parents supported the decision"],answer:1,explanation:"The playground became noisy again — students were talking and playing together."},{prompt:"Why does she think students need rules?",options:["Phones are dangerous for their health","Teachers cannot control the class","Apps are designed to be hard to stop using"],answer:2,explanation:"She says apps are designed to keep them looking at the screen."}),nt(3,"A chef talks about food waste","When I opened my first restaurant, I was shocked by how much food we threw away. Vegetables that weren’t perfectly shaped, bread from the day before, the ends of fish and meat. Now we use almost everything. Yesterday’s bread becomes breadcrumbs or soup, and vegetable peel goes into stocks. It has cut our costs considerably. At home, though, I think the problem is different. People don’t plan their shopping, so they buy far more than they need. Supermarket offers like “buy two, get one free” don’t help either. Honestly, I’d like to see those offers banned for fresh food, because they encourage people to buy things they’ll never eat.",{prompt:"What does the chef say about reducing waste in his restaurant?",options:["It has saved money","It took a long time to organise","Customers did not notice"],answer:0,explanation:"“It has cut our costs considerably.”"},{prompt:"What would he like to happen?",options:["People to cook more at home","Some supermarket promotions to stop","Restaurants to serve smaller portions"],answer:1,explanation:"He would like “buy two, get one free” offers banned for fresh food."}),nt(4,"A scientist on space tourism","A few private companies now offer short trips into space for tourists, at enormous prices. Many people ask me whether this is a good thing. From a scientific point of view, I think it’s mostly harmless and may even be useful, because the money pays for better and cheaper rockets that researchers can use later. But I do have concerns about the environment. Each launch burns huge amounts of fuel, and if these trips become common, the pollution in the upper atmosphere could become a real problem. So my position is this: space tourism shouldn’t be stopped, but it should be strictly regulated before it grows any further.",{prompt:"What positive effect does the scientist mention?",options:["It inspires young people to study science","It helps develop technology for research","It makes space travel safer for astronauts"],answer:1,explanation:"The money pays for better and cheaper rockets that researchers can use."},{prompt:"What is her overall position?",options:["It should be banned","It should be controlled by rules","It should be encouraged to grow"],answer:1,explanation:"“It shouldn’t be stopped, but it should be strictly regulated.”"}),nt(5,"A talk about learning musical instruments","I teach piano to adults, and the question I hear most often is: “Am I too old to start?” The answer is no. Adults actually learn some things faster than children, because they understand music theory more quickly. What they lack is patience. They expect to play beautiful pieces within a month, and when they can’t, they give up. My advice is to practise little and often. Ten minutes every day is far better than two hours on Sunday. And please, don’t compare yourself with the people you watch online. Those videos show the result of years of work, not the beginning.",{prompt:"According to the teacher, what is the main problem for adult learners?",options:["They have too little free time","They expect progress too quickly","They find theory difficult"],answer:1,explanation:"Adults lack patience and expect to play beautiful pieces within a month."},{prompt:"What does she say about online videos?",options:["They give an unrealistic impression","They are a good way to learn","They are better than lessons"],answer:0,explanation:"Videos show the result of years of work, so learners should not compare themselves."}),nt(6,"An architect on old buildings","In many cities, old factories and warehouses are being demolished to build new flats. I think this is often a mistake. These buildings are usually very solid, and converting them uses far less energy and materials than building from scratch. They also give a neighbourhood its character. That said, I’m not against all new construction. Some old buildings are simply unsafe or impossible to adapt, and in those cases demolition is the right choice. The real problem is that the law makes conversion more complicated and expensive than starting again. Until that changes, developers will keep knocking down buildings that could have had a second life.",{prompt:"Why does the architect prefer converting old buildings?",options:["It is quicker","It is more sustainable","It is more profitable"],answer:1,explanation:"Converting uses far less energy and materials than building from scratch."},{prompt:"What does he see as the main obstacle?",options:["Current regulations","Residents’ opinions","A lack of skilled workers"],answer:0,explanation:"“The law makes conversion more complicated and expensive.”"}),nt(7,"A travel writer on guidebooks","When I started travelling, everyone carried a printed guidebook. Now most people rely on their phones, and of course apps are more up to date — restaurant hours, prices, reviews from last week. I use them too. But I think something has been lost. A good guidebook was written by someone who knew the place deeply and could explain its history and culture. Online reviews tell you whether the pizza was good, not why the city looks the way it does. My suggestion is simple: use your phone for practical information, but before you go, read at least one serious book about the place you’re visiting. Your trip will mean much more.",{prompt:"What advantage of apps does the writer accept?",options:["They are more current","They are more reliable","They are cheaper"],answer:0,explanation:"He says apps are more up to date."},{prompt:"What does he recommend?",options:["Using only printed guidebooks","Reading about a destination’s background before going","Avoiding online reviews completely"],answer:1,explanation:"Read at least one serious book about the place before you go."}),nt(8,"A doctor on sleep and teenagers","Parents often tell me their teenagers are lazy because they won’t get up in the morning. In most cases, laziness has nothing to do with it. During adolescence, the body clock changes, and teenagers genuinely don’t feel sleepy until late at night. Forcing them to start school at eight means many are seriously short of sleep. I’d support starting secondary school an hour later; research in several countries suggests attendance and results improve. Parents can help too, mainly by keeping phones out of bedrooms at night. That one rule makes a bigger difference than anything else I know.",{prompt:"What does the doctor say about teenagers who sleep late?",options:["They are usually lazy","Their biology is responsible","They have too much homework"],answer:1,explanation:"Their body clock changes during adolescence."},{prompt:"What does she think is the most effective thing parents can do?",options:["Wake them up earlier","Remove phones from bedrooms at night","Talk to the school"],answer:1,explanation:"Keeping phones out of bedrooms “makes a bigger difference than anything else”."}),nt(9,"An engineer on public transport","Every time a city builds a new metro line, people celebrate, and I understand why. But metro lines are extremely expensive and take ten years or more to build. In my experience, many cities would get faster results by improving their buses. Dedicated bus lanes, frequent services and modern vehicles can transform a network in two or three years for a fraction of the cost. The challenge is political rather than technical. Taking road space away from cars always causes protests, and many politicians simply don’t want the trouble before an election.",{prompt:"What does the engineer think cities should prioritise?",options:["New metro lines","Better bus services","Wider roads"],answer:1,explanation:"Improving buses gives faster results for a fraction of the cost."},{prompt:"What is the main difficulty, according to him?",options:["A lack of money","Engineering problems","Politicians fear public reaction"],answer:2,explanation:"The challenge is political: taking road space causes protests."}),nt(10,"A shop owner on online shopping","I’ve run a bookshop in this street for twenty years. When online shopping became popular, I was sure we would close. Sales did fall, but we found a way to survive. We stopped trying to compete on price, because we never could. Instead, we organised events: author talks, children’s reading hours, a monthly book club. People now come for the experience as much as for the books. I don’t blame customers for shopping online. What I would like is for the big online companies to pay the same level of tax that small shops like mine pay. At the moment, the competition simply isn’t fair.",{prompt:"How did the shop survive?",options:["By lowering its prices","By offering activities","By selling online"],answer:1,explanation:"They organised events and people come for the experience."},{prompt:"What does the owner think is unfair?",options:["Customers’ shopping habits","The tax system","The rent in the street"],answer:1,explanation:"Big online companies don’t pay the same level of tax as small shops."})],ol=[{id:"sp001",part:1,prompt:"Tell me about the town or city where you live.",seconds:30,level:"B1",topic:"Hometown",sampleAnswer:"I live in a medium-sized coastal city. It's lively but not too crowded, and I especially like the old town, where there are lots of small cafés. The weather is mild most of the year, which makes it easy to spend time outdoors."},{id:"sp002",part:1,prompt:"What do you usually do at the weekend?",seconds:30,level:"B1",topic:"Free time",sampleAnswer:"At weekends I like to relax and catch up with friends. On Saturdays I often go for a long walk or meet people for coffee, and on Sundays I usually cook something at home and read. I try to stay off my phone a bit more than during the week."},{id:"sp003",part:1,prompt:"Tell me about a subject you enjoyed studying.",seconds:30,level:"B1",topic:"Studies",sampleAnswer:"I really enjoyed studying geography at school. I liked learning how cities grow and why people move from one place to another. The teacher used lots of maps and real examples, which made it feel relevant rather than just facts to memorise."},{id:"sp004",part:1,prompt:"What kind of music do you like?",seconds:30,level:"B1",topic:"Preferences",sampleAnswer:"I listen to quite a wide range, but I mostly enjoy relaxed music with acoustic guitar. I put it on while I'm working or cooking. I'm not very keen on very loud electronic music, although I don't mind it at a party."},{id:"sp005",part:1,prompt:"Describe a typical meal in your country.",seconds:30,level:"B1",topic:"Food",sampleAnswer:"A typical meal where I'm from usually starts with a small salad or soup, followed by a main dish with meat or fish and vegetables. We often eat together as a family and take our time, so lunch can last quite a while at weekends."},{id:"sp006",part:1,prompt:"What did you do on your last holiday?",seconds:30,level:"B1",topic:"Travel",sampleAnswer:"On my last holiday I visited the mountains for a few days. I went hiking every morning and relaxed in the afternoons. The air was fresh and it was a real change from the city. I came back feeling much more rested."},{id:"sp007",part:1,prompt:"Tell me about your best friend.",seconds:30,level:"B1",topic:"People",sampleAnswer:"My best friend and I have known each other since school. She's very calm and always gives sensible advice, which balances me out because I can be impatient. We don't see each other every week, but when we do, it feels like no time has passed."},{id:"sp008",part:1,prompt:"How do you usually travel around your city?",seconds:30,level:"B1",topic:"Transport",sampleAnswer:"I mostly get around by public transport and on foot. The bus network is quite good, so I rarely need a car in the centre. For longer trips I use the train, which is usually faster than driving because of the traffic."},{id:"sp009",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","Do you prefer working alone or in a team? Why?","How has technology changed the way people work together?"],scenes:["office"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In the picture I can see a small group of colleagues gathered around a table, looking at a laptop. They seem to be discussing a project, because one person is pointing at the screen while the others listen. The atmosphere looks relaxed but focused, and there are notebooks and coffee cups on the table, which suggests they've been there for a while."},{id:"sp010",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","Tell me about a market or shop you like to visit.","Why do some people prefer markets to supermarkets?"],scenes:["market"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"This photo shows a lively outdoor market on what looks like a sunny morning. There are several stalls selling fruit and vegetables, and quite a few shoppers walking between them with bags. In the foreground a vendor is weighing something for a customer. The whole scene feels cheerful and full of energy."},{id:"sp011",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","How often do you eat with your family?","Why is it important for families to eat together?"],scenes:["dinner"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In this image a family of four is sitting around a dining table, sharing a meal. They all look happy and relaxed, and one of the children is laughing at something. There are dishes of food in the middle of the table, so it seems like an informal, home-cooked dinner rather than a special occasion."},{id:"sp012",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","What do you do to stay healthy?","Why don’t some people do enough exercise?"],scenes:["park"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"The picture shows a person jogging along a path in a park early in the morning. She's wearing sports clothes and headphones, and there are trees on both sides. The light is soft, so I'd guess it's just after sunrise. She looks determined and seems to be enjoying the quiet."},{id:"sp013",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","Tell me about a teacher you remember.","How do you think classrooms will change in the future?"],scenes:["classroom"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In the photo there's a bright classroom with rows of desks and a teacher standing at the front near a whiteboard. Several students have their hands raised, which suggests the teacher has just asked a question. The room is decorated with posters, so it looks like a welcoming place to learn."},{id:"sp014",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","Tell me about your last summer holiday.","What are the advantages and disadvantages of beach tourism?"],scenes:["beach"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"This photo captures a wide, sandy beach on a hot summer afternoon. There are families under colourful umbrellas and a few people swimming in the sea. In the distance I can see some boats on the horizon. The sky is completely clear, and the whole scene looks very relaxing."},{id:"sp015",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","Tell me about a long journey you have made.","Why do some people prefer trains to cars?"],scenes:["station"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"The image shows the inside of a busy train station. People are hurrying across the concourse with suitcases, and there's a large departure board on the wall. A train is waiting at one of the platforms. Everyone seems to be in a rush, which is typical of a station at a busy time of day."},{id:"sp016",part:2,prompt:"Describe the picture and answer the questions. Speak for 45 seconds for each answer.",questions:["Describe this picture.","Do you enjoy spending time in nature? Why?","Why are green spaces important in cities?"],scenes:["garden"],seconds:45,level:"B2",topic:"Describing images",sampleAnswer:"In this picture there's a colourful garden full of flowers in bloom. There are neat flower beds and a small wooden bench under a tree. The colours are very bright, mostly reds and yellows, which tells me it's probably spring. It looks like a peaceful place to sit and relax."},{id:"sp017",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which way of studying do you think is more effective? Why?","How might students study in the future?"],scenes:["studyAlone","studyGroup"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Both approaches have clear advantages. Studying alone lets you work at your own pace and concentrate deeply, which suits complex topics. Studying in a group, on the other hand, means you can share ideas and stay motivated. Personally, I prefer a mix: I study new material alone first, then meet others to test my understanding."},{id:"sp018",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which way of travelling would you prefer for a long trip, and why?","Should governments make train travel cheaper than flying? Why?"],scenes:["plane","train"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Planes are usually much faster for long distances, which is their main advantage. However, trains take you straight into the city centre and let you see the landscape, and I find them more comfortable and less stressful. For a shorter journey I'd almost always choose the train, even if it takes a bit longer."},{id:"sp019",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which place would be better for bringing up children? Why?","Why do you think many young people leave rural areas?"],scenes:["city","countryside"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"City life offers convenience, jobs and things to do, but it can be noisy and expensive. The countryside is quieter and closer to nature, though it may feel isolated and offer fewer opportunities. It really depends on your stage of life; I'd choose the city now but might prefer the countryside later."},{id:"sp020",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which way of shopping do you prefer, and why?","What will happen to high-street shops in the next twenty years?"],scenes:["onlineShop","shop"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Online shopping is convenient and often cheaper, and you can compare prices easily. In a physical shop, though, you can see and try things before buying, and you get them immediately. I tend to buy everyday items online but still prefer going to a shop for clothes or anything I need to try on."},{id:"sp021",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which is more enjoyable: reading a story or watching it? Why?","Why do you think so many films are based on books?"],scenes:["reading","cinema"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"A book usually gives you more detail and lets you imagine the characters yourself, which I find rewarding. A film is quicker and brings the story to life visually, but it has to leave things out. Ideally I read the book first and then watch the film to see how the director interpreted it."},{id:"sp022",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which situation do you think is better for workers? Why?","How might offices change in the future?"],scenes:["homeOffice","office"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Working from home saves commuting time and gives you flexibility, but it can feel isolating and the line between work and rest gets blurred. The office makes it easier to collaborate and switch off at the end of the day. A hybrid arrangement seems to combine the best of both."},{id:"sp023",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which is a more effective way to learn a language? Why?","Why do some people find it hard to speak a foreign language?"],scenes:["classroom","cafeAbroad"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"A classroom gives you structure, clear explanations and correction, which is great for building foundations. Living abroad forces you to use the language constantly, so you improve your fluency and confidence fast. The ideal is to build the basics in class and then spend time abroad to bring it to life."},{id:"sp024",part:3,prompt:"Look at the two pictures and answer the questions. Speak for 45 seconds for each answer.",questions:["Tell me what you can see in the two pictures.","Which makes people happier: experiences or possessions? Why?","Why do you think people buy things they don’t need?"],scenes:["hiking","shopping"],seconds:45,level:"B2",topic:"Compare & contrast",sampleAnswer:"Buying possessions gives you something lasting that you can use every day. Experiences, though, tend to create stronger memories and often mean more over time. I lean towards experiences, like travel or concerts, because the objects I've bought rarely stay exciting for long."},{id:"sp025",part:4,prompt:`Tell me about a time you had to solve a difficult problem.
• How did you feel at the time?
• What have you learned about solving problems in general?`,seconds:120,prepSeconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"Once, our team's project was almost derailed when a key member left suddenly. I had to reorganise the tasks and learn part of their work quickly. It was stressful, but breaking the problem into small steps helped a lot. More generally, I've learned that staying calm and asking for help early usually matters more than trying to solve everything alone. Problems feel smaller once you start acting on them."},{id:"sp026",part:4,prompt:`Tell me about a place that is special to you.
• How often do you go there, and why?
• Why do places become important in people's lives?`,seconds:120,prepSeconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"A small library near my old home is special to me because I spent countless afternoons there as a teenager. It's where I first fell in love with reading. I think places become important because of the memories and emotions we attach to them, not the buildings themselves. A very ordinary spot can matter enormously simply because of what happened to us there."},{id:"sp027",part:4,prompt:`Tell me about a skill you would like to learn.
• What has stopped you from learning it so far?
• Why do people keep learning new things throughout their lives?`,seconds:120,prepSeconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"I'd love to learn to play the piano, mainly because music relaxes me and I admire people who can play. I think people keep learning throughout life for several reasons: curiosity, the satisfaction of getting better at something, and simply to keep the mind active. Learning also gives us a sense of progress, which is important at any age."},{id:"sp028",part:4,prompt:`Tell me about a decision you found difficult.
• Who, if anyone, helped you decide?
• How can people make better decisions?`,seconds:120,prepSeconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"Choosing which course to study was hard, because I was pulled between what interested me and what seemed practical. I eventually followed my interest and haven't regretted it. To make better decisions, I think it helps to gather information, imagine living with each option, and talk to people you trust, while accepting that no choice is ever perfect."},{id:"sp029",part:4,prompt:`Tell me about a change you have made in your daily routine.
• Was it easy to keep it up?
• Why is it hard for people to change their habits?`,seconds:120,prepSeconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"Recently I started going to bed earlier, which has made a real difference to my energy. It was surprisingly hard at first. I think changing habits is difficult because our routines feel automatic and comfortable, and change requires constant effort until the new behaviour becomes natural. Starting small and being patient with yourself makes it far more likely to stick."},{id:"sp030",part:4,prompt:`Tell me about something you own that is important to you.
• How did you get it?
• Do you think people rely too much on possessions?`,seconds:120,prepSeconds:60,level:"B2",topic:"Abstract discussion",sampleAnswer:"An old watch my grandfather gave me is important to me, not for its value but for what it represents. I do think some people rely too much on possessions, expecting objects to make them happy in a lasting way. In my experience, relationships and experiences bring far deeper satisfaction, though a few meaningful objects can carry real emotional weight."}],wp=[{id:"wr001",part:1,title:"Word-level answers (club form)",prompt:`You are joining a photography club. Answer these questions with 1-5 words each:
1) What is your first name?
2) How old are you?
3) What is your favourite type of photo?
4) How often do you take photos?
5) Why do you want to join?`,minWords:15,seconds:180,level:"B1",sampleAnswer:`1) Marc.
2) Twenty-six.
3) Landscapes and nature.
4) Almost every day.
5) To improve and meet people.`},{id:"wr002",part:1,title:"Word-level answers (library card)",prompt:`You are applying for a library card. Answer with 1-5 words each:
1) What is your name?
2) Which city do you live in?
3) What kind of books do you like?
4) How many books do you read a month?
5) When can you usually visit?`,minWords:15,seconds:180,level:"B1",sampleAnswer:`1) Laura Pons.
2) Valencia.
3) Crime novels and history.
4) About three.
5) Weekday evenings.`},{id:"wr003",part:2,title:"Short informal text (new gym)",prompt:"You have joined a new gym. Write a short message (20-30 words) to the gym telling them why you joined and what you hope to achieve.",minWords:20,seconds:420,level:"B2",sampleAnswer:"Hi, I've just signed up because I want to get fitter and build a regular routine. My main goals are to improve my stamina and feel more energetic during the week. I'm hoping to attend classes three times a week. Thanks!"},{id:"wr004",part:2,title:"Short informal text (cooking class)",prompt:"You have signed up for an online cooking class. Write 20-30 words explaining why you joined and what you'd like to learn.",minWords:20,seconds:420,level:"B2",sampleAnswer:"Hello! I joined because I usually cook the same few meals and want more variety. I'd love to learn some quick vegetarian dishes and improve my basic knife skills. I'm a complete beginner, so any patient guidance is very welcome. Thanks!"},{id:"wr005",part:3,title:"Three social responses (travel forum)",prompt:`You are on a travel forum. Reply to these three comments (about 30-40 words each):
1) 'I'm nervous about travelling alone for the first time.'
2) 'What's the best way to save money while travelling?'
3) 'Do you prefer cities or nature when you travel?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) Don't worry too much — I felt the same at first, but travelling alone becomes liberating quickly. Start with a friendly, well-connected city, tell someone your plans, and you'll gain confidence within a day or two.

2) The biggest savings come from being flexible with dates and travelling slightly off-season. I also cook some meals myself and use public transport rather than taxis, which adds up over a trip.

3) Honestly, a mix of both. I love a couple of days exploring a lively city, then escaping to somewhere quiet in nature to recover. The contrast makes each part feel more special.`},{id:"wr006",part:3,title:"Three social responses (book club)",prompt:`You are in an online book club. Reply to these three comments (about 30-40 words each):
1) 'I never have time to read anymore.'
2) 'Should we read classics or modern novels next?'
3) 'Do audiobooks count as reading?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) I understand completely — life gets busy. What helped me was reading just ten minutes before bed. It sounds small, but it adds up, and it's a lovely way to switch off from screens.

2) Why not alternate? A classic one month and something modern the next keeps things fresh and gives everyone a turn. Variety usually keeps a club more engaged than sticking to one style.

3) In my opinion, yes. You're still following the story, characters and ideas — you're just using your ears. Audiobooks are perfect for commuting or chores, and they've kept me 'reading' during busy weeks.`},{id:"wr007",part:4,title:"Formal email (complaint about a course)",prompt:"You recently attended a weekend training course that did not meet your expectations. Write a formal email (120-150 words) to the organiser. Explain what the problems were and say what you would like them to do.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Sir or Madam,

I am writing regarding the weekend training course on digital marketing that I attended on 5-6 April. Unfortunately, several aspects fell short of what was advertised.

Firstly, the sessions started late on both days, which reduced the time available for the practical exercises I had particularly looked forward to. Secondly, the promised course materials were never provided, making it difficult to review the content afterwards.

While the trainer was knowledgeable, these issues significantly affected the value of the course. I would therefore appreciate it if you could send me the missing materials and consider a partial refund to reflect the lost session time.

I look forward to your response and hope we can resolve this matter promptly.

Yours faithfully,
Marc Vidal`},{id:"wr008",part:4,title:"Formal email (request to reschedule)",prompt:"You have booked a place at a conference but can no longer attend on the given dates. Write a formal email (120-150 words) to the organisers explaining the situation and asking about your options.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Conference Team,

I am writing about my registration for the Annual Design Conference scheduled for 12-13 June, reference number 4471.

Regrettably, an unavoidable work commitment now prevents me from attending on those dates, and I am keen to understand what options are available to me. Specifically, I would like to know whether my place can be transferred to next year's event, or whether a colleague could attend in my place using the same booking.

If neither option is possible, I would be grateful for information about your cancellation and refund policy. I apologise for any inconvenience this may cause and would appreciate your guidance on the best way forward.

Thank you for your understanding. I look forward to hearing from you.

Yours faithfully,
Laura Pons`},{id:"wr009",part:4,title:"Formal email (application follow-up)",prompt:"Two weeks ago you applied for a part-time job and have not heard back. Write a formal email (120-150 words) to the employer politely asking about the status of your application.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Ms Turner,

I am writing to follow up on my application for the part-time Customer Support Assistant position, which I submitted on 20 May.

I remain very interested in the role and in the opportunity to contribute to your team, so I wanted to check whether a decision has been made or whether any further information is required from my side. If it would be helpful, I would be glad to provide additional references or to attend an interview at your convenience.

I appreciate that you are likely dealing with many applications, and I do not wish to rush your process. However, a brief update on the current status would be greatly appreciated.

Thank you for your time and consideration.

Yours sincerely,
Marc Vidal`},{id:"wr010",part:2,title:"Short informal text (language exchange)",prompt:"You joined a language exchange app. Write 20-30 words saying which languages you speak, which you want to practise, and what you hope to get from it.",minWords:20,seconds:420,level:"B2",sampleAnswer:"Hi everyone! I'm a native Spanish speaker and I'm fairly comfortable in English, but I'd love to practise speaking more naturally. In return, I'm happy to help anyone learning Spanish. I'm hoping to make the exchange relaxed and regular. Nice to meet you!"},{id:"wr011",part:3,title:"Three social responses (fitness group)",prompt:`You are in an online fitness group. Reply to these three comments (about 30-40 words each):
1) 'I keep losing motivation after a few weeks.'
2) 'Is it better to exercise in the morning or evening?'
3) 'Any tips for staying active with a busy job?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) That's so common — motivation naturally dips. What works for me is setting tiny, unmissable goals and tracking them, so I see progress even on low-energy days. Habits beat willpower.

2) Honestly, whichever you'll actually stick to. Mornings suit me because nothing interrupts them, but plenty of people have more energy later. The 'best' time is the one you can keep.

3) Build movement into the day: take the stairs, walk during calls, and do short home workouts. Ten focused minutes daily beats a two-hour session you never find time for.`},{id:"wr012",part:1,title:"Word-level answers (volunteer sign-up)",prompt:`You are signing up to volunteer at a local festival. Answer with 1-5 words each:
1) What is your name?
2) Which day can you help?
3) What kind of task do you prefer?
4) Do you have any experience?
5) How can we contact you?`,minWords:15,seconds:180,level:"B1",sampleAnswer:`1) Aisha Karim.
2) Saturday afternoon.
3) Helping at the info desk.
4) Yes, two festivals.
5) By email, please.`},{id:"wr013",part:2,title:"Short informal text (running app)",prompt:"You started using a running app. Write 20-30 words on why you started and your goal.",minWords:20,seconds:420,level:"B2",sampleAnswer:"Hi! I started using the app to stay consistent, because I always give up after a week or two. My goal is to run five kilometres without stopping by the end of the summer. Fingers crossed the reminders keep me honest!"},{id:"wr014",part:2,title:"Short informal text (art class)",prompt:"You joined a weekend painting class. Write 20-30 words on why and what you'd like to improve.",minWords:20,seconds:420,level:"B2",sampleAnswer:"Hello! I joined because painting relaxes me and I want a screen-free hobby. I'd really like to improve my use of colour and get more confident with watercolours. I'm a beginner, so I'm mainly here to enjoy it and learn slowly."},{id:"wr015",part:3,title:"Three social responses (film club)",prompt:`Reply to three comments (about 30-40 words each):
1) 'I find subtitled films tiring.'
2) 'Which is better, cinema or streaming at home?'
3) 'Do sequels ruin good films?'`,minWords:90,seconds:600,level:"B2",sampleAnswer:`1) I felt that way too until I got used to them. After a few films your eyes stop noticing, and hearing the original voices really adds something. Start with a film you already know well.

2) Both have their place. The cinema is an event — the big screen and sound are hard to beat. But streaming is comfortable and flexible, so I probably watch more at home overall.

3) Not always. A good sequel can deepen the story, but too many are made just for money and feel hollow. When there's a genuine story left to tell, they can absolutely work.`},{id:"wr016",part:4,title:"Formal email (booking error)",prompt:"A hotel charged you for a night you did not stay. Write a formal email (120-150 words) explaining the problem and requesting a refund.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Reservations Team,

I am writing regarding my recent stay at your hotel from 3 to 5 July, booking reference 8823.

On reviewing my final invoice, I noticed that I have been charged for three nights, whereas I stayed for only two and checked out on the morning of 5 July as agreed. I believe an extra night has been added in error.

Could you please review the booking and refund the amount for the additional night? I have kept my check-out confirmation and am happy to forward it if that would help.

I have otherwise been very satisfied with my stay and trust this can be corrected quickly.

Thank you for your assistance.

Yours faithfully,
Marc Vidal`},{id:"wr017",part:4,title:"Formal email (feedback request)",prompt:"You attended a job interview last week and were not selected. Write a polite formal email (120-150 words) thanking them and asking for feedback.",minWords:120,seconds:1200,level:"B2",sampleAnswer:`Dear Mr Alonso,

Thank you for informing me of your decision regarding the Marketing Assistant position. While I am naturally disappointed, I appreciate the time you and your team gave me during the process.

I remain very interested in your company and am keen to improve for future opportunities. If you have a moment, I would be grateful for any feedback on my interview or application, particularly on areas where a stronger candidate stood out. Even brief comments would be genuinely helpful.

Thank you again for the opportunity, and I hope our paths may cross again. I wish you and the successful candidate every success.

Yours sincerely,
Laura Pons`}],Ho="Select a word from the list that has the most similar meaning to the word on the left.",Uo="Complete each definition using a word from the list. Use each word once only. You will not need five of the words.",qo="Finish each sentence using a word from the list. Use each word once only. You will not need five of the words.",Vo="Select the word from the list that is most often used with the word on the left.",ba=[{id:"vp01",skill:"grammar",kind:"vocab-pairs",title:"Word pairs 1",instructions:Ho,level:"B1",topic:"Synonyms",options:["answer","borrow","break","buy","carry","finish","fix","select","start","wonder"],items:[{prompt:"purchase",answer:"buy"},{prompt:"begin",answer:"start"},{prompt:"reply",answer:"answer"},{prompt:"repair",answer:"fix"},{prompt:"choose",answer:"select"}]},{id:"vp02",skill:"grammar",kind:"vocab-pairs",title:"Word pairs 2",instructions:Ho,level:"B1",topic:"Synonyms",options:["brave","empty","enormous","foolish","neat","polite","quick","slow","tiny","wealthy"],items:[{prompt:"huge",answer:"enormous"},{prompt:"rapid",answer:"quick"},{prompt:"silly",answer:"foolish"},{prompt:"rich",answer:"wealthy"},{prompt:"tidy",answer:"neat"}]},{id:"vp03",skill:"grammar",kind:"vocab-pairs",title:"Word pairs 3",instructions:Ho,level:"B2",topic:"Synonyms",options:["admire","allow","decrease","get","hide","lend","raise","refuse","show","try"],items:[{prompt:"attempt",answer:"try"},{prompt:"permit",answer:"allow"},{prompt:"reduce",answer:"decrease"},{prompt:"obtain",answer:"get"},{prompt:"demonstrate",answer:"show"}]},{id:"vp04",skill:"grammar",kind:"vocab-pairs",title:"Word pairs 4",instructions:Ho,level:"C1",topic:"Synonyms",options:["cheap","essential","generous","hidden","loud","precise","regular","rough","short","strange"],items:[{prompt:"accurate",answer:"precise"},{prompt:"frequent",answer:"regular"},{prompt:"vital",answer:"essential"},{prompt:"brief",answer:"short"},{prompt:"peculiar",answer:"strange"}]},{id:"vp05",skill:"grammar",kind:"voca  two people or companies is a…",answer:"contract"},{prompt:"A plan of how money will be spent over a period is a…",answer:"budget"},{prompt:"Money you receive for your job, usually every month, is a…",answer:"salary"}]},{id:"vd04",skill:"grammar",kind:"vocab-definition",title:"Definitions 4",instructions:Uo,level:"B2",topic:"Word definition",options:["anxious","brave","clumsy","curious","generous","jealous","modest","patient","punctual","stubborn"],items:[{prompt:"Someone who feels nervous about what might happen is…",answer:"anxious"},{prompt:"Someone who happily gives money or time to others is…",answer:"generous"},{prompt:"Someone who does dangerous or difficult things without fear is…",answer:"brave"},{prompt:"Someone who can wait calmly without getting annoyed is…",answer:"patient"},{prompt:"Someone who always arrives at the right time is…",answer:"punctual"}]},{id:"vd05",skill:"grammar",kind:"vocab-definition",title:"Definitions 5",instructions:Uo,level:"C1",topic:"Word definition",options:["abolish","assess","consult","donate","exaggerate","hesitate","postpone","reveal","sponsor","withdraw"],items:[{prompt:"To make something seem bigger or worse than it really is is to…",answer:"exaggerate"},{prompt:"To move an event to a later time is to…",answer:"postpone"},{prompt:"To ask an expert for advice or information is to…",answer:"consult"},{prompt:"To make something secret known to others is to…",answer:"reveal"},{prompt:"To officially end a law or system is to…",answer:"abolish"}]},{id:"vu01",skill:"grammar",kind:"vocab-usage",title:"Word usage 1",instructions:qo,level:"B1",topic:"Word usage",options:["boring","borrow","crowded","distracting","generous","honest","luxurious","postpone","promotion","salary"],items:[{prompt:"The film was so ___ that I fell asleep halfway through.",answer:"boring"},{prompt:"After years of hard work, she finally got a ___ to manager.",answer:"promotion"},{prompt:"Please switch off your phone; the light is very ___ during the concert.",answer:"distracting"},{prompt:"The hotel room was ___: it had a jacuzzi and a view of the sea.",answer:"luxurious"},{prompt:"We need to ___ the meeting because the director is ill.",answer:"postpone"}]},{id:"vu02",skill:"grammar",kind:"vocab-usage",title:"Word usage 2",instructions:qo,level:"B1",topic:"Word usage",options:["afford","bright","clear","crowded","donation","loan","poor","silent","stand","wide"],items:[{prompt:"The streets were so ___ that we could hardly move.",answer:"crowded"},{prompt:"He makes a small ___ to a children’s charity every month.",answer:"donation"},{prompt:"I can’t ___ the noise from the neighbours any longer.",answer:"stand"},{prompt:"The instructions were very ___, so everyone understood them.",answer:"clear"},{prompt:"She has a ___ memory; she forgets people’s names all the time.",answer:"poor"}]},{id:"vu03",skill:"grammar",kind:"vocab-usage",title:"Word usage 3",instructions:qo,level:"B2",topic:"Word usage",options:["advice","announced","borrowed","cancelled","compulsory","fare","fee","loud","tidy","weather"],items:[{prompt:"The museum is free, so there is no entrance ___.",answer:"fee"},{prompt:"My flight was ___ because of the heavy snow.",answer:"cancelled"},{prompt:"In most countries it is ___ to wear a helmet on a motorbike.",answer:"compulsory"},{prompt:"The winners of the competition will be ___ next week.",answer:"announced"},{prompt:"She gave me some useful ___ about how to prepare for the interview.",answer:"advice"}]},{id:"vu04",skill:"grammar",kind:"vocab-usage",title:"Word usage 4",instructions:qo,level:"B2",topic:"Word usage",options:["breathtaking","built","careless","cheap","crowded","hire","invented","reduce","terrified","whisper"],items:[{prompt:"The company plans to ___ fifty new employees this year.",answer:"hire"},{prompt:"The bridge was ___ in 1890 and is still in use today.",answer:"built"},{prompt:"I’m ___ of spiders, so I never go into the basement.",answer:"terrified"},{prompt:"Recycling helps to ___ the a ss"],items:[{prompt:"break",answer:"a promise"},{prompt:"raise",answer:"awareness"},{prompt:"reach",answer:"an agreement"},{prompt:"run",answer:"a business"},{prompt:"keep",answer:"a secret"}],explanation:"break a promise, raise awareness, reach an agreement, run a business, keep a secret."},{id:"vc04",skill:"grammar",kind:"vocab-combination",title:"Word combinations 4",instructions:Vo,level:"C1",topic:"Collocations",options:["aware","concerned","disappointed","hungry","known","polite","recommended","square","sunny","tall"],items:[{prompt:"highly",answer:"recommended"},{prompt:"deeply",answer:"concerned"},{prompt:"fully",answer:"aware"},{prompt:"bitterly",answer:"disappointed"},{prompt:"widely",answer:"known"}],explanation:"highly recommended, deeply concerned, fully aware, bitterly disappointed, widely known."},{id:"vc05",skill:"grammar",kind:"vocab-combination",title:"Word combinations 5",instructions:Vo,level:"B2",topic:"Collocations",options:["account","blanket","breath","carrot","effort","mirror","progress","risk","river","spoon"],items:[{prompt:"run the",answer:"risk"},{prompt:"make every",answer:"effort"},{prompt:"hold your",answer:"breath"},{prompt:"open a bank",answer:"account"},{prompt:"make rapid",answer:"progress"}],explanation:"run the risk, make every effort, hold your breath, open a bank account, make rapid progress."}],Un="Choose the word that fits in each gap.",Sg="The sentences below are from a text. The first sentence is given. Put the other five sentences in the correct order.",qe="Read the four people’s opinions. For each statement, choose the person who expresses it. People can be chosen more than once.",jg="Read the text. Choose the best heading for each paragraph. There is one heading you do not need.",rl=[{id:"r1a01",skill:"reading",kind:"reading-gapfill",level:"B1",topic:"Sentence comprehension",title:"Email from Marta",instructions:`${Un}

New members welcome!`,items:[{prompt:"The cycling club meets ___ Sunday morning.",options:["every","all","each of"],answer:"every"},{prompt:"Rides are usually ___ 30 and 50 kilometres long.",options:["between","from","among"],answer:"between"},{prompt:"Beginners are ___ welcome.",options:["always","never","ever"],answer:"always"},{prompt:"You need a helmet and a bike in good ___.",options:["condition","health","form"],answer:"condition"},{prompt:"Send us an email to ___ up.",options:["sign","write","take"],answer:"sign"}]}];function ot(e,t,n,o){return{id:e,skill:"reading",kind:"reading-order",title:t,instructions:Sg,level:n,topic:"Text cohesion",items:[],sentences:o,explanation:"Fíjate en pronombres (it, they, this), conectores (however, then, as a result) y en qué información necesita ir antes."}}const al=[ot("r2a01","Library renovation","B1",["The city library will close next month for major renovation work.","The work is expected to take about six months.","During this time, a temporary library will open in the community centre.","It will not have as many books, but members will be able to order any title online.","These orders can then be collected from the temporary library within two days.","Finally, when the main library reopens, it will have a new café and a children’s area."]),ot("r2a02","Making bread at home","B1",["Making your own bread at home is easier than most people think.","First, mix flour, water, yeast and a little salt in a large bowl.","Then knead the dough for about ten minutes until it becomes smooth.","After that, leave it in a warm place for an hour so that it can rise.","Once it has doubled in size, bake it in a hot oven for thirty minutes.","The result is a fresh loaf that is much cheaper than one from a shop."]),ot("r2a03","The new skate park","B1",["Last year, the council built a new skate park next to Riverside School.","At first, local residents were worried that it would be noisy.","However, these fears soon disappeared.","The park closes at eight in the evening, so it is quiet at night.","It has also become a popular meeting place for teenagers who previously had nowhere to go.","Because of this success, the council plans to build a second park in the north of the town."]),ot("r2a04","A summer abroad","B1",["When I was nineteen, I decided to spend a summer working abroad.","I found a job in a hotel in the south of France.","The work there was hard, and my French was very poor at the beginning.","But the other staff were patient and helped me learn.","By the end of the summer, I could have simple conversations with the guests.","That experience gave me the confidence to study languages at university."]),ot("r2a05","A new office","B1",["We are pleased to announce that our company is opening a new office in Valencia.","The office will be located in the city centre, close to the train station.","Around forty people will work there when it opens in March.","Most of these positions will be filled by local candidates.","Anyone interested in applying should visit the careers page of our website.","Applications must be received by the end of January."]),ot("r2a06","Why bees matter","B2",["Bees play a vital role in producing much of the food we eat.","As they move from flower to flower, they carry the pollen that plants need to produce fruit.","Without this process, crops such as apples and almonds would fail.","Unfortunately, bee populations have fallen sharply in many countries.","Scientists believe this decline is caused by pesticides, disease and the loss of wild flowers.","To help, some cities are now planting flowers on rooftops and along roads."]),ot("r2a07","A hotel complaint","B2",["I am writing to complain about my recent stay at your hotel.","When I arrived, I was told that the room I had booked was not available.","Instead, I was given a much smaller room overlooking the car park.","In addition, the air conditioning in this room did not work.","I reported the problem twice, but nobody came to repair it.","I would therefore like a partial refund for the three nights I stayed."]),ot("r2a08","The summer festival","B2",["The town’s summer festival began in 1985 as a small music event.","In its first year, only a few hundred people attended.","Over the following decade, however, it grew steadily in popularity.","By 2000, it was attracting more than twenty thousand visitors.","This growth brought money into the town, but it also caused problems with traffic and rubbish.","As a result, the organisers now limit the number of tickets they sell each day."]),ot("r2a09","Studying online","B2",["A recent study looked at how well students learn when they study online.","The researchers followed three hundred university students for a full year.","Half of them attended classes in person, while the other half studied from home.","At the end of the year, both groups took the same exam.","Surprisingly, there was little difference between their results.","However, the students who studied online said they had felt more isolated."]),ot("r2a10","Welcome to the gym","B1",["Welcome to Fitline Gym, and thank you for joining us.","Before you use any machines, you must book an introductory session with one of our trainers.","During this session, the trainer will show you how to use the equipment safely.","They will also help you create a personal training plan.","Once you have completed the session, you will receive your membership card.","This card gives you access to the gym seven days a week."])],Ve=["Person A","Person B","Person C","Person D"],il=[{id:"r3a01",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"City or countryside?",instructions:qe,options:Ve,texts:[{label:"Person A",text:"I grew up on a farm and moved to the city for university. At first I loved the energy, but after a few years the noise and the cost of rent became too much. Now I live in a village again and do my job online. Anyone who can work from home should consider leaving the city; the quality of life is simply better."},{label:"Person B",text:"People romanticise the countryside, but they forget how isolated it can be. My grandparents live in a small village and have to drive forty minutes to see a doctor. For young people especially, the city offers jobs, culture and friends. I can’t imagine living anywhere else."},{label:"Person C",text:"I think it depends on your stage of life. When I was single, the city was perfect. Now I have two small children, and I want them to grow up with fresh air and space to play. We moved out last year and I don’t regret it, although I do miss the restaurants."},{label:"Person D",text:"Honestly, the countryside isn’t as peaceful as people say. Where I live, tractors start at five in the morning and the internet connection is terrible. The city is noisy too, of course, but at least services are close. The government should invest more in rural areas so that people have a real choice."}],items:[{prompt:"Who thinks the best place to live changes as your life changes?",answer:"Person C"},{prompt:"Who mentions difficult access to healthcare outside cities?",answer:"Person B"},{prompt:"Who believes the authorities should improve life in villages?",answer:"Person D"},{prompt:"Who says working remotely makes country life possible?",answer:"Person A"},{prompt:"Who says rural areas can be noisy?",answer:"Person D"},{prompt:"Who misses something about living in a city?",answer:"Person C"},{prompt:"Who thinks young people are better off in the city?",answer:"Person B"}]},{id:"r3a02",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Should children have smartphones?",instructions:qe,options:Ve,texts:[{label:"Person A",text:"My daughter got her first phone at twelve, when she started taking the bus to school on her own. For me it was mainly about being able to reach her. We agreed some rules: no phone at the dinner table and no phone in her bedroom at night. So far it has worked well."},{label:"Person B",text:"As a teacher, I see the effect of phones every day. Students are more distracted and find it harder to concentrate on long texts. I’m glad our school has banned phones during lessons, but the ban should include break times too, so that children actually talk to each other."},{label:"Person C",text:"Phones aren’t the problem; it’s how they’re used. My son learns the guitar with online videos and video-calls his cousins abroad. Instead of banning phones, we should be teaching children how to use technology responsibly. That’s a skill they’ll need for the rest of their lives."},{label:"Person D",text:"I didn’t give my kids smartphones until they were sixteen, and I’m glad I waited. They complained a lot because all their friends had one, but they spent their free time doing sport and reading. If parents are worried about safety, there are basic phones that only make calls."}],items:[{prompt:"Who gave their child a phone mainly to stay in contact?",answer:"Person A"},{prompt:"Who thinks phones should not be allowed at any time during the school day?",answer:"Person B"},{prompt:"Who suggests an alternative to a smartphone?",answer:"Person D"},{prompt:"Who describes ways a phone can help a child learn?",answer:"Person C"},{prompt:"Who set limits on when the phone can be used?",answer:"Person A"},{prompt:"Who says their children were unhappy with a decision?",answer:"Person D"},{prompt:"Who thinks children need to be taught to use technology well?",answer:"Person C"}]},{id:"r3a03",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Tourism in popular cities",instructions:qe,options:Ve,texts:[{label:"Person A",text:"I’ve lived in the old town for thirty years, and I hardly recognise it now. Most of the flats in my building are holiday rentals, so my neighbours change every week. The bakery I used to go to has become a souvenir shop. Tourism brings money, I understand that, but the people who actually live here are being pushed out."},{label:"Person B",text:"Without tourists, my restaurant would close tomorrow. Around seventy percent of my customers come from abroad, especially in summer. Of course there are problems, but people forget how many jobs depend on visitors."},{label:"Person C",text:"The issue is not the number of tourists but where they go. Everyone visits the same three streets at the same time. If we promoted other neighbourhoods and encouraged people to come outside the peak season, the pressure would be much lower."},{label:"Person D",text:"I love travelling, but I’ve started to feel guilty about it. When I visited a famous city last spring, it was so crowded that I couldn’t enjoy anything. Now I choose smaller destinations and travel by train whenever I can. I’d happily pay a tourist tax if it helped local people."}],items:[{prompt:"Who has changed the way they go on holiday?",answer:"Person D"},{prompt:"Who says visitors should be spread across more areas?",answer:"Person C"},{prompt:"Who regrets that local shops have disappeared?",answer:"Person A"},{prompt:"Who depends on tourists for their income?",answer:"Person B"},{prompt:"Who would accept paying more to visit a place?",answer:"Person D"},{prompt:"Who suggests visiting at different times of the year?",answer:"Person C"},{prompt:"Who says residents are being forced to leave?",answer:"Person A"}]},{id:"r3a04",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Learning a language as an adult",instructions:qe,options:Ve,texts:[{label:"Person A",text:"I started learning German at fifty-five, and I’m proof that it’s never too late. Progress is slower than when you’re young, I admit, but adults are more disciplined. I study for twenty minutes every morning before work, and after three years I can read newspapers."},{label:"Person B",text:"Apps are fun, but in my experience they don’t take you very far. I used one for a year and learned lots of words, yet I still couldn’t hold a conversation. It was only when I joined a weekly class with a real teacher that I started speaking."},{label:"Person C",text:"The best way is to live in the country. I moved to Italy for work without speaking a word, and within six months I could manage everyday situations. You have no choice but to communicate, and that pressure makes you learn fast."},{label:"Person D",text:"People give up because they set unrealistic goals. They want to be fluent in a year, and when that doesn’t happen they feel like failures. I tell my students to focus on small achievements, like ordering a meal or understanding a song."}],items:[{prompt:"Who found a class more useful than technology?",answer:"Person B"},{prompt:"Who thinks having to use the language helps you learn?",answer:"Person C"},{prompt:"Who has a daily study routine?",answer:"Person A"},{prompt:"Who thinks learners expect too much too quickly?",answer:"Person D"},{prompt:"Who says older learners have an advantage?",answer:"Person A"},{prompt:"Who teaches languages?",answer:"Person D"},{prompt:"Who learned mainly through everyday life abroad?",answer:"Person C"}]},{id:"r3a05",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"A four-day working week",instructions:qe,options:Ve,texts:[{label:"Person A",text:"We tried a four-day week in our company for six months, and productivity actually went up. Staff were more focused because they knew they had less time, and fewer people were off sick. We’ve decided to keep it permanently."},{label:"Person B",text:"It sounds great, but it isn’t realistic for everyone. Hospitals need staff seven days a week. If nurses worked fewer days, we would need to hire many more people, and there simply aren’t enough of them."},{label:"Person C",text:"My company introduced a four-day week, but in practice we do the same amount of work in four days. I’m more tired than before, although I do enjoy the long weekends. I’d prefer shorter days rather than fewer days."},{label:"Person D",text:"The evidence so far comes mainly from office jobs and small trials. Before governments make it law, we need larger studies across different sectors. I’m not against the idea, but we shouldn’t rush."}],items:[{prompt:"Who says the change reduced staff illness?",answer:"Person A"},{prompt:"Who feels their workload has not become smaller?",answer:"Person C"},{prompt:"Who thinks more research is needed?",answer:"Person D"},{prompt:"Who mentions a lack of available workers?",answer:"Person B"},{prompt:"Who would prefer a different kind of change?",answer:"Person C"},{prompt:"Who has made the change permanent?",answer:"Person A"},{prompt:"Who says the idea cannot work in some jobs?",answer:"Person B"}]},{id:"r3a06",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Electric cars",instructions:qe,options:Ve,texts:[{label:"Person A",text:"I bought an electric car last year and I’ll never go back. It’s silent, it’s cheap to run, and I charge it at home overnight. The only thing that worries me is long journeys, because there still aren’t enough charging points on the motorway."},{label:"Person B",text:"Everyone talks about electric cars as if they were the answer, but a car is still a car. It takes up space, it causes traffic jams and it needs roads. If we really want cleaner cities, we should invest in buses, trams and cycle lanes instead."},{label:"Person C",text:"I’d like to switch, but they’re simply too expensive for me. A second-hand petrol car costs a third of the price of a new electric one. Until the government offers bigger discounts, people on normal salaries will keep driving what they can afford."},{label:"Person D",text:"As a mechanic, I’ve noticed that electric cars need far less maintenance. There’s no oil to change and the brakes last much longer. However, when the battery fails, the repair can cost a fortune, and few garages are trained to do it."}],items:[{prompt:"Who thinks public transport is a better solution?",answer:"Person B"},{prompt:"Who cannot afford an electric car at the moment?",answer:"Person C"},{prompt:"Who mentions a lack of infrastructure for long trips?",answer:"Person A"},{prompt:"Who talks about electric cars from a professional point of view?",answer:"Person D"},{prompt:"Who believes financial help from the state is needed?",answer:"Person C"},{prompt:"Who says one particular repair can be very expensive?",answer:"Person D"},{prompt:"Who is completely satisfied with their decision?",answer:"Person A"}]},{id:"r3a07",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Homework",instructions:qe,options:Ve,texts:[{label:"Person A",text:"As a primary school teacher, I stopped giving homework three years ago. Young children need time to play, read for pleasure and be with their families. I haven’t seen any drop in results, and the children arrive at school more relaxed."},{label:"Person B",text:"My son is sixteen and has two hours of homework every night. Some of it is useful, but much of it is just copying from the textbook. I’m not against homework, but it should be shorter and it should make students think."},{label:"Person C",text:"I always did my homework, and I believe it taught me discipline. Learning to work alone, without a teacher next to you, is something you need at university and at work. Schools that abolish homework are not preparing students for real life."},{label:"Person D",text:"Homework makes inequality worse. Children whose parents can help them, or pay for a private tutor, do well. Children from homes where nobody has time or the right knowledge fall behind. If practice is needed, it should happen at school."}],items:[{prompt:"Who thinks homework helps students develop independence?",answer:"Person C"},{prompt:"Who says that removing homework has not harmed learning?",answer:"Person A"},{prompt:"Who thinks some families have an unfair advantage?",answer:"Person D"},{prompt:"Who criticises the type of tasks given as homework?",answer:"Person B"},{prompt:"Who believes extra practice should take place in the classroom?",answer:"Person D"},{prompt:"Who links homework to success in later life?",answer:"Person C"},{prompt:"Who mentions the importance of family time for young children?",answer:"Person A"}]},{id:"r3a08",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Fast fashion",instructions:qe,options:Ve,texts:[{label:"Person A",text:"I love fashion, and cheap clothes mean I can follow trends without spending much. I know the factories aren’t perfect, but I don’t think it’s fair to blame shoppers. It’s the companies and governments that should improve working conditions."},{label:"Person B",text:"A few years ago I decided to buy only second-hand clothes. Charity shops and online apps have amazing things, and it’s much better for the planet. The only problem is that it takes time to find clothes in my size."},{label:"Person C",text:"I work in a clothing shop, and I see how much is thrown away. Items that don’t sell are often destroyed rather than given away. Customers would be shocked if they knew. I’m trying to change this policy in my company."},{label:"Person D",text:"I prefer to spend more on fewer clothes. A good coat can last ten years, while a cheap one is finished after one winter. In the long run, quality clothes are actually the economical option."}],items:[{prompt:"Who says buying better clothes saves money over time?",answer:"Person D"},{prompt:"Who describes a practice that customers are not aware of?",answer:"Person C"},{prompt:"Who thinks consumers should not be held responsible?",answer:"Person A"},{prompt:"Who finds it difficult to find clothes that fit?",answer:"Person B"},{prompt:"Who is trying to change things where they work?",answer:"Person C"},{prompt:"Who chooses clothes mainly for environmental reasons?",answer:"Person B"},{prompt:"Who enjoys keeping up with new styles?",answer:"Person A"}]},{id:"r3a09",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Keeping pets in flats",instructions:qe,options:Ve,texts:[{label:"Person A",text:"We have a large dog in a small flat, and it works because we walk him three times a day. People who say dogs need a garden are wrong; what they need is exercise and company. A garden doesn’t help if the dog is alone all day."},{label:"Person B",text:"My neighbours’ dog barks for hours when they are at work. I’ve spoken to them twice and nothing has changed. I like animals, but I think building owners should be allowed to set clear rules about pets."},{label:"Person C",text:"For older people living alone, a pet can make an enormous difference. My grandmother adopted a cat after my grandfather died, and it gave her a reason to get up every morning. It’s a pity that some landlords don’t allow animals."},{label:"Person D",text:"People should think carefully before getting a pet. Every summer, animal shelters fill up with dogs and cats that were bought as presents and later abandoned. A pet is a commitment of ten or fifteen years, not a toy."}],items:[{prompt:"Who has had a problem with noise?",answer:"Person B"},{prompt:"Who says an animal’s needs are not about space?",answer:"Person A"},{prompt:"Who talks about the emotional benefits of having a pet?",answer:"Person C"},{prompt:"Who mentions animals that people no longer want?",answer:"Person D"},{prompt:"Who thinks there should be more regulations?",answer:"Person B"},{prompt:"Who criticises property owners who ban animals?",answer:"Person C"},{prompt:"Who says owning a pet is a long-term responsibility?",answer:"Person D"}]},{id:"r3a10",skill:"reading",kind:"reading-opinion",level:"B2",topic:"Opinion matching",title:"Volunteering",instructions:qe,options:Ve,texts:[{label:"Person A",text:"I started volunteering at a food bank to add something to my CV, if I’m honest. But after a few months it became the best part of my week. I’ve made close friends there, and I go now simply because I enjoy it."},{label:"Person B",text:"I think volunteering should be part of the school curriculum. Teenagers would learn about their own community and develop skills like teamwork and responsibility. Some countries already do this, and it seems to work well."},{label:"Person C",text:"I run a charity, and we couldn’t survive without volunteers. However, I worry when governments rely on them to provide basic services. Caring for elderly people, for example, is a job that should be properly paid."},{label:"Person D",text:"I’d love to volunteer, but with two jobs and a child, I have no free time at all. Organisations should offer more flexible options, like helping online for an hour from home. Not everyone can commit to a fixed timetable."}],items:[{prompt:"Who had a practical reason for starting to volunteer?",answer:"Person A"},{prompt:"Who thinks young people should be required to volunteer?",answer:"Person B"},{prompt:"Who believes some work should not be done for free?",answer:"Person C"},{prompt:"Who suggests a way to make volunteering easier?",answer:"Person D"},{prompt:"Who mentions examples from other countries?",answer:"Person B"},{prompt:"Who says volunteering has improved their social life?",answer:"Person A"},{prompt:"Who manages an organisation?",answer:"Person C"}]},{id:"r3a11",skill:"reading",kind:"reading-opinion",level:"C1",topic:"Opinion matching",title:"Artificial intelligence at work",instructions:qe,options:Ve,texts:[{label:"Person A",text:"In my translation agency, AI tools now produce first drafts in seconds. Our translators spend their time checking and improving the text instead. We take on twice as many projects as before, although clients now expect lower prices."},{label:"Person B",text:"I’m a graphic designer, and I’m genuinely worried. Clients who used to pay me for illustrations now generate images themselves for almost nothing. I’ve lost about a third of my income in two years, and nobody seems to care."},{label:"Person C",text:"Every new technology causes panic. People said computers would destroy office jobs, and instead they created millions of new ones. AI will be the same: some tasks will disappear, but others we can’t imagine yet will appear."},{label:"Person D",text:"What concerns me is not jobs but mistakes. These systems sound very confident even when they are completely wrong. In fields like medicine or law, a human expert must always check the result before anyone acts on it."}],items:[{prompt:"Who compares AI with earlier changes in technology?",answer:"Person C"},{prompt:"Who has experienced a fall in earnings?",answer:"Person B"},{prompt:"Who thinks AI should always be supervised in certain professions?",answer:"Person D"},{prompt:"Who says their business has become more productive?",answer:"Person A"},{prompt:"Who points out a disadvantage of increased efficiency?",answer:"Person A"},{prompt:"Who feels their situation is being ignored?",answer:"Person B"},{prompt:"Who is optimistic about future employment?",answer:"Person C"}]}],vp=["Paragraph 1","Paragraph 2","Paragraph 3","Paragraph 4","Paragraph 5","Paragraph 6","Paragraph 7"];function ft(e,t,n,o,r,a){const i=[...r,a].sort();return{id:e,skill:"reading",kind:"reading-headings",title:t,instructions:jg,level:n,topic:"Long text: headings",options:i,texts:o.map((l,c)=>({label:vp[c],text:l})),items:r.map((l,c)=>({prompt:vp[c],answer:l})),explanation:`Titular que sobra: “${a}”.`}}const sl=[ft("r4a01","Sleep and memory","B2",["For centuries, sleep was seen as a simple period of rest, a time when the brain more or less switched off. Scientists had few ways to study what happened at night. That changed in the twentieth century, when new equipment allowed researchers to record the electrical activity of the sleeping brain, and they discovered that it was surprisingly busy.","We now know that sleep is not one single state. During the night we move through light sleep, deep sleep and a stage in which the eyes move rapidl
