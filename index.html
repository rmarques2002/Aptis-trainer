ly ... when' uses past perfect.",level:"C1",topic:"Inversion"},{id:"gv012",skill:"grammar",type:"multiple-choice",prompt:"The instructions were so unclear that ____ knew what to do.",options:["anyone","someone","no one","everyone"],answer:2,explanation:"The negative result 'so unclear that no one knew' fits the meaning.",level:"B1",topic:"Quantifiers"},{id:"gv013",skill:"grammar",type:"multiple-choice",prompt:"You ____ have told me earlier — I could have helped.",options:["should","must","can","would"],answer:0,explanation:"'Should have + past participle' criticises a past action that didn't happen.",level:"B2",topic:"Modal perfect"},{id:"gv014",skill:"grammar",type:"multiple-choice",prompt:"The project was completed ____ schedule and under budget.",options:["ahead of","in front of","before of","forward of"],answer:0,explanation:"The idiom is 'ahead of schedule'.",level:"B2",topic:"Collocations"},{id:"gv015",skill:"grammar",type:"multiple-choice",prompt:"It's high time we ____ this problem seriously.",options:["take","took","have taken","are taking"],answer:1,explanation:"'It's high time' is followed by the past simple with present meaning.",level:"C1",topic:"Unreal past"},{id:"gv016",skill:"grammar",type:"multiple-choice",prompt:"Neither the manager nor the staff ____ happy with the change.",options:["was","were","is","have"],answer:1,explanation:"With 'neither ... nor', the verb agrees with the nearer subject ('staff').",level:"B2",topic:"Subject-verb agreement"},{id:"gv017",skill:"grammar",type:"multiple-choice",prompt:"I wish I ____ spent so much money last weekend.",options:["didn't","hadn't","wouldn't","haven't"],answer:1,explanation:"'Wish + past perfect' expresses a regret about the past.",level:"B2",topic:"Wishes and regrets"},{id:"gv018",skill:"grammar",type:"multiple-choice",prompt:"The more you practise, ____ you become.",options:["the confident","more confident","the more confident","confident"],answer:2,explanation:"Double comparatives use 'the more ..., the more ...'.",level:"B2",topic:"Comparatives"},{id:"gv019",skill:"grammar",type:"multiple-choice",prompt:"She looked ____ she'd seen a ghost.",options:["as","like","as if","so"],answer:2,explanation:"'As if / as though' introduces a hypothetical comparison.",level:"B2",topic:"As if / as though"},{id:"gv020",skill:"grammar",type:"multiple-choice",prompt:"Under no circumstances ____ the door be left unlocked.",options:["should","the","must to","can to"],answer:0,explanation:"The fronted negative 'under no circumstances' forces inversion.",level:"C1",topic:"Inversion"},{id:"gv021",skill:"grammar",type:"cloze",prompt:"Despite ____ hard, she didn't pass the exam.",options:["study","studying","to study","studied"],answer:1,explanation:"'Despite' is a preposition, so it's followed by a noun or -ing form.",level:"B2",topic:"Linkers"},{id:"gv022",skill:"grammar",type:"cloze",prompt:"We'll go for a walk ____ it doesn't rain.",options:["unless","provided","although","despite"],answer:1,explanation:"'Provided (that)' means 'only if' and fits a positive condition.",level:"B2",topic:"Conditional linkers"},{id:"gv023",skill:"grammar",type:"cloze",prompt:"He speaks English ____ if it were his mother tongue.",options:["like","as","so","such"],answer:1,explanation:"'As if' is the natural collocation for hypothetical comparison here.",level:"B2",topic:"Linkers"},{id:"gv024",skill:"grammar",type:"cloze",prompt:"The manager asked us to keep her ____ of any changes.",options:["informed","informing","inform","information"],answer:0,explanation:"'Keep someone informed' is a fixed structure with the past participle.",level:"B2",topic:"Collocations"},{id:"gv025",skill:"grammar",type:"cloze",prompt:"There's no point ____ about it now — it's done.",options:["to worry","worrying","worry","worried"],answer:1,explanation:"'There's no point (in) + -ing' is the fixed pattern.",level:"B2",topic:"Gerunds"},{id:"gv026",skill:"grammar",type:"cloze",prompt:"I'm not used ____ up so early.",options:["to get","to getting","get","getting"],answer:1,explanation:"'Be used to + -ing' describes a familiar habit.",level:"B2",topic:"Used to / be used to"},{id:"gv027",skill:"grammar",type:"cloze",prompt:"The results were ____ from what we expected.",options:["far","much","very","too"],answer:0,explanation:"'Far from' means 'completely different from / not at all'.",level:"B2",topic:"Idiomatic phrases"},{id:"gv028",skill:"grammar",type:"cloze",prompt:"She managed to finish the race ____ her injury.",options:["although","despite","however","because"],answer:1,explanation:"'Despite + noun' concedes the injury.",level:"B2",topic:"Linkers"},{id:"gv029",skill:"grammar",type:"collocation",prompt:"The company hopes to ____ a strong impression at the trade fair.",options:["do","make","take","have"],answer:1,explanation:"The collocation is 'make an impression'.",level:"B2",topic:"Collocations (make/do)"},{id:"gv030",skill:"grammar",type:"collocation",prompt:"Please ____ into account the extra costs.",options:["make","take","get","put"],answer:1,explanation:"'Take into account' means to consider.",level:"B2",topic:"Collocations"},{id:"gv031",skill:"grammar",type:"collocation",prompt:"They finally ____ a decision after hours of debate.",options:["did","made","took","gave"],answer:1,explanation:"In standard English you 'make a decision'.",level:"B1",topic:"Collocations (make/do)"},{id:"gv032",skill:"grammar",type:"collocation",prompt:"The new evidence ____ serious doubt on his story.",options:["puts","casts","makes","gives"],answer:1,explanation:"The collocation is 'cast doubt on something'.",level:"C1",topic:"Collocations"},{id:"gv033",skill:"grammar",type:"collocation",prompt:"We need to ____ progress if we want to meet the deadline.",options:["make","do","take","have"],answer:0,explanation:"'Make progress' is the correct collocation.",level:"B1",topic:"Collocations (make/do)"},{id:"gv034",skill:"grammar",type:"collocation",prompt:"Her comments ____ a lot of controversy.",options:["raised","caused","did","took"],answer:1,explanation:"'Cause controversy' is the natural collocation.",level:"B2",topic:"Collocations"},{id:"gv035",skill:"grammar",type:"collocation",prompt:"Let's ____ a break and continue after lunch.",options:["make","do","take","get"],answer:2,explanation:"'Take a break' is the standard collocation.",level:"B1",topic:"Collocations"},{id:"gv036",skill:"grammar",type:"collocation",prompt:"The scandal did serious ____ to the brand's reputation.",options:["harm","damage","hurt","injury"],answer:1,explanation:"'Do damage to' is the fixed collocation for reputations.",level:"B2",topic:"Collocations"},{id:"gv037",skill:"grammar",type:"phrasal-verb",prompt:"The meeting was ____ until next week.",options:["put off","put on","put up","put out"],answer:0,explanation:"'Put off' means to postpone.",level:"B2",topic:"Phrasal verbs"},{id:"gv038",skill:"grammar",type:"phrasal-verb",prompt:"I can't ____ with this noise any longer.",options:["put up","put off","put out","put in"],answer:0,explanation:"'Put up with' means to tolerate.",level:"B2",topic:"Phrasal verbs"},{id:"gv039",skill:"grammar",type:"phrasal-verb",prompt:"Sales figures have ____ sharply this quarter.",options:["gone off","picked up","turned down","come across"],answer:1,explanation:"'Pick up' means to improve or increase.",level:"B2",topic:"Phrasal verbs"},{id:"gv040",skill:"grammar",type:"phrasal-verb",prompt:"She ____ an old friend at the conference.",options:["ran into","ran over","ran out","ran up"],answer:0,explanation:"'Run into' means to meet by chance.",level:"B1",topic:"Phrasal verbs"},{id:"gv041",skill:"grammar",type:"phrasal-verb",prompt:"We're ____ of time, so let's be quick.",options:["running out","running up","running into","running down"],answer:0,explanation:"'Run out of' means to have none left.",level:"B1",topic:"Phrasal verbs"},{id:"gv042",skill:"grammar",type:"phrasal-verb",prompt:"The negotiations eventually ____ .",options:["broke down","broke up","broke off","broke in"],answer:0,explanation:"'Break down' means to fail/collapse (for talks or machines).",level:"B2",topic:"Phrasal verbs"},{id:"gv043",skill:"grammar",type:"phrasal-verb",prompt:"Could you ____ the main points of the report?",options:["sum up","add up","take up","make up"],answer:0,explanation:"'Sum up' means to summarise.",level:"B2",topic:"Phrasal verbs"},{id:"gv044",skill:"grammar",type:"phrasal-verb",prompt:"He ____ the invitation because he was too busy.",options:["turned down","turned up","turned over","turned into"],answer:0,explanation:"'Turn down' means to refuse.",level:"B1",topic:"Phrasal verbs"},{id:"gv045",skill:"grammar",type:"phrasal-verb",prompt:"New evidence ____ during the investigation.",options:["came up","came across","came round","came off"],answer:0,explanation:"'Come up' means to arise/appear unexpectedly.",level:"B2",topic:"Phrasal verbs"},{id:"gv046",skill:"grammar",type:"phrasal-verb",prompt:"I came ____ this article while researching.",options:["across","over","into","up"],answer:0,explanation:"'Come across' means to find by chance.",level:"B2",topic:"Phrasal verbs"},{id:"gv047",skill:"grammar",type:"word-formation",prompt:"Her argument was completely ____ . (convince)",options:["convince","convincing","convinced","convincingly"],answer:1,explanation:"An adjective describing the argument is needed: 'convincing'.",level:"B2",topic:"Word formation"},{id:"gv048",skill:"grammar",type:"word-formation",prompt:"The instructions lacked ____ , so we got confused. (clear)",options:["clearly","clearness","clarity","clarify"],answer:2,explanation:"The noun form is 'clarity'.",level:"B2",topic:"Word formation"},{id:"gv049",skill:"grammar",type:"word-formation",prompt:"They handled the complaint very ____ . (profession)",options:["profession","professional","professionally","professionalism"],answer:2,explanation:"An adverb modifying 'handled' is required: 'professionally'.",level:"B2",topic:"Word formation"},{id:"gv050",skill:"grammar",type:"word-formation",prompt:"The team showed remarkable ____ under pressure. (resilient)",options:["resilient","resilience","resiliently","resile"],answer:1,explanation:"The noun is 'resilience'.",level:"C1",topic:"Word formation"},{id:"gv051",skill:"grammar",type:"word-formation",prompt:"His ____ to detail impressed everyone. (attentive)",options:["attentive","attentively","attention","attentiveness"],answer:3,explanation:"'Attentiveness to detail' uses the abstract noun.",level:"C1",topic:"Word formation"},{id:"gv052",skill:"grammar",type:"word-formation",prompt:"The plan proved ____ in the long run. (benefit)",options:["benefit","beneficial","beneficially","benefiting"],answer:1,explanation:"The adjective is 'beneficial'.",level:"B2",topic:"Word formation"},{id:"gv053",skill:"grammar",type:"word-formation",prompt:"We need a more ____ approach to the problem. (system)",options:["system","systematic","systematically","systemise"],answer:1,explanation:"The adjective is 'systematic'.",level:"B2",topic:"Word formation"},{id:"gv054",skill:"grammar",type:"word-formation",prompt:"Her ____ to finish the project was inspiring. (determine)",options:["determine","determined","determination","determinedly"],answer:2,explanation:"The noun is 'determination'.",level:"B2",topic:"Word formation"},{id:"gv055",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'The results were significant.'",options:["tiny","important","random","unclear"],answer:1,explanation:"'Significant' means notable or important.",level:"B2",topic:"Synonyms"},{id:"gv056",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'a tedious task'",options:["exciting","boring","difficult","short"],answer:1,explanation:"'Tedious' means long and boring.",level:"B2",topic:"Synonyms"},{id:"gv057",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'She was reluctant to agree.'",options:["eager","unwilling","quick","happy"],answer:1,explanation:"'Reluctant' means unwilling.",level:"B2",topic:"Synonyms"},{id:"gv058",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'a feasible plan'",options:["impossible","expensive","achievable","secret"],answer:2,explanation:"'Feasible' means possible/achievable.",level:"B2",topic:"Synonyms"},{id:"gv059",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'The evidence was compelling.'",options:["weak","convincing","confusing","optional"],answer:1,explanation:"'Compelling' means very convincing.",level:"C1",topic:"Synonyms"},{id:"gv060",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'to alleviate stress'",options:["increase","reduce","ignore","cause"],answer:1,explanation:"'Alleviate' means to reduce or ease.",level:"C1",topic:"Synonyms"},{id:"gv061",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'a meticulous worker'",options:["careless","very careful","lazy","fast"],answer:1,explanation:"'Meticulous' means extremely careful and precise.",level:"C1",topic:"Synonyms"},{id:"gv062",skill:"grammar",type:"synonym",prompt:"Choose the closest meaning: 'an abrupt ending'",options:["gradual","sudden","happy","planned"],answer:1,explanation:"'Abrupt' means sudden and unexpected.",level:"B2",topic:"Synonyms"},{id:"gv063",skill:"grammar",type:"antonym",prompt:"Choose the OPPOSITE: 'a scarce resource'",options:["rare","abundant","useful","cheap"],answer:1,explanation:"'Scarce' (in short supply) is the opposite of 'abundant'.",level:"B2",topic:"Antonyms"},{id:"gv064",skill:"grammar",type:"antonym",prompt:"Choose the OPPOSITE: 'a temporary solution'",options:["short","quick","permanent","cheap"],answer:2,explanation:"'Temporary' is the opposite of 'permanent'.",level:"B1",topic:"Antonyms"},{id:"gv065",skill:"grammar",type:"antonym",prompt:"Choose the OPPOSITE: 'a vague answer'",options:["precise","long","polite","wrong"],answer:0,explanation:"'Vague' (unclear) is the opposite of 'precise'.",level:"B2",topic:"Antonyms"},{id:"gv066",skill:"grammar",type:"antonym",prompt:"Choose the OPPOSITE: 'to expand the business'",options:["grow","shrink","move","sell"],answer:1,explanation:"'Expand' is the opposite of 'shrink'.",level:"B1",topic:"Antonyms"},{id:"gv067",skill:"grammar",type:"antonym",prompt:"Choose the OPPOSITE: 'a generous offer'",options:["kind","large","stingy","fair"],answer:2,explanation:"'Generous' is the opposite of 'stingy/mean'.",level:"B2",topic:"Antonyms"},{id:"gv068",skill:"grammar",type:"antonym",prompt:"Choose the OPPOSITE: 'a deliberate mistake'",options:["accidental","serious","small","obvious"],answer:0,explanation:"'Deliberate' (intentional) is the opposite of 'accidental'.",level:"B2",topic:"Antonyms"},{id:"gv069",skill:"grammar",type:"vocab",prompt:"The witness gave a ____ account of the accident.",options:["detailed","detail","detailing","details"],answer:0,explanation:"An adjective before 'account' is needed: 'detailed'.",level:"B2",topic:"Vocabulary in context"},{id:"gv070",skill:"grammar",type:"vocab",prompt:"Regular exercise can ____ your overall wellbeing.",options:["enhance","enlarge","expand","extend"],answer:0,explanation:"'Enhance' means to improve the quality of something.",level:"B2",topic:"Vocabulary in context"},{id:"gv071",skill:"grammar",type:"vocab",prompt:"The company is ____ committed to reducing waste.",options:["firmly","hardly","barely","rarely"],answer:0,explanation:"'Firmly committed' is the natural intensifier collocation.",level:"B2",topic:"Vocabulary in context"},{id:"gv072",skill:"grammar",type:"vocab",prompt:"A ____ of factors led to the delay.",options:["combination","combine","combined","combining"],answer:0,explanation:"The noun 'combination' fits after the article.",level:"B2",topic:"Vocabulary in context"},{id:"gv073",skill:"grammar",type:"vocab",prompt:"They reached a ____ after long discussions.",options:["compromise","promise","comprise","composure"],answer:0,explanation:"A 'compromise' is an agreement where both sides give something up.",level:"B2",topic:"Vocabulary in context"},{id:"gv074",skill:"grammar",type:"vocab",prompt:"The software update ____ several security issues.",options:["addressed","addressing","address","addresses"],answer:0,explanation:"Past simple 'addressed' matches the past context.",level:"B2",topic:"Vocabulary in context"},{id:"gv075",skill:"grammar",type:"cloze",prompt:"She's responsible ____ managing the whole team.",options:["of","for","to","with"],answer:1,explanation:"'Responsible for' is the fixed preposition.",level:"B1",topic:"Prepositions"},{id:"gv076",skill:"grammar",type:"cloze",prompt:"There's been a rise ____ demand for electric cars.",options:["of","on","in","to"],answer:2,explanation:"We say 'a rise in' something.",level:"B2",topic:"Prepositions"},{id:"gv077",skill:"grammar",type:"cloze",prompt:"I congratulated her ____ passing the exam.",options:["for","on","about","with"],answer:1,explanation:"'Congratulate someone on something' is the collocation.",level:"B2",topic:"Prepositions"},{id:"gv078",skill:"grammar",type:"cloze",prompt:"He apologised ____ being late.",options:["for","of","about","to"],answer:0,explanation:"'Apologise for + -ing' is the fixed pattern.",level:"B1",topic:"Prepositions"},{id:"gv079",skill:"grammar",type:"cloze",prompt:"This decision depends ____ several factors.",options:["of","on","from","in"],answer:1,explanation:"'Depend on' is the correct dependent preposition.",level:"B1",topic:"Prepositions"},{id:"gv080",skill:"grammar",type:"cloze",prompt:"The town is famous ____ its medieval castle.",options:["of","for","with","by"],answer:1,explanation:"'Famous for' is the fixed collocation.",level:"B1",topic:"Prepositions"},{id:"gv081",skill:"grammar",type:"multiple-choice",prompt:"I ____ here since 2019.",options:["work","worked","have worked","am working"],answer:2,explanation:"Present perfect with 'since' links past to present.",level:"B1",topic:"Present perfect"},{id:"gv082",skill:"grammar",type:"multiple-choice",prompt:"While I ____ dinner, the lights went out.",options:["cooked","was cooking","cook","had cooked"],answer:1,explanation:"Past continuous sets the background action interrupted by the past simple.",level:"B1",topic:"Past continuous"},{id:"gv083",skill:"grammar",type:"multiple-choice",prompt:"By 2030, solar power ____ much cheaper.",options:["becomes","will have become","is becoming","became"],answer:1,explanation:"Future perfect describes completion before a future point.",level:"B2",topic:"Future perfect"},{id:"gv084",skill:"grammar",type:"multiple-choice",prompt:"The bridge ____ in 1932.",options:["built","was built","has built","is building"],answer:1,explanation:"Passive past simple: 'was built'.",level:"B1",topic:"Passive voice"},{id:"gv085",skill:"grammar",type:"multiple-choice",prompt:"This time yesterday we ____ our exam.",options:["sat","were sitting","have sat","sit"],answer:1,explanation:"Past continuous for an action in progress at a past time.",level:"B2",topic:"Past continuous"},{id:"gv086",skill:"grammar",type:"multiple-choice",prompt:"If you had told me, I ____ helped.",options:["would","will have","would have","had"],answer:2,explanation:"Third conditional: 'would have + past participle'.",level:"B2",topic:"Conditionals"},{id:"gv087",skill:"grammar",type:"multiple-choice",prompt:"She said she ____ finish the report by Monday.",options:["will","would","can","shall"],answer:1,explanation:"In reported speech, 'will' shifts to 'would'.",level:"B2",topic:"Reported speech"},{id:"gv088",skill:"grammar",type:"multiple-choice",prompt:"He asked me where I ____ .",options:["live","lived","do live","am living"],answer:1,explanation:"Reported questions use statement order and back-shifted tense.",level:"B2",topic:"Reported speech"},{id:"gv089",skill:"grammar",type:"multiple-choice",prompt:"They told us ____ late.",options:["don't be","not to be","to not be","not being"],answer:1,explanation:"Reported commands use 'told + object + (not) to + infinitive'.",level:"B2",topic:"Reported speech"},{id:"gv090",skill:"grammar",type:"multiple-choice",prompt:"There isn't ____ evidence to support that claim.",options:["many","much","few","a lot"],answer:1,explanation:"'Evidence' is uncountable, so we use 'much'.",level:"B1",topic:"Quantifiers"},{id:"gv091",skill:"grammar",type:"multiple-choice",prompt:"____ of the two options is acceptable.",options:["Both","Neither","All","None"],answer:1,explanation:"'Neither of the two' takes a singular verb and means 'not either'.",level:"B2",topic:"Determiners"},{id:"gv092",skill:"grammar",type:"multiple-choice",prompt:"We have very ____ time left.",options:["few","little","many","a few"],answer:1,explanation:"'Little' is used with uncountable 'time'.",level:"B1",topic:"Quantifiers"},{id:"gv093",skill:"grammar",type:"vocab",prompt:"Let's play it ____ ear and decide later.",options:["by","with","on","in"],answer:0,explanation:"'Play it by ear' means to improvise/decide as you go.",level:"C1",topic:"Idioms"},{id:"gv094",skill:"grammar",type:"vocab",prompt:"The new hire really ____ the ground running.",options:["hit","made","took","got"],answer:0,explanation:"'Hit the ground running' means to start effectively.",level:"C1",topic:"Idioms"},{id:"gv095",skill:"grammar",type:"vocab",prompt:"That's a ____ point — I hadn't considered it.",options:["fair","just","right","true"],answer:0,explanation:"'A fair point' acknowledges a valid argument.",level:"B2",topic:"Idioms"},{id:"gv096",skill:"grammar",type:"multiple-choice",prompt:"Little ____ that his decision would change everything.",options:["he knew","did he know","he did know","knew he"],answer:1,explanation:"'Little' at the front is a negative adverbial forcing inversion.",level:"C1",topic:"Inversion"},{id:"gv097",skill:"grammar",type:"multiple-choice",prompt:"The manager insisted that the report ____ submitted by noon.",options:["is","be","was","would be"],answer:1,explanation:"After 'insist that', the subjunctive base form 'be' is used in formal English.",level:"C1",topic:"Subjunctive"},{id:"gv098",skill:"grammar",type:"multiple-choice",prompt:"I'd sooner walk than ____ in that old car.",options:["travel","to travel","travelling","travelled"],answer:0,explanation:"'Would sooner ... than' is followed by the bare infinitive.",level:"C1",topic:"Preferences"},{id:"gv099",skill:"grammar",type:"multiple-choice",prompt:"No sooner had the show started ____ the power failed.",options:["when","than","then","that"],answer:1,explanation:"'No sooner ... than' is the correct correlative pair.",level:"C1",topic:"Inversion"},{id:"gv100",skill:"grammar",type:"multiple-choice",prompt:"Only after the meeting ____ the real problem.",options:["I understood","understood I","did I understand","I did understand"],answer:2,explanation:"'Only after' fronted triggers inversion of subject and auxiliary.",level:"C1",topic:"Inversion"},{id:"gv101",skill:"grammar",type:"multiple-choice",prompt:"The chef recommended ____ the fish over the meat.",options:["to try","trying","try","tried"],answer:1,explanation:"'Recommend' is followed by the -ing form.",level:"B2",topic:"Verb patterns"},{id:"gv102",skill:"grammar",type:"multiple-choice",prompt:"She's fluent in three languages, ____ is impressive.",options:["that","what","which","who"],answer:2,explanation:"'Which' introduces a non-defining clause referring to the whole idea.",level:"B2",topic:"Relative clauses"},{id:"gv103",skill:"grammar",type:"multiple-choice",prompt:"We had the roof ____ after the storm.",options:["repair","repairing","repaired","to repair"],answer:2,explanation:"Causative 'have something done' uses the past participle.",level:"B2",topic:"Causative"},{id:"gv104",skill:"grammar",type:"multiple-choice",prompt:"It was such ____ interesting film that we watched it twice.",options:["a","an","the","-"],answer:1,explanation:"'Such an' precedes an adjective starting with a vowel sound.",level:"B1",topic:"Articles"},{id:"gv105",skill:"grammar",type:"multiple-choice",prompt:"____ tired, she kept working until midnight.",options:["Despite","Although","In spite","Even"],answer:1,explanation:"'Although + clause' concedes the tiredness.",level:"B2",topic:"Linkers"},{id:"gv106",skill:"grammar",type:"multiple-choice",prompt:"This time next week, I ____ on a beach in Greece.",options:["will lie","will be lying","will have lain","am lying"],answer:1,explanation:"Future continuous (will be + -ing) for an action in progress at a specific future time.",level:"B2",topic:"Future continuous"},{id:"gv107",skill:"grammar",type:"multiple-choice",prompt:"She ____ for three hours by the time the results came out.",options:["waited","had been waiting","has been waiting","was waiting"],answer:1,explanation:"Past perfect continuous emphasises duration up to a point in the past.",level:"B2",topic:"Past perfect continuous"},{id:"gv108",skill:"grammar",type:"multiple-choice",prompt:"I can't meet you at 6 — I ____ my parents from the airport.",options:["collect","will have collected","'ll be collecting","collected"],answer:2,explanation:"Future continuous for a planned/arranged action in progress at that future time.",level:"B2",topic:"Future continuous"},{id:"gv109",skill:"grammar",type:"multiple-choice",prompt:"By 2030, scientists ____ a vaccine for several of these diseases.",options:["will develop","will have developed","are developing","develop"],answer:1,explanation:"Future perfect (will have + past participle) for completion before a future point.",level:"B2",topic:"Future perfect"},{id:"gv110",skill:"grammar",type:"multiple-choice",prompt:"When I got home, I realised I ____ my keys at the office.",options:["left","have left","had left","was leaving"],answer:2,explanation:"Past perfect for the earlier of two past actions.",level:"B1",topic:"Past perfect"},{id:"gv111",skill:"grammar",type:"multiple-choice",prompt:"Look at those clouds — it ____ rain.",options:["is going to","will","would","shall"],answer:0,explanation:"'be going to' for a prediction based on present evidence.",level:"B1",topic:"Future forms"},{id:"gv112",skill:"grammar",type:"multiple-choice",prompt:"I ____ in this city since I was a child.",options:["live","am living","have lived","lived"],answer:2,explanation:"Present perfect with 'since' for an unfinished period up to now.",level:"B1",topic:"Present perfect"},{id:"gv113",skill:"grammar",type:"multiple-choice",prompt:"He was exhausted because he ____ all night.",options:["drove","had been driving","has driven","drives"],answer:1,explanation:"Past perfect continuous explains the cause of a past state.",level:"B2",topic:"Past perfect continuous"},{id:"gv114",skill:"grammar",type:"multiple-choice",prompt:"If you ____ me earlier, I could have helped.",options:["told","had told","would tell","have told"],answer:1,explanation:"Third conditional: 'if' + past perfect for an unreal past situation.",level:"B2",topic:"Conditionals"},{id:"gv115",skill:"grammar",type:"multiple-choice",prompt:"I wouldn't do that if I ____ you.",options:["am","was","were","would be"],answer:2,explanation:"'If I were you' — subjunctive form for advice.",level:"B1",topic:"Conditionals"},{id:"gv116",skill:"grammar",type:"multiple-choice",prompt:"Had I known about the traffic, I ____ earlier.",options:["would leave","would have left","had left","will leave"],answer:1,explanation:"Inverted third conditional ('Had I known...') needs 'would have + participle'.",level:"C1",topic:"Inversion"},{id:"gv117",skill:"grammar",type:"multiple-choice",prompt:"It's high time we ____ this problem seriously.",options:["take","took","have taken","are taking"],answer:1,explanation:"'It's high time' + past tense expresses that something should already be happening.",level:"C1",topic:"Unreal past"},{id:"gv118",skill:"grammar",type:"multiple-choice",prompt:"Supposing you ____ the lottery, what would you do?",options:["win","won","had won","would win"],answer:1,explanation:"'Supposing' introduces a hypothetical; second conditional uses past simple.",level:"B2",topic:"Conditionals"},{id:"gv119",skill:"grammar",type:"multiple-choice",prompt:"I'd rather you ____ smoke in here.",options:["don't","didn't","won't","not"],answer:1,explanation:"'would rather' + subject + past tense expresses a preference about another person.",level:"B2",topic:"Preferences"},{id:"gv120",skill:"grammar",type:"multiple-choice",prompt:"You ____ have told me — I had no idea!",options:["should","must","can","would"],answer:0,explanation:"'should have + participle' criticises a past action that didn't happen.",level:"B2",topic:"Modal perfect"},{id:"gv121",skill:"grammar",type:"multiple-choice",prompt:"The lights are off, so they ____ have gone to bed.",options:["can","must","should","would"],answer:1,explanation:"'must have' expresses a confident deduction about the past.",level:"B2",topic:"Modals of deduction"},{id:"gv122",skill:"grammar",type:"multiple-choice",prompt:"She ____ be at work — I saw her at home five minutes ago.",options:["mustn't","can't","shouldn't","wouldn't"],answer:1,explanation:"'can't' expresses a confident negative deduction in the present.",level:"B2",topic:"Modals of deduction"},{id:"gv123",skill:"grammar",type:"multiple-choice",prompt:"You ____ worry about the deadline; it's been extended.",options:["mustn't","don't have to","needn't have","can't"],answer:1,explanation:"'don't have to' expresses a lack of obligation.",level:"B1",topic:"Modals of obligation"},{id:"gv124",skill:"grammar",type:"multiple-choice",prompt:"We ____ have booked — the restaurant was completely empty.",options:["needn't","mustn't","couldn't","shouldn't"],answer:0,explanation:"'needn't have + participle' means an action was done but was unnecessary.",level:"C1",topic:"Modal perfect"},{id:"gv125",skill:"grammar",type:"multiple-choice",prompt:"Visitors ____ wear a badge at all times in the building.",options:["must","would","could","might"],answer:0,explanation:"'must' for a strong rule or obligation.",level:"B1",topic:"Modals of obligation"},{id:"gv126",skill:"grammar",type:"multiple-choice",prompt:"The bridge ____ in the 19th century.",options:["built","was built","has built","is building"],answer:1,explanation:"Passive: 'be' + past participle; past event → 'was built'.",level:"B1",topic:"Passive voice"},{id:"gv127",skill:"grammar",type:"multiple-choice",prompt:"I need to ____ my hair cut before the interview.",options:["make","do","get","take"],answer:2,explanation:"Causative 'get/have something done' — 'get my hair cut'.",level:"B2",topic:"Causative"},{id:"gv128",skill:"grammar",type:"multiple-choice",prompt:"The report ____ by the end of the week.",options:["will finish","will be finished","finishes","is finishing"],answer:1,explanation:"Future passive: 'will be + past participle'.",level:"B2",topic:"Passive voice"},{id:"gv129",skill:"grammar",type:"multiple-choice",prompt:"It ____ that the company will announce job cuts.",options:["expects","is expected","expecting","has expected"],answer:1,explanation:"Impersonal passive 'It is expected that...' reports general belief.",level:"C1",topic:"Passive voice"},{id:"gv130",skill:"grammar",type:"multiple-choice",prompt:"She asked me where ____.",options:["do I live","I live","did I live","I lived"],answer:3,explanation:"Reported questions use statement word order and backshift: 'where I lived'.",level:"B2",topic:"Reported speech"},{id:"gv131",skill:"grammar",type:"multiple-choice",prompt:"He told me he ____ the film the previous week.",options:["saw","has seen","had seen","sees"],answer:2,explanation:"Backshift: past simple in direct speech → past perfect in reported speech.",level:"B2",topic:"Reported speech"},{id:"gv132",skill:"grammar",type:"multiple-choice",prompt:"They warned us ____ the icy path.",options:["don't take","not to take","not taking","to not take"],answer:1,explanation:"Reported warnings/instructions: 'warn someone not to do'.",level:"B2",topic:"Reported speech"},{id:"gv133",skill:"grammar",type:"multiple-choice",prompt:"The woman ____ car was stolen reported it to the police.",options:["who","whom","whose","which"],answer:2,explanation:"'whose' shows possession in a relative clause.",level:"B1",topic:"Relative clauses"},{id:"gv134",skill:"grammar",type:"multiple-choice",prompt:"The hotel, ____ we stayed last summer, has closed down.",options:["which","where","that","who"],answer:1,explanation:"'where' introduces a non-defining clause about a place.",level:"B2",topic:"Relative clauses"},{id:"gv135",skill:"grammar",type:"multiple-choice",prompt:"This is the colleague ____ I was telling you about.",options:["which","whose","who","what"],answer:2,explanation:"'who' for a person as object of the clause ('that' also possible; 'what' is wrong).",level:"B1",topic:"Relative clauses"},{id:"gv136",skill:"grammar",type:"multiple-choice",prompt:"Not only ____ late, but he also forgot the documents.",options:["he was","was he","he is","did he was"],answer:1,explanation:"After a negative adverbial ('Not only'), the subject and auxiliary invert.",level:"C1",topic:"Inversion"},{id:"gv137",skill:"grammar",type:"multiple-choice",prompt:"Rarely ____ such a talented young musician.",options:["I have seen","have I seen","I saw","did I saw"],answer:1,explanation:"Fronted 'Rarely' triggers inversion of auxiliary and subject.",level:"C1",topic:"Inversion"},{id:"gv138",skill:"grammar",type:"multiple-choice",prompt:"No sooner ____ the door than the phone rang.",options:["I had opened","had I opened","I opened","did I open"],answer:1,explanation:"'No sooner...than' requires inversion with past perfect.",level:"C1",topic:"Inversion"},{id:"gv139",skill:"grammar",type:"multiple-choice",prompt:"Only after the meeting ____ the full picture.",options:["I understood","did I understand","I did understand","understood I"],answer:1,explanation:"'Only after...' fronted triggers do-inversion.",level:"C1",topic:"Inversion"},{id:"gv140",skill:"grammar",type:"multiple-choice",prompt:"I don't remember ____ the door — maybe I forgot.",options:["to lock","locking","lock","locked"],answer:1,explanation:"'remember + -ing' refers to a memory of a past action.",level:"B2",topic:"Gerunds and infinitives"},{id:"gv141",skill:"grammar",type:"multiple-choice",prompt:"She stopped ____ a break because she was tired.",options:["to have","having","have","had"],answer:0,explanation:"'stop + to-infinitive' = pause in order to do something.",level:"B2",topic:"Gerunds and infinitives"},{id:"gv142",skill:"grammar",type:"multiple-choice",prompt:"We look forward to ____ from you soon.",options:["hear","hearing","heard","be hearing"],answer:1,explanation:"'look forward to' is followed by a gerund (to = preposition).",level:"B1",topic:"Verb patterns"},{id:"gv143",skill:"grammar",type:"multiple-choice",prompt:"He suggested ____ to the coast for the weekend.",options:["to go","going","that go","we to go"],answer:1,explanation:"'suggest + -ing' (or 'suggest that we go'); 'suggest to go' is incorrect.",level:"B2",topic:"Verb patterns"},{id:"gv144",skill:"grammar",type:"multiple-choice",prompt:"I can't afford ____ a new laptop right now.",options:["buying","to buy","buy","bought"],answer:1,explanation:"'afford' takes a to-infinitive.",level:"B1",topic:"Verb patterns"},{id:"gv145",skill:"grammar",type:"multiple-choice",prompt:"They made us ____ for over an hour.",options:["to wait","waiting","wait","waited"],answer:2,explanation:"'make someone do' — bare infinitive after 'make' in the active.",level:"B1",topic:"Verb patterns"},{id:"gv146",skill:"grammar",type:"multiple-choice",prompt:"She's ____ honest person you could ever meet.",options:["a most","the most","most","a more"],answer:1,explanation:"Superlative with 'the most'.",level:"B1",topic:"Superlatives"},{id:"gv147",skill:"grammar",type:"multiple-choice",prompt:"There isn't ____ evidence to support that claim.",options:["many","much","a few","several"],answer:1,explanation:"'much' with uncountable 'evidence'.",level:"B1",topic:"Quantifiers"},{id:"gv148",skill:"grammar",type:"multiple-choice",prompt:"____ of the two options is more suitable?",options:["What","Which","That","Who"],answer:1,explanation:"'Which' for a choice within a limited, known set.",level:"B1",topic:"Determiners"},{id:"gv149",skill:"grammar",type:"multiple-choice",prompt:"We had ____ little time that we had to rush.",options:["so","such","very","too"],answer:0,explanation:"'so + adjective/adverb' ('so little time'); 'such' would need a noun phrase.",level:"B2",topic:"So / such"},{id:"gv150",skill:"grammar",type:"multiple-choice",prompt:"Hardly ____ students attended the optional lecture.",options:["some","any","no","much"],answer:1,explanation:"'hardly any' = almost none, with countable plural.",level:"B2",topic:"Quantifiers"},{id:"gv151",skill:"grammar",type:"multiple-choice",prompt:"Neither of the answers ____ correct, unfortunately.",options:["are","is","were","be"],answer:1,explanation:"'Neither of' + plural noun typically takes a singular verb in formal use.",level:"B2",topic:"Subject-verb agreement"},{id:"gv152",skill:"grammar",type:"multiple-choice",prompt:"____ the heavy rain, the match went ahead.",options:["Although","Despite","However","Because"],answer:1,explanation:"'Despite' + noun phrase; 'Although' would need a clause.",level:"B2",topic:"Linkers"},{id:"gv153",skill:"grammar",type:"multiple-choice",prompt:"The plan is risky; ____, it's our only option.",options:["therefore","nevertheless","moreover","otherwise"],answer:1,explanation:"'nevertheless' signals contrast/concession.",level:"B2",topic:"Linkers"},{id:"gv154",skill:"grammar",type:"multiple-choice",prompt:"Take an umbrella ____ it rains later.",options:["in case","in case of","so that","unless"],answer:0,explanation:"'in case' + clause expresses precaution.",level:"B2",topic:"Linkers"},{id:"gv155",skill:"grammar",type:"multiple-choice",prompt:"She spoke quietly ____ not to wake the baby.",options:["so as","in order","so that","such as"],answer:0,explanation:"'so as not to + infinitive' expresses negative purpose.",level:"B2",topic:"Linkers"},{id:"gv156",skill:"grammar",type:"multiple-choice",prompt:"____ working hard, he never seems to get promoted.",options:["Despite","In spite","Although of","Even"],answer:0,explanation:"'Despite + -ing'; the others are grammatically wrong here.",level:"B2",topic:"Linkers"},{id:"gv157",skill:"grammar",type:"multiple-choice",prompt:"The more you practise, ____ you become.",options:["the better","better","the best","more better"],answer:0,explanation:"Double comparative structure: 'the more..., the better...'.",level:"B2",topic:"Comparatives"},{id:"gv158",skill:"grammar",type:"multiple-choice",prompt:"This year's results are ____ than last year's.",options:["far more good","much better","more better","the better"],answer:1,explanation:"'much better' — 'better' is already comparative; intensified by 'much'.",level:"B1",topic:"Comparatives"},{id:"gv159",skill:"grammar",type:"multiple-choice",prompt:"It wasn't ____ difficult as I had feared.",options:["so","as","more","such"],answer:1,explanation:"'as...as' for equality; 'not as difficult as'.",level:"B1",topic:"Comparatives"},{id:"gv160",skill:"grammar",type:"word-formation",prompt:"The new policy was met with widespread ____. (APPROVE)",options:["approval","approvation","approvement","approved"],answer:0,explanation:"Noun from 'approve' is 'approval'.",level:"B2",topic:"Word formation"},{id:"gv161",skill:"grammar",type:"word-formation",prompt:"His ____ to detail makes him an excellent editor. (ATTEND)",options:["attendance","attention","attentive","attending"],answer:1,explanation:"'attention to detail' — the correct noun collocation.",level:"B2",topic:"Word formation"},{id:"gv162",skill:"grammar",type:"word-formation",prompt:"The medicine had no ____ effect on her symptoms. (NOTICE)",options:["noticing","noticed","noticeable","notice"],answer:2,explanation:"Adjective 'noticeable' modifies 'effect'.",level:"B2",topic:"Word formation"},{id:"gv163",skill:"grammar",type:"word-formation",prompt:"They demanded the ____ of the faulty products. (WITHDRAW)",options:["withdrawal","withdrawn","withdrawing","withdrawment"],answer:0,explanation:"Noun form is 'withdrawal'.",level:"C1",topic:"Word formation"},{id:"gv164",skill:"grammar",type:"word-formation",prompt:"The instructions were completely ____. (COMPREHEND)",options:["comprehension","comprehensive","incomprehensible","comprehend"],answer:2,explanation:"Context ('completely ___') needs the negative adjective 'incomprehensible'.",level:"C1",topic:"Word formation"},{id:"gv165",skill:"grammar",type:"word-formation",prompt:"Her argument was both clear and ____. (PERSUADE)",options:["persuasion","persuasive","persuaded","persuadable"],answer:1,explanation:"Adjective 'persuasive' parallels 'clear'.",level:"B2",topic:"Word formation"},{id:"gv166",skill:"grammar",type:"word-formation",prompt:"We need a ____ solution, not a temporary fix. (LAST)",options:["lastly","lasting","lasted","lastingness"],answer:1,explanation:"Adjective 'lasting' = long-term.",level:"B2",topic:"Word formation"},{id:"gv167",skill:"grammar",type:"word-formation",prompt:"The scandal severely damaged the company's ____. (REPUTE)",options:["reputation","reputable","reputed","reputing"],answer:0,explanation:"Noun 'reputation'.",level:"B2",topic:"Word formation"},{id:"gv168",skill:"grammar",type:"phrasal-verb",prompt:"I need to ____ these figures before the meeting.",options:["look up to","go over","put up with","come across"],answer:1,explanation:"'go over' = review/check carefully.",level:"B2",topic:"Phrasal verbs"},{id:"gv169",skill:"grammar",type:"phrasal-verb",prompt:"The meeting was ____ until next Tuesday.",options:["put off","put on","put up","put out"],answer:0,explanation:"'put off' = postpone.",level:"B1",topic:"Phrasal verbs"},{id:"gv170",skill:"grammar",type:"phrasal-verb",prompt:"She ____ a fortune when her aunt died.",options:["came into","came across","came round","came up"],answer:0,explanation:"'come into' = inherit (money/property).",level:"C1",topic:"Phrasal verbs"},{id:"gv171",skill:"grammar",type:"phrasal-verb",prompt:"Don't ____ — we're almost at the summit!",options:["give in","give up","give off","give away"],answer:1,explanation:"'give up' = stop trying/quit.",level:"B1",topic:"Phrasal verbs"},{id:"gv172",skill:"grammar",type:"phrasal-verb",prompt:"How did you ____ that strange conclusion?",options:["come up with","get away with","catch up on","put down to"],answer:0,explanation:"'come up with' = produce/think of (an idea/answer).",level:"B2",topic:"Phrasal verbs"},{id:"gv173",skill:"grammar",type:"phrasal-verb",prompt:"The company had to ____ 200 workers last year.",options:["lay off","lay out","lay down","lay into"],answer:0,explanation:"'lay off' = make redundant / dismiss for economic reasons.",level:"B2",topic:"Phrasal verbs"},{id:"gv174",skill:"grammar",type:"phrasal-verb",prompt:"I can't ____ his constant complaining any longer.",options:["put up with","put down to","put through to","put across"],answer:0,explanation:"'put up with' = tolerate.",level:"B2",topic:"Phrasal verbs"},{id:"gv175",skill:"grammar",type:"phrasal-verb",prompt:"The negotiations eventually ____ due to a lack of trust.",options:["broke down","broke up","broke out","broke in"],answer:0,explanation:"'break down' = fail/collapse (of talks, machines).",level:"B2",topic:"Phrasal verbs"},{id:"gv176",skill:"grammar",type:"phrasal-verb",prompt:"Please ____ your shoes before entering.",options:["take off","take up","take in","take over"],answer:0,explanation:"'take off' = remove (clothing).",level:"B1",topic:"Phrasal verbs"},{id:"gv177",skill:"grammar",type:"phrasal-verb",prompt:"A fire ____ in the warehouse overnight.",options:["broke out","broke down","broke up","broke off"],answer:0,explanation:"'break out' = start suddenly (fire, war, disease).",level:"B2",topic:"Phrasal verbs"},{id:"gv178",skill:"grammar",type:"collocation",prompt:"The new evidence could ____ serious doubt on the verdict.",options:["make","cast","put","throw"],answer:1,explanation:"'cast doubt on' is the fixed collocation.",level:"C1",topic:"Collocations"},{id:"gv179",skill:"grammar",type:"collocation",prompt:"She always ____ a good impression on clients.",options:["does","makes","takes","gives"],answer:1,explanation:"'make an impression' — collocation with 'make'.",level:"B2",topic:"Collocations"},{id:"gv180",skill:"grammar",type:"collocation",prompt:"Let's ____ a decision before the deadline.",options:["make","do","take","get"],answer:0,explanation:"'make a decision' (BrE); 'take a decision' is also possible but 'make' is standard.",level:"B1",topic:"Collocations"},{id:"gv181",skill:"grammar",type:"collocation",prompt:"The company failed to ____ its targets this quarter.",options:["reach","meet","arrive","catch"],answer:1,explanation:"'meet a target' is the standard business collocation.",level:"B2",topic:"Collocations"},{id:"gv182",skill:"grammar",type:"collocation",prompt:"He ____ a fortune running his own business.",options:["did","made","took","won"],answer:1,explanation:"'make a fortune' — collocation with 'make'.",level:"B2",topic:"Collocations"},{id:"gv183",skill:"grammar",type:"collocation",prompt:"I'd like to ____ your attention to page five.",options:["bring","draw","take","pull"],answer:1,explanation:"'draw someone's attention to' is the fixed phrase.",level:"B2",topic:"Collocations"},{id:"gv184",skill:"grammar",type:"collocation",prompt:"We need to ____ action to address climate change.",options:["do","make","take","have"],answer:2,explanation:"'take action' — collocation with 'take'.",level:"B1",topic:"Collocations"},{id:"gv185",skill:"grammar",type:"collocation",prompt:"The article ____ light on a little-known problem.",options:["puts","sheds","makes","gives"],answer:1,explanation:"'shed light on' = clarify/explain.",level:"C1",topic:"Collocations"},{id:"gv186",skill:"grammar",type:"multiple-choice",prompt:"She's very good ____ solving complex problems.",options:["in","at","on","with"],answer:1,explanation:"'good at + -ing'.",level:"B1",topic:"Prepositions"},{id:"gv187",skill:"grammar",type:"multiple-choice",prompt:"The decision was made ____ the interests of the students.",options:["for","in","on","at"],answer:1,explanation:"'in the interests of' is the fixed phrase.",level:"B2",topic:"Prepositions"},{id:"gv188",skill:"grammar",type:"multiple-choice",prompt:"I'm not familiar ____ this software.",options:["to","of","with","for"],answer:2,explanation:"'familiar with'.",level:"B1",topic:"Prepositions"},{id:"gv189",skill:"grammar",type:"multiple-choice",prompt:"They accused him ____ stealing the documents.",options:["for","of","with","about"],answer:1,explanation:"'accuse someone of + -ing'.",level:"B2",topic:"Prepositions"},{id:"gv190",skill:"grammar",type:"multiple-choice",prompt:"The success of the project depends ____ careful planning.",options:["of","from","on","in"],answer:2,explanation:"'depend on'.",level:"B1",topic:"Prepositions"},{id:"gv191",skill:"grammar",type:"multiple-choice",prompt:"She apologised ____ being late.",options:["of","for","about","at"],answer:1,explanation:"'apologise for + -ing'.",level:"B1",topic:"Prepositions"},{id:"gv192",skill:"grammar",type:"multiple-choice",prompt:"There's no point ____ arguing about it now.",options:["of","to","in","for"],answer:2,explanation:"'no point in + -ing'.",level:"B2",topic:"Prepositions"},{id:"gv193",skill:"grammar",type:"synonym",prompt:"Choose the word closest in meaning to 'meticulous'.",options:["careless","thorough","hasty","reluctant"],answer:1,explanation:"'meticulous' = extremely careful and precise, i.e. thorough.",level:"C1",topic:"Synonyms"},{id:"gv194",skill:"grammar",type:"synonym",prompt:"Choose the word closest in meaning to 'abundant'.",options:["scarce","plentiful","hidden","costly"],answer:1,explanation:"'abundant' = existing in large quantities, i.e. plentiful.",level:"B2",topic:"Synonyms"},{id:"gv195",skill:"grammar",type:"synonym",prompt:"Choose the word closest in meaning to 'reluctant'.",options:["eager","unwilling","confident","curious"],answer:1,explanation:"'reluctant' = unwilling/hesitant.",level:"B2",topic:"Synonyms"},{id:"gv196",skill:"grammar",type:"synonym",prompt:"Choose the word closest in meaning to 'crucial'.",options:["optional","essential","minor","temporary"],answer:1,explanation:"'crucial' = extremely important, i.e. essential.",level:"B2",topic:"Synonyms"},{id:"gv197",skill:"grammar",type:"synonym",prompt:"Choose the word closest in meaning to 'vivid'.",options:["dull","vague","striking","faint"],answer:2,explanation:"'vivid' = producing strong, clear images, i.e. striking.",level:"B2",topic:"Synonyms"},{id:"gv198",skill:"grammar",type:"synonym",prompt:"Choose the word closest in meaning to 'inevitable'.",options:["avoidable","unavoidable","unlikely","sudden"],answer:1,explanation:"'inevitable' = certain to happen, i.e. unavoidable.",level:"C1",topic:"Synonyms"},{id:"gv199",skill:"grammar",type:"antonym",prompt:"Choose the word most nearly OPPOSITE to 'generous'.",options:["kind","stingy","wealthy","polite"],answer:1,explanation:"Opposite of 'generous' (giving) is 'stingy' (mean with money).",level:"B2",topic:"Antonyms"},{id:"gv200",skill:"grammar",type:"antonym",prompt:"Choose the word most nearly OPPOSITE to 'temporary'.",options:["brief","permanent","sudden","fragile"],answer:1,explanation:"Opposite of 'temporary' is 'permanent'.",level:"B1",topic:"Antonyms"},{id:"gv201",skill:"grammar",type:"antonym",prompt:"Choose the word most nearly OPPOSITE to 'expand'.",options:["grow","stretch","contract","widen"],answer:2,explanation:"Opposite of 'expand' is 'contract'.",level:"B2",topic:"Antonyms"},{id:"gv202",skill:"grammar",type:"antonym",prompt:"Choose the word most nearly OPPOSITE to 'confident'.",options:["certain","insecure","proud","calm"],answer:1,explanation:"Opposite of 'confident' is 'insecure'.",level:"B2",topic:"Antonyms"},{id:"gv203",skill:"grammar",type:"antonym",prompt:"Choose the word most nearly OPPOSITE to 'transparent'.",options:["clear","opaque","fragile","shiny"],answer:1,explanation:"Opposite of 'transparent' (see-through) is 'opaque'.",level:"C1",topic:"Antonyms"},{id:"gv204",skill:"grammar",type:"multiple-choice",prompt:"I was completely ____ when they announced the winner.",options:["over the moon","under the weather","in hot water","out of the blue"],answer:0,explanation:"'over the moon' = extremely happy.",level:"B2",topic:"Idioms"},{id:"gv205",skill:"grammar",type:"multiple-choice",prompt:"Learning the new system was a ____ at first.",options:["breath of fresh air","piece of cake","steep learning curve","walk in the park"],answer:2,explanation:"'steep learning curve' = difficult to learn quickly.",level:"B2",topic:"Idioms"},{id:"gv206",skill:"grammar",type:"multiple-choice",prompt:"Let's not beat ____ — what exactly went wrong?",options:["the clock","around the bush","the odds","a dead horse"],answer:1,explanation:"'beat around the bush' = avoid the main point.",level:"B2",topic:"Idioms"},{id:"gv207",skill:"grammar",type:"multiple-choice",prompt:"The project is finally ____ after months of delays.",options:["up in the air","back on track","in the dark","on thin ice"],answer:1,explanation:"'back on track' = progressing normally again.",level:"B2",topic:"Idioms"},{id:"gv208",skill:"grammar",type:"multiple-choice",prompt:"I'm feeling a bit ____ today, so I'll stay home.",options:["over the moon","under the weather","on cloud nine","in the loop"],answer:1,explanation:"'under the weather' = slightly ill.",level:"B1",topic:"Idioms"},{id:"gv209",skill:"grammar",type:"vocab",prompt:"The company had to ____ its prices to stay competitive.",options:["arise","lower","descend","fall"],answer:1,explanation:"'lower prices' — transitive verb for a deliberate reduction.",level:"B1",topic:"Vocabulary in context"},{id:"gv210",skill:"grammar",type:"vocab",prompt:"A ____ increase in temperature can affect the whole ecosystem.",options:["slight","tiny","shallow","narrow"],answer:0,explanation:"'slight increase' is the natural collocation for a small change.",level:"B2",topic:"Vocabulary in context"},{id:"gv211",skill:"grammar",type:"vocab",prompt:"The witness gave a ____ account of the accident.",options:["detailed","deep","thick","strong"],answer:0,explanation:"'detailed account' — a description with much information.",level:"B2",topic:"Vocabulary in context"},{id:"gv212",skill:"grammar",type:"vocab",prompt:"Regular exercise can ____ the risk of heart disease.",options:["lower","fall","drop","sink"],answer:0,explanation:"'lower the risk' — transitive collocation.",level:"B2",topic:"Vocabulary in context"},{id:"gv213",skill:"grammar",type:"vocab",prompt:"The instructions were ____, so nobody knew what to do.",options:["ambiguous","obvious","evident","certain"],answer:0,explanation:"'ambiguous' = open to more than one interpretation.",level:"C1",topic:"Vocabulary in context"},{id:"gv214",skill:"grammar",type:"vocab",prompt:"She has a ____ knowledge of European history.",options:["deep","thorough","high","large"],answer:1,explanation:"'thorough knowledge' is the standard collocation.",level:"B2",topic:"Vocabulary in context"},{id:"gv215",skill:"grammar",type:"multiple-choice",prompt:"I ____ get up early, but now I work from home.",options:["used to","use to","am used to","would used to"],answer:0,explanation:"'used to + infinitive' for past habits that are no longer true.",level:"B1",topic:"Used to / be used to"},{id:"gv216",skill:"grammar",type:"multiple-choice",prompt:"It took me a while to ____ driving on the left.",options:["used to","get used to","use to","be used"],answer:1,explanation:"'get used to + -ing' = become accustomed to.",level:"B2",topic:"Used to / be used to"},{id:"gv217",skill:"grammar",type:"multiple-choice",prompt:"When we were kids, we ____ spend every summer at the lake.",options:["would","used","are used to","did"],answer:0,explanation:"'would + infinitive' for repeated past actions (states excluded).",level:"B2",topic:"Past habits"}],yp=[{id:"rd001",skill:"reading",type:"sentence-comprehension",title:"Sentence comprehension 1",body:"For each sentence, choose the option that keeps the same meaning.",level:"B2",questions:[{id:"rd001q1",skill:"reading",type:"sentence-comprehension",prompt:'"The launch was postponed owing to bad weather." This means the launch was…',options:["cancelled forever","delayed because of the weather","moved to a sunnier place","a great success"],answer:1,explanation:'"Owing to" = because of; "postponed" = delayed.',level:"B2",topic:"Cause linkers"},{id:"rd001q2",skill:"reading",type:"sentence-comprehension",prompt:'"She rarely misses a deadline." This means she…',options:["is always late","usually meets deadlines","has no deadlines","never works"],answer:1,explanation:'"Rarely misses" means she almost always meets them.',level:"B1",topic:"Frequency adverbs"},{id:"rd001q3",skill:"reading",type:"sentence-comprehension",prompt:'"The proposal was turned down." This means it was…',options:["accepted","rejected","reversed","printed"],answer:1,explanation:'"Turn down" is a phrasal verb meaning to reject.',level:"B2",topic:"Phrasal verbs"}]},{id:"rd002",skill:"reading",type:"sentence-comprehension",title:"Sentence comprehension 2",body:"For each sentence, choose the option that keeps the same meaning.",level:"B2",questions:[{id:"rd002q1",skill:"reading",type:"sentence-comprehension",prompt:'"He could hardly contain his excitement." This means he was…',options:["very calm","extremely excited","slightly bored","quite angry"],answer:1,explanation:'"Could hardly contain" means he was almost unable to hide his excitement.',level:"B2",topic:"Idiomatic meaning"},{id:"rd002q2",skill:"reading",type:"sentence-comprehension",prompt:'"The two theories are at odds with each other." This means they…',options:["agree completely","conflict","are identical","are both wrong"],answer:1,explanation:'"At odds with" means in conflict/disagreement.',level:"C1",topic:"Idioms"},{id:"rd002q3",skill:"reading",type:"sentence-comprehension",prompt:'"Attendance has been declining steadily." This means it…',options:["rose sharply","stayed the same","fell gradually","doubled"],answer:2,explanation:'"Declining steadily" means falling gradually and consistently.',level:"B2",topic:"Describing trends"}]},{id:"rd003",skill:"reading",type:"gap-filling",title:"A short history of the bicycle",body:'The bicycle has changed remarkably little in its basic form. The earliest versions, built in the early nineteenth century, had no pedals at all; riders simply pushed along the ground with their feet. ___1___, this design was slow and awkward. When pedals were finally added to the front wheel, cycling became genuinely practical. ___2___, the wheels of these machines were enormous, which made them dangerous. The modern "safety bicycle", with two equal wheels and a chain, appeared in the 1880s. ___3___ it was safer, it quickly became popular with ordinary people. Today, ___4___ millions of design tweaks, the fundamental idea remains the same.',level:"B2",questions:[{id:"rd003q1",skill:"reading",type:"gap-filling",prompt:"Gap 1",options:["Therefore","However","For example","Moreover"],answer:1,explanation:'A contrast is needed between the idea and its drawback: "However".',level:"B2",topic:"Cohesion (contrast)"},{id:"rd003q2",skill:"reading",type:"gap-filling",prompt:"Gap 2",options:["As a result","Unfortunately","In addition","Finally"],answer:1,explanation:'The dangerous wheels are a negative point: "Unfortunately".',level:"B2",topic:"Cohesion (attitude)"},{id:"rd003q3",skill:"reading",type:"gap-filling",prompt:"Gap 3",options:["Although","Because","Unless","Despite"],answer:1,explanation:'A reason clause fits: it became popular "Because" it was safer.',level:"B2",topic:"Cohesion (cause)"},{id:"rd003q4",skill:"reading",type:"gap-filling",prompt:"Gap 4",options:["despite","although","because of","in order to"],answer:0,explanation:'"Despite + noun phrase" concedes the many changes.',level:"B2",topic:"Cohesion (concession)"}]},{id:"rd004",skill:"reading",type:"gap-filling",title:"Working from home",body:"Remote work was once a rare privilege. ___1___, it has become normal for millions of employees. Supporters argue that it saves commuting time and gives people more control over their day. ___2___, critics point out that working from home can blur the line between work and rest. ___3___ these concerns, most surveys show that employees value the flexibility highly. ___4___, many companies now offer a mix of office and home days.",level:"B2",questions:[{id:"rd004q1",skill:"reading",type:"gap-filling",prompt:"Gap 1",options:["Nowadays","In the past","Rarely","Never"],answer:0,explanation:'A shift to the present is signalled: "Nowadays".',level:"B1",topic:"Cohesion (time)"},{id:"rd004q2",skill:"reading",type:"gap-filling",prompt:"Gap 2",options:["Similarly","However","Therefore","For instance"],answer:1,explanation:'The critics contrast with the supporters: "However".',level:"B2",topic:"Cohesion (contrast)"},{id:"rd004q3",skill:"reading",type:"gap-filling",prompt:"Gap 3",options:["Because of","Despite","Thanks to","Instead of"],answer:1,explanation:'"Despite these concerns" concedes the criticisms.',level:"B2",topic:"Cohesion (concession)"},{id:"rd004q4",skill:"reading",type:"gap-filling",prompt:"Gap 4",options:["As a result","Nevertheless","By contrast","Otherwise"],answer:0,explanation:'The hybrid model is a consequence: "As a result".',level:"B2",topic:"Cohesion (result)"}]},{id:"rd005",skill:"reading",type:"matching-headings",title:"Match the heading to each paragraph",body:`Paragraph A: Many people believe that drinking coffee is bad for you, but recent research suggests that moderate consumption may actually lower the risk of certain diseases.

Paragraph B: The key word, however, is "moderate". Drinking large amounts can cause anxiety, disturb sleep and raise blood pressure in sensitive individuals.

Paragraph C: If you enjoy coffee, the advice is simple: keep to two or three cups a day, avoid drinking it late in the evening, and pay attention to how your own body reacts.`,level:"B2",questions:[{id:"rd005q1",skill:"reading",type:"matching-headings",prompt:"Best heading for Paragraph A",options:["Practical advice for drinkers","A surprising health benefit","The dangers of too much","The history of coffee"],answer:1,explanation:"Paragraph A introduces an unexpected benefit of moderate coffee.",level:"B2",topic:"Main idea"},{id:"rd005q2",skill:"reading",type:"matching-headings",prompt:"Best heading for Paragraph B",options:["A surprising health benefit","The dangers of too much","Practical advice for drinkers","How coffee is grown"],answer:1,explanation:"Paragraph B warns about drinking large amounts.",level:"B2",topic:"Main idea"},{id:"rd005q3",skill:"reading",type:"matching-headings",prompt:"Best heading for Paragraph C",options:["The dangers of too much","A surprising health benefit","Practical advice for drinkers","Coffee around the world"],answer:2,explanation:"Paragraph C gives clear, practical recommendations.",level:"B2",topic:"Main idea"}]},{id:"rd006",skill:"reading",type:"matching-headings",title:"Match the heading (volunteering)",body:`Paragraph A: Volunteering is often seen as an act of pure generosity, a way of giving time to help others without expecting anything in return.

Paragraph B: Yet studies consistently show that volunteers themselves benefit enormously, reporting lower stress, wider social networks and a stronger sense of purpose.

Paragraph C: For anyone thinking of starting, experts recommend choosing a cause you genuinely care about and committing to a realistic number of hours each week.`,level:"B2",questions:[{id:"rd006q1",skill:"reading",type:"matching-headings",prompt:"Best heading for Paragraph A",options:["How to get started","A traditional view of giving","Hidden rewards for the helper","Problems with charities"],answer:1,explanation:"Paragraph A states the common, traditional view of volunteering.",level:"B2",topic:"Main idea"},{id:"rd006q2",skill:"reading",type:"matching-headings",prompt:"Best heading for Paragraph B",options:["Hidden rewards for the helper","A traditional view of giving","How to get started","The cost of volunteering"],answer:0,explanation:"Paragraph B describes benefits to the volunteers themselves.",level:"B2",topic:"Main idea"},{id:"rd006q3",skill:"reading",type:"matching-headings",prompt:"Best heading for Paragraph C",options:["A traditional view of giving","Hidden rewards for the helper","How to get started","Why people stop"],answer:2,explanation:"Paragraph C offers advice for beginners.",level:"B2",topic:"Main idea"}]},{id:"rd007",skill:"reading",type:"long-text",title:"The rise of the night train",body:`For decades, night trains across Europe seemed destined to disappear. Faced with cheap flights and high-speed daytime services, several operators withdrew their sleeper routes in the 2000s, arguing that they were expensive to run and increasingly unpopular. Carriages aged, timetables shrank, and many travellers assumed the era of sleeping compartments was over.

The last few years, however, have brought an unexpected revival. Growing awareness of the environmental cost of flying has pushed some passengers to look for slower, greener alternatives. A journey that takes ten hours overnight can replace a short flight while allowing travellers to arrive rested and in the city centre. Sensing this shift, a handful of railway companies have reopened old routes and even ordered new sleeper carriages for the first time in a generation.

The revival is not without difficulties. Night trains remain costly to operate, partly because a sleeping car carries far fewer paying passengers than a packed daytime train. Coordinating routes that cross several countries, each with its own rules and ticketing systems, is also complex. Supporters argue that targeted government support, similar to that given to other public transport, could keep the network growing. Whether the night train becomes a mainstream choice or remains a niche pleasure may depend less on nostalgia than on how seriously governments treat the climate argument.`,level:"B2",questions:[{id:"rd007q1",skill:"reading",type:"long-text",prompt:"Why did operators withdraw night trains in the 2000s?",options:["Passengers preferred older carriages","They were expensive and seemed unpopular","Governments banned them","Flights became more expensive"],answer:1,explanation:"Paragraph 1: operators argued the routes were expensive and increasingly unpopular.",level:"B2",topic:"Detail"},{id:"rd007q2",skill:"reading",type:"long-text",prompt:"What is the main reason for the recent revival?",options:["Cheaper tickets than flights","Faster journey times","Concern about the environment","A shortage of daytime trains"],answer:2,explanation:"Paragraph 2 links the revival to awareness of the environmental cost of flying.",level:"B2",topic:"Main idea"},{id:"rd007q3",skill:"reading",type:"long-text",prompt:"According to the text, one difficulty for night trains is that…",options:["they are too fast","they carry fewer paying passengers per car","no one wants to build carriages","they cannot cross borders"],answer:1,explanation:"Paragraph 3: a sleeping car carries far fewer paying passengers.",level:"B2",topic:"Detail"},{id:"rd007q4",skill:"reading",type:"long-text",prompt:"The writer suggests the future of night trains mainly depends on…",options:["nostalgia for the past","the price of sleeping cars","how seriously governments treat the climate argument","the number of tourists"],answer:2,explanation:"The final sentence points to government treatment of the climate argument.",level:"C1",topic:"Writer’s conclusion"}]},{id:"rd008",skill:"reading",type:"long-text",title:"Learning a language as an adult",body:`A common myth holds that adults simply cannot learn languages as well as children. It is true that very young children often pick up near-perfect accents with little apparent effort. However, research increasingly suggests that adults have real advantages of their own. They can use their existing knowledge of grammar, draw on a wider vocabulary in their first language, and study in a focused, strategic way that young children cannot.

What adults often lack is not ability but time and exposure. A child may hear a language for many hours a day, every day, for years. An adult learner, by contrast, might manage only a few hours a week between work and other commitments. When adults are given rich, regular exposure — for example by living abroad — their progress can be surprisingly fast.

Motivation also plays a decisive role. Adults who study because they must pass an exam sometimes make slower progress than those who learn because they love the culture, want to travel, or need the language for a job they enjoy. The lesson is encouraging: the main barriers for adult learners are practical and psychological, not biological.`,level:"B2",questions:[{id:"rd008q1",skill:"reading",type:"long-text",prompt:"What common belief does the text challenge?",options:["That children learn slowly","That adults cannot learn languages as well as children","That grammar is unimportant","That travel helps learning"],answer:1,explanation:"Paragraph 1 opens by naming and then challenging this myth.",level:"B2",topic:"Main idea"},{id:"rd008q2",skill:"reading",type:"long-text",prompt:"According to the writer, what advantage do adults have?",options:["A perfect accent","Unlimited free time","Existing knowledge of grammar and strategy","No need to study"],answer:2,explanation:"Paragraph 1 lists grammar knowledge and strategic study as adult strengths.",level:"B2",topic:"Detail"},{id:"rd008q3",skill:"reading",type:"long-text",prompt:"What does the writer say adults most often lack?",options:["Ability","Time and exposure","Intelligence","Interest in grammar"],answer:1,explanation:'Paragraph 2: "What adults often lack is not ability but time and exposure."',level:"B2",topic:"Detail"},{id:"rd008q4",skill:"reading",type:"long-text",prompt:"The overall tone of the conclusion is…",options:["pessimistic","encouraging","neutral","angry"],answer:1,explanation:'The final sentence calls the lesson "encouraging".',level:"B2",topic:"Tone"}]}],_g=[{id:"ls001",skill:"listening",type:"specific-information",title:"Voicemail: dentist appointment",body:"Hello, this is a message from Green Park Dental for Mr Owen. We're calling to confirm your appointment with the hygienist, not Doctor Shaw, on Thursday the fourteenth at half past three in the afternoon. If you need to change it, please call us before Wednesday. Remember to bring your insurance card. Thank you.",level:"B1",questions:[{id:"ls001q1",skill:"listening",type:"specific-information",prompt:"Who will the patient see?",options:["Doctor Shaw","The hygienist","The receptionist","A specialist"],answer:1,explanation:"The message says the appointment is with the hygienist, not Doctor Shaw.",level:"B1",topic:"Specific detail"},{id:"ls001q2",skill:"listening",type:"specific-information",prompt:"What time is the appointment?",options:["3:00","3:15","3:30","4:30"],answer:2,explanation:'"Half past three" = 3:30.',level:"B1",topic:"Numbers and time"},{id:"ls001q3",skill:"listening",type:"specific-information",prompt:"What should the patient bring?",options:["A photo","Their insurance card","Payment in cash","A previous X-ray"],answer:1,explanation:"The caller asks the patient to bring their insurance card.",level:"B1",topic:"Specific detail"}]},{id:"ls002",skill:"listening",type:"specific-information",title:"Announcement: station change",body:"Attention passengers. The ten forty-five service to Riverside has been moved from platform two to platform six due to a signalling problem. Passengers already waiting on platform two should make their way across the bridge. The train is now expected to depart eight minutes late. We apologise for the inconvenience.",level:"B1",questions:[{id:"ls002q1",skill:"listening",type:"specific-information",prompt:"Which platform should passengers go to now?",options:["Platform two","Platform four","Platform six","Platform eight"],answer:2,explanation:"The service has moved to platform six.",level:"B1",topic:"Specific detail"},{id:"ls002q2",skill:"listening",type:"specific-information",prompt:"Why has the platform changed?",options:["A signalling problem","Bad weather","A staff shortage","Overcrowding"],answer:0,explanation:"The change is due to a signalling problem.",level:"B2",topic:"Reason"},{id:"ls002q3",skill:"listening",type:"specific-information",prompt:"How late will the train be?",options:["Two minutes","Six minutes","Eight minutes","Ten minutes"],answer:2,explanation:"It is expected to depart eight minutes late.",level:"B1",topic:"Numbers"}]},{id:"ls003",skill:"listening",type:"inference",title:"Two colleagues discuss a plan",body:"Woman: So, are you happy with the new schedule? Man: Well, I can see why they've done it. Starting earlier does free up the afternoons. Woman: But? Man: But nobody actually asked us first. That's what bothers me. If they'd just talked to the team, I'd have far fewer objections. Woman: So it's not the plan itself. Man: Exactly. It's how they decided it.",level:"B2",questions:[{id:"ls003q1",skill:"listening",type:"inference",prompt:"What is the man’s main objection?",options:["The new hours are too long","The team was not consulted","Afternoons are now busier","He dislikes his colleagues"],answer:1,explanation:"He objects to how it was decided, because nobody asked the team first.",level:"B2",topic:"Speaker opinion"},{id:"ls003q2",skill:"listening",type:"inference",prompt:"How does the man feel about the plan itself?",options:["He completely rejects it","He can see its advantages","He finds it confusing","He has no opinion"],answer:1,explanation:"He admits starting earlier frees up afternoons, so he sees its benefit.",level:"B2",topic:"Attitude"}]},{id:"ls004",skill:"listening",type:"inference",title:"A review of a restaurant",body:"I'd been looking forward to this place for weeks, so maybe my expectations were too high. The food, I'll admit, was genuinely excellent — the fish was cooked perfectly. The problem was everything around it. We waited forty minutes just to order, the music was far too loud to hold a conversation, and the bill took ages to arrive. Would I go back? Honestly, probably not, and that's a real shame given how good the cooking was.",level:"B2",questions:[{id:"ls004q1",skill:"listening",type:"inference",prompt:"What did the speaker think of the food?",options:["Disappointing","Excellent","Average","Too spicy"],answer:1,explanation:"The speaker calls the food genuinely excellent.",level:"B2",topic:"Speaker opinion"},{id:"ls004q2",skill:"listening",type:"inference",prompt:"What was the main problem?",options:["The price","The service and atmosphere","The location","The portion size"],answer:1,explanation:'Slow service and loud music — "everything around" the food — were the problem.',level:"B2",topic:"Detail / inference"},{id:"ls004q3",skill:"listening",type:"inference",prompt:"Will the speaker return?",options:["Definitely yes","Probably not","Only for lunch","They didn’t say"],answer:1,explanation:'"Honestly, probably not" signals they won’t return.',level:"B2",topic:"Intention"}]},{id:"ls005",skill:"listening",type:"specific-information",title:"Instructions: joining the library",body:"To join the library, first bring proof of your address, such as a recent bill. You do not need a passport, just any letter with your name and address. Membership is free for residents. Once you have your card, you can borrow up to eight books at a time and keep them for three weeks. You can renew online unless someone else has reserved the item.",level:"B2",questions:[{id:"ls005q1",skill:"listening",type:"specific-information",prompt:"What must you bring to join?",options:["A passport","Proof of address","A photo","Money"],answer:1,explanation:"You need proof of address, such as a recent bill.",level:"B2",topic:"Specific detail"},{id:"ls005q2",skill:"listening",type:"specific-information",prompt:"How many books can you borrow at once?",options:["Three","Five","Eight","Ten"],answer:2,explanation:"Members can borrow up to eight books at a time.",level:"B1",topic:"Numbers"},{id:"ls005q3",skill:"listening",type:"specific-information",prompt:"When can you NOT renew online?",options:["If the book is new","If someone else has reserved it","On weekends","After three weeks"],answer:1,explanation:"You can renew online unless someone else has reserved the item.",level:"B2",topic:"Condition"}]},{id:"ls006",skill:"listening",type:"matching",title:"Match each speaker to their opinion about cities",body:"Speaker one: For me, the best thing about city life is that everything is close. I can walk to work, to the shops, to the theatre. I'd never want to depend on a car. Speaker two: I moved to the city for my career, but if I'm honest, I miss the quiet. The noise never really stops, and that wears you down after a while. Speaker three: What I love is the variety. There's always a new restaurant, a concert, an exhibition. You could live here for years and never run out of things to do.",level:"B2",questions:[{id:"ls006q1",skill:"listening",type:"matching",prompt:"Speaker one values most…",options:["Peace and quiet","Convenience and walkability","Cultural variety","Career opportunities"],answer:1,explanation:"Speaker one likes that everything is close and walkable.",level:"B2",topic:"Matching opinions"},{id:"ls006q2",skill:"listening",type:"matching",prompt:"Speaker two mainly…",options:["Loves the nightlife","Misses peace and quiet","Enjoys walking everywhere","Wants more restaurants"],answer:1,explanation:"Speaker two misses the quiet and dislikes the constant noise.",level:"B2",topic:"Matching opinions"},{id:"ls006q3",skill:"listening",type:"matching",prompt:"Speaker three is attracted by…",options:["Low cost of living","The variety of things to do","Short commutes","Fresh air"],answer:1,explanation:"Speaker three loves the variety: restaurants, concerts, exhibitions.",level:"B2",topic:"Matching opinions"}]},{id:"ls007",skill:"listening",type:"inference",title:"A phone call about a delivery",body:"Hi, it's about the sofa I ordered last month. I was told it would arrive today between nine and one, so I took the whole morning off work. It's now nearly two o'clock and there's still no sign of it, and no one answers the delivery line. I'm not angry about the delay itself — these things happen — but I would at least have appreciated a quick call to let me know. Could someone please phone me back today?",level:"B2",questions:[{id:"ls007q1",skill:"listening",type:"inference",prompt:"Why is the caller most frustrated?",options:["The sofa is the wrong colour","No one told them about the delay","The price was too high","The line was busy"],answer:1,explanation:"They say they’d have appreciated a call to warn them of the delay.",level:"B2",topic:"Speaker attitude"},{id:"ls007q2",skill:"listening",type:"inference",prompt:"What does the caller want?",options:["A refund","A call back today","A new order","A discount"],answer:1,explanation:"They ask someone to phone them back today.",level:"B2",topic:"Intention"}]}];function me(e,t,n,o,r,a,i,l="B1"){const c=`ls${100+e}`;return{id:c,skill:"listening",type:"specific-information",title:t,body:n,level:l,questions:[{id:`${c}q1`,skill:"listening",type:"specific-information",prompt:o,options:r,answer:a,explanation:i,level:l,topic:"Information recognition"}]}}const Ig=[me(1,"Dinner plans","Woman: What shall we have for dinner tonight? I could make pasta. Boy: We had pasta yesterday, Mum. Can we have fish? Woman: Fish? Really? I thought you hated it. Boy: Not the way Grandma makes it, with lemon. Woman: All right, fish it is.","What will they have for dinner?",["Pasta","Fish","Chicken"],1,"They agree on fish (“fish it is”). Pasta was yesterday; chicken is not mentioned.","B1"),me(2,"Train platform","Attention please. The 10.45 train to Manchester will now leave from platform six, not platform four as shown on the screens. Platform six, for the 10.45 to Manchester.","Which platform does the train leave from?",["Platform 4","Platform 6","Platform 10"],1,"The platform has changed from four to six.","B1"),me(3,"Birthday present","Man: Have you bought anything for Julia’s birthday yet? Woman: I was going to get her a book, but she reads everything on her tablet now. Man: What about a scarf? Woman: She has so many. I think I’ll get her some concert tickets. She loves live music.","What
